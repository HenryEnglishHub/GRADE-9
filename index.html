erience","C":"A guide to international airports","D":"Nam's project about pottery-making traditions"},"answer":"D","explanation":"Ý chính bao quát toàn đoạn là “Nam's project about pottery-making traditions”, đúng với hoạt động được giới thiệu ở đầu bài và phát triển xuyên suốt đoạn. Các đáp án khác không phản ánh nội dung chính."},{"number":54,"part":"PART 11 – READING COMPREHENSION","stem":"Where did Nam carry out the project?","passage":"A Craft Worker’S Skills\nNam is a Grade 9 student who recently completed a project about pottery-making traditions in Bat Trang. At first, Nam thought the project might be difficult because there was so much information to collect. However, things became easier after the student learnt to shape clay. An older community member offered useful advice and explained why the topic matters to local people. During the project, Nam received a small ceramic cup as a reminder of the experience. The student described the visit as skilled and was proud of completing the work. After returning to school, Nam prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Bat Trang","B":"New York","C":"Sydney","D":"London"},"answer":"A","explanation":"Địa điểm “Bat Trang” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “skilled” in the passage is CLOSEST in meaning to ______.","passage":"A Craft Worker’S Skills\nNam is a Grade 9 student who recently completed a project about pottery-making traditions in Bat Trang. At first, Nam thought the project might be difficult because there was so much information to collect. However, things became easier after the student learnt to shape clay. An older community member offered useful advice and explained why the topic matters to local people. During the project, Nam received a small ceramic cup as a reminder of the experience. The student described the visit as skilled and was proud of completing the work. After returning to school, Nam prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"unpleasant","B":"talented","C":"boring","D":"ordinary"},"answer":"B","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “talented”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"A Craft Worker’S Skills\nNam is a Grade 9 student who recently completed a project about pottery-making traditions in Bat Trang. At first, Nam thought the project might be difficult because there was so much information to collect. However, things became easier after the student learnt to shape clay. An older community member offered useful advice and explained why the topic matters to local people. During the project, Nam received a small ceramic cup as a reminder of the experience. The student described the visit as skilled and was proud of completing the work. After returning to school, Nam prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"the community member","B":"the teacher","C":"a classmate","D":"Nam"},"answer":"D","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Nam” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"A Craft Worker’S Skills\nNam is a Grade 9 student who recently completed a project about pottery-making traditions in Bat Trang. At first, Nam thought the project might be difficult because there was so much information to collect. However, things became easier after the student learnt to shape clay. An older community member offered useful advice and explained why the topic matters to local people. During the project, Nam received a small ceramic cup as a reminder of the experience. The student described the visit as skilled and was proud of completing the work. After returning to school, Nam prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Nam received a small ceramic cup during the project.","B":"Several classmates wanted to try a similar project.","C":"Nam gave a presentation at school.","D":"Nam kept the results secret and never presented them."},"answer":"D","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"The town is famous for its ______ buildings. (HISTORY)","answer":"historical","explanation":"Từ gốc trong ngoặc phải biến đổi thành “historical” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"Talking to a counsellor may help reduce your ______. (ANXIOUS)","answer":"anxiety","explanation":"Từ gốc trong ngoặc phải biến đổi thành “anxiety” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"The festival includes many ______ activities. (CULTURE)","answer":"cultural","explanation":"Từ gốc trong ngoặc phải biến đổi thành “cultural” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"The holiday was a wonderful and ______ experience. (MEMORY)","answer":"memorable","explanation":"Từ gốc trong ngoặc phải biến đổi thành “memorable” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"The children listened ______ to their grandmother. (CARE)","answer":"carefully","explanation":"Từ gốc trong ngoặc phải biến đổi thành “carefully” (trạng từ bổ nghĩa cho động từ). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"I do not know the time when I should leave. (WHEN)","answer":"I do not know when to leave.","explanation":"Đáp án mẫu: “I do not know when to leave.” Rút gọn mệnh đề gián tiếp: wh-word + to-infinitive."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"I was cleaning the room. Then my grandmother arrived. (WHEN)","answer":"I was cleaning the room when my grandmother arrived.","explanation":"Đáp án mẫu: “I was cleaning the room when my grandmother arrived.” So sánh kép: The + comparative..., the + comparative..."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"I have no bicycle, so I cannot join the cycling tour. (WISH)","answer":"I wish I had a bicycle so I could join the cycling tour.","explanation":"Đáp án mẫu: “I wish I had a bicycle so I could join the cycling tour.” Wish ở hiện tại: S + wish(es) + S + past simple / could + V."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"Lan started learning English in 2022. (SINCE)","answer":"Lan has learnt English since 2022.","explanation":"Đáp án mẫu: “Lan has learnt English since 2022.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"We / learn / about / local customs / since / last year.","answer":"We have learnt about local customs since last year.","explanation":"Câu hoàn chỉnh: “We have learnt about local customs since last year.” Hiện tại hoàn thành đi với since (mốc) hoặc for (khoảng thời gian)."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"My parents / decide / move / to the city / in 2020.","answer":"My parents decided to move to the city in 2020.","explanation":"Câu hoàn chỉnh: “My parents decided to move to the city in 2020.” Đúng dạng động từ sau động từ chính hoặc giới từ."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"Our class / take part in / three / community projects / so far.","answer":"Our class has taken part in three community projects so far.","explanation":"Câu hoàn chỉnh: “Our class has taken part in three community projects so far.” Sắp xếp đúng S–V–O, giới từ và thì theo mốc thời gian."}]},{"test":9,"title":"TEST 09 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"visited","B":"needed","C":"worked","D":"wanted"},"optionMarks":[{"word":"visited","marked":"ed"},{"word":"needed","marked":"ed"},{"word":"worked","marked":"ed"},{"word":"wanted","marked":"ed"}],"answer":"C","explanation":"Phần gạch chân trong “worked” đọc /t/; trong ba từ visited, needed, wanted đều đọc /ɪd/. Vì vậy “worked” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"pear","B":"wear","C":"bear","D":"hear"},"optionMarks":[{"word":"pear","marked":"ear"},{"word":"wear","marked":"ear"},{"word":"bear","marked":"ear"},{"word":"hear","marked":"ear"}],"answer":"D","explanation":"Phần gạch chân trong “hear” đọc /ɪə/; trong ba từ pear, wear, bear đều đọc /eə/. Vì vậy “hear” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"food","B":"good","C":"moon","D":"school"},"optionMarks":[{"word":"food","marked":"oo"},{"word":"good","marked":"oo"},{"word":"moon","marked":"oo"},{"word":"school","marked":"oo"}],"answer":"B","explanation":"Phần gạch chân trong “good” đọc /ʊ/; trong ba từ food, moon, school đều đọc /uː/. Vì vậy “good” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"finish","B":"ship","C":"fish","D":"machine"},"optionMarks":[{"word":"finish","marked":"i"},{"word":"ship","marked":"i"},{"word":"fish","marked":"i"},{"word":"machine","marked":"i"}],"answer":"D","explanation":"Phần gạch chân trong “machine” đọc /iː/; trong ba từ finish, ship, fish đều đọc /ɪ/. Vì vậy “machine” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"village","B":"local","C":"culture","D":"preserve"},"answer":"D","explanation":"“preserve” nhấn âm tiết thứ 2; village, local, culture đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"become","B":"ancient","C":"relax","D":"enjoy"},"answer":"B","explanation":"“ancient” nhấn âm tiết thứ 1; become, relax, enjoy đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"discover","B":"remember","C":"improve","D":"pottery"},"answer":"D","explanation":"“pottery” nhấn âm tiết thứ 1; discover, remember, improve đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"event","B":"collect","C":"custom","D":"return"},"answer":"C","explanation":"“custom” nhấn âm tiết thứ 1; event, collect, return đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"We should reduce the amount of plastic we use.","options":{"A":"cut","B":"increase","C":"decrease","D":"lower"},"answer":"B","keyword":"reduce","explanation":"“reduce” nghĩa là giảm bớt. “increase” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"Mai was delighted with her exam result.","options":{"A":"excited","B":"happy","C":"disappointed","D":"pleased"},"answer":"C","keyword":"delighted","explanation":"“delighted” nghĩa là vui mừng. “disappointed” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"We should preserve local traditions for future generations.","options":{"A":"maintain","B":"save","C":"destroy","D":"protect"},"answer":"C","keyword":"preserve","explanation":"“preserve” nghĩa là gìn giữ, bảo tồn. “destroy” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"The countryside was very peaceful at night.","options":{"A":"calm","B":"noisy","C":"quiet","D":"relaxing"},"answer":"B","keyword":"peaceful","explanation":"“peaceful” nghĩa là yên bình. “noisy” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"A local craft shop sells handmade souvenirs.","options":{"A":"distant","B":"foreign","C":"overseas","D":"nearby"},"answer":"D","keyword":"handmade","explanation":"“handmade” nghĩa là làm thủ công. “nearby” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"We were fortunate to find a helpful guide.","options":{"A":"unhappy","B":"lucky","C":"unprepared","D":"unlucky"},"answer":"B","keyword":"fortunate","explanation":"“fortunate” nghĩa là may mắn. “lucky” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"Nam was anxious about the coming test.","options":{"A":"worried","B":"satisfied","C":"excited","D":"calm"},"answer":"A","keyword":"anxious","explanation":"“anxious” nghĩa là lo lắng. “worried” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"The roads are congested during rush hour.","options":{"A":"empty","B":"safe","C":"crowded","D":"quiet"},"answer":"C","keyword":"congested","explanation":"“congested” nghĩa là ùn tắc. “crowded” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Linh does not know ______ to find the cultural centre.","options":{"A":"who","B":"what","C":"which","D":"how"},"answer":"D","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to a countryside field trip.","options":{"A":"who","B":"where","C":"why","D":"when"},"answer":"A","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"cut down","B":"turned down","C":"passed down","D":"looked up"},"answer":"C","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Linh had to ______ an invitation to the club because of an exam.","options":{"A":"pass down","B":"find out","C":"get over","D":"turn down"},"answer":"D","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"the confidence","B":"more confident","C":"the most confident","D":"the more confident"},"answer":"D","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"long","B":"longer","C":"the longer","D":"the longest"},"answer":"C","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Linh feels anxious before the test, Linh ______ ask a teacher for advice.","options":{"A":"should","B":"did","C":"was","D":"would"},"answer":"A","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"mustn't","B":"should","C":"could","D":"might"},"answer":"A","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Linh ______ photos of the old town.","options":{"A":"is taking","B":"takes","C":"has taken","D":"was taking"},"answer":"D","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Ha Giang, it began to rain.","options":{"A":"walk","B":"were walking","C":"have walked","D":"are walking"},"answer":"B","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the heritage house.","options":{"A":"lived","B":"have lived","C":"live","D":"will live"},"answer":"A","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Linh ______ a traditional pottery workshop.","options":{"A":"has visited","B":"visits","C":"was visiting","D":"visited"},"answer":"A","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Ha Giang since 2019.","options":{"A":"have lived","B":"live","C":"were living","D":"lived"},"answer":"A","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"to learn","B":"learning","C":"learned","D":"learn"},"answer":"B","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ a countryside field trip next month.","options":{"A":"organise","B":"organised","C":"organising","D":"to organise"},"answer":"D","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"Linh: \"Would you like to join us for a countryside field trip?\"  A friend: \"______\"","options":{"A":"No, I am not a place.","B":"Yes, I am like it.","C":"Yes, I would love to.","D":"That is my bicycle."},"answer":"C","explanation":"Đây là lời mời. Câu đáp “Yes, I would love to.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"Linh: \"I think preserving traditional customs is important.\"  A friend: \"______\"","options":{"A":"It was at 6 p.m.","B":"I am sorry you lost it.","C":"I completely agree with you.","D":"Never travel by bus."},"answer":"C","explanation":"Đây là tình huống giao tiếp trong đoạn hội thoại. Câu đáp “I completely agree with you.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"Linh: \"Could I use your dictionary for a moment?\"  A friend: \"______\"","options":{"A":"No, I am afraid of it.","B":"I have no idea where.","C":"Yes, I used it yesterday.","D":"Of course. Here you are."},"answer":"D","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “Of course. Here you are.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"Linh: \"How about visiting the local museum this Sunday?\"  A friend: \"______\"","options":{"A":"It is made of glass.","B":"That sounds like a great idea!","C":"How many kilometres?","D":"No, I have never been a museum."},"answer":"B","explanation":"Đây là tình huống giao tiếp trong đoạn hội thoại. Câu đáp “That sounds like a great idea!” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) She did not know (B) how to finding(C)  the way (D) to the craft village.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) how to find”. Sau từ để hỏi dùng to + động từ nguyên mẫu, không dùng V-ing."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The students enjoy (B) to learn(C)  about local customs (D) at school.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) learning”. Sau enjoy dùng V-ing."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) She (B) was reading(C)  a book when the lights (D) go out suddenly last night.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) went out suddenly last night.”. Hành động xảy ra đột ngột trong quá khứ dùng quá khứ đơn: went out."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) While my mother (B) was cooking(C)  dinner, I (D) was watch television.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) was watching television.”. Hành động đang xảy ra trong quá khứ dùng was/were + V-ing."},{"number":40,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"NOTICE – COMMUNITY READING DAY\nOur youth club has planned an activity this weekend. It aims (40) _____ students understand local life through practical tasks. Everyone interested (41) _____ the event should contact the club office. You can bring a storybook. Please arrive (42) _____ so the group can start on time.","options":{"A":"helped","B":"to help","C":"helping","D":"help"},"answer":"B","explanation":"“take part in” = tham gia. Đây là cụm cố định; không nói make/get/do part in."},{"number":41,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"NOTICE – COMMUNITY READING DAY\nOur youth club has planned an activity this weekend. It aims (40) _____ students understand local life through practical tasks. Everyone interested (41) _____ the event should contact the club office. You can bring a storybook. Please arrive (42) _____ so the group can start on time.","options":{"A":"on","B":"at","C":"for","D":"in"},"answer":"D","explanation":"“want + to V” là cấu trúc đúng: want to join the event."},{"number":42,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"NOTICE – COMMUNITY READING DAY\nOur youth club has planned an activity this weekend. It aims (40) _____ students understand local life through practical tasks. Everyone interested (41) _____ the event should contact the club office. You can bring a storybook. Please arrive (42) _____ so the group can start on time.","options":{"A":"early","B":"earlier","C":"earliest","D":"earliness"},"answer":"A","explanation":"“cut down on + noun” = cắt giảm điều gì. Giới từ bắt buộc là on."},{"number":43,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"School-Life Balance\nMany pupils in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"protect","B":"forget","C":"learn","D":"remember"},"answer":"B","explanation":"Sau how diễn đạt cách học dùng cấu trúc “how + to V”: how to learn."},{"number":44,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"School-Life Balance\nMany pupils in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"shared","B":"share","C":"sharing","D":"shares"},"answer":"B","explanation":"“find information” = tìm kiếm thông tin từ nguồn đáng tin cậy. Các phrasal verbs khác không hợp ngữ cảnh."},{"number":45,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"School-Life Balance\nMany pupils in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"learning","B":"learn","C":"to learn","D":"learned"},"answer":"A","explanation":"So sánh hai trạng thái mức độ hiểu biết: become + comparative adjective → more knowledgeable."},{"number":46,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"School-Life Balance\nMany pupils in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"are","B":"should","C":"would","D":"did"},"answer":"B","explanation":"Lời khuyên trong tình huống khó khăn dùng should + V: they should ask for advice."},{"number":47,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"School-Life Balance\nMany pupils in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"looked up","B":"turned down","C":"cut down","D":"passed down"},"answer":"D","explanation":"Trước danh từ “experience” cần tính từ bổ nghĩa: valuable experience = trải nghiệm quý giá."},{"number":48,"part":"PART 10 – READING TRUE / FALSE","stem":"The students went to Ninh Binh to learn about school-life balance.   T ☐    F ☐","passage":"Learning To Manage Stress\nLast Friday, a group of Grade 9 students visited Ninh Binh to learn about school-life balance. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a PE teacher, who explained the main ideas and gave practical examples. Each student received a weekly plan to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Bài đọc xác nhận ngay câu mở đầu: Last Friday, a group of Grade 9 students visited Ninh Binh to learn about school-life balance. Before the activity, their teacher asked them to prepar. Vì vậy phát biểu này đúng."},{"number":49,"part":"PART 10 – READING TRUE / FALSE","stem":"The students received no preparation instructions from their teacher.   T ☐    F ☐","passage":"Learning To Manage Stress\nLast Friday, a group of Grade 9 students visited Ninh Binh to learn about school-life balance. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a PE teacher, who explained the main ideas and gave practical examples. Each student received a weekly plan to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Trong đoạn, giáo viên yêu cầu học sinh chuẩn bị câu hỏi và mang sổ ghi chép; vì vậy nói “không hướng dẫn chuẩn bị” là sai."},{"number":50,"part":"PART 10 – READING TRUE / FALSE","stem":"They met a PE teacher during the activity.   T ☐    F ☐","passage":"Learning To Manage Stress\nLast Friday, a group of Grade 9 students visited Ninh Binh to learn about school-life balance. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a PE teacher, who explained the main ideas and gave practical examples. Each student received a weekly plan to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Đoạn văn ghi rõ học sinh gặp giáo viên tại nơi diễn ra hoạt động; vì vậy phát biểu đúng."},{"number":51,"part":"PART 10 – READING TRUE / FALSE","stem":"The activity continued until after midnight.   T ☐    F ☐","passage":"Learning To Manage Stress\nLast Friday, a group of Grade 9 students visited Ninh Binh to learn about school-life balance. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a PE teacher, who explained the main ideas and gave practical examples. Each student received a weekly plan to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"Learning To Manage Stress\nLast Friday, a group of Grade 9 students visited Ninh Binh to learn about school-life balance. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a PE teacher, who explained the main ideas and gave practical examples. Each student received a weekly plan to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"Teenage Wellbeing\nLinh is a Grade 9 student who recently completed a project about reducing school pressure in Ha Noi. At first, Linh thought the project might be difficult because there was so much information to collect. However, things became easier after the student attended a stress workshop. An older community member offered useful advice and explained why the topic matters to local people. During the project, Linh received a relaxation timetable as a reminder of the experience. The student described the visit as practical and was proud of completing the work. After returning to school, Linh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"An expensive shopping experience","B":"A guide to international airports","C":"The history of modern smartphones","D":"Linh's project about reducing school pressure"},"answer":"D","explanation":"Ý chính bao quát toàn đoạn là “Linh's project about reducing school pressure”, đúng với hoạt động được giới thiệu ở đầu bài và phát triển xuyên suốt đoạn. Các đáp án khác không phản ánh nội dung chính."},{"number":54,"part":"PART 11 – READING COMPREHENSION","stem":"Where did Linh carry out the project?","passage":"Teenage Wellbeing\nLinh is a Grade 9 student who recently completed a project about reducing school pressure in Ha Noi. At first, Linh thought the project might be difficult because there was so much information to collect. However, things became easier after the student attended a stress workshop. An older community member offered useful advice and explained why the topic matters to local people. During the project, Linh received a relaxation timetable as a reminder of the experience. The student described the visit as practical and was proud of completing the work. After returning to school, Linh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Ha Noi","B":"London","C":"New York","D":"Sydney"},"answer":"A","explanation":"Địa điểm “Ha Noi” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “practical” in the passage is CLOSEST in meaning to ______.","passage":"Teenage Wellbeing\nLinh is a Grade 9 student who recently completed a project about reducing school pressure in Ha Noi. At first, Linh thought the project might be difficult because there was so much information to collect. However, things became easier after the student attended a stress workshop. An older community member offered useful advice and explained why the topic matters to local people. During the project, Linh received a relaxation timetable as a reminder of the experience. The student described the visit as practical and was proud of completing the work. After returning to school, Linh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"boring","B":"unpleasant","C":"ordinary","D":"useful"},"answer":"D","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “useful”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"Teenage Wellbeing\nLinh is a Grade 9 student who recently completed a project about reducing school pressure in Ha Noi. At first, Linh thought the project might be difficult because there was so much information to collect. However, things became easier after the student attended a stress workshop. An older community member offered useful advice and explained why the topic matters to local people. During the project, Linh received a relaxation timetable as a reminder of the experience. The student described the visit as practical and was proud of completing the work. After returning to school, Linh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"the teacher","B":"a classmate","C":"Linh","D":"the community member"},"answer":"C","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Linh” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"Teenage Wellbeing\nLinh is a Grade 9 student who recently completed a project about reducing school pressure in Ha Noi. At first, Linh thought the project might be difficult because there was so much information to collect. However, things became easier after the student attended a stress workshop. An older community member offered useful advice and explained why the topic matters to local people. During the project, Linh received a relaxation timetable as a reminder of the experience. The student described the visit as practical and was proud of completing the work. After returning to school, Linh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Linh received a relaxation timetable during the project.","B":"Linh gave a presentation at school.","C":"Linh kept the results secret and never presented them.","D":"Several classmates wanted to try a similar project."},"answer":"C","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"Students should take ______ for their learning. (RESPONSIBLE)","answer":"responsibility","explanation":"Từ gốc trong ngoặc phải biến đổi thành “responsibility” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"The local market is a major tourist ______. (ATTRACT)","answer":"attraction","explanation":"Từ gốc trong ngoặc phải biến đổi thành “attraction” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"Online learning offers greater ______ to many students. (FLEXIBLE)","answer":"flexibility","explanation":"Từ gốc trong ngoặc phải biến đổi thành “flexibility” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"The pottery exhibition was extremely ______. (IMPRESS)","answer":"impressive","explanation":"Từ gốc trong ngoặc phải biến đổi thành “impressive” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"The school organised a ______ tour of the heritage site. (EDUCATE)","answer":"educational","explanation":"Từ gốc trong ngoặc phải biến đổi thành “educational” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"We began working on this project two months ago. (FOR)","answer":"We have worked on this project for two months.","explanation":"Đáp án mẫu: “We have worked on this project for two months.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"If you exercise more, you will become healthier. (THE)","answer":"The more you exercise, the healthier you will become.","explanation":"Đáp án mẫu: “The more you exercise, the healthier you will become.” So sánh kép: The + comparative..., the + comparative..."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"I do not have enough time to visit the museum. (WISH)","answer":"I wish I had enough time to visit the museum.","explanation":"Đáp án mẫu: “I wish I had enough time to visit the museum.” Wish ở hiện tại: S + wish(es) + S + past simple / could + V."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"She chose to join the art club. (DECIDED)","answer":"She decided to join the art club.","explanation":"Đáp án mẫu: “She decided to join the art club.” Các động từ như plan, decide, want đi với to-infinitive."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"If / you / want / reduce / stress / you / should / sleep / enough.","answer":"If you want to reduce stress, you should sleep enough.","explanation":"Câu hoàn chỉnh: “If you want to reduce stress, you should sleep enough.” Câu điều kiện loại 1: If + hiện tại đơn, S + modal/will + V."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"She / wish / she / have / more time / for exercise.","answer":"She wishes she had more time for exercise.","explanation":"Câu hoàn chỉnh: “She wishes she had more time for exercise.” Hiện tại hoàn thành đi với since (mốc) hoặc for (khoảng thời gian)."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"Last month / the students / decide / visit / a pottery village.","answer":"Last month, the students decided to visit a pottery village.","explanation":"Câu hoàn chỉnh: “Last month, the students decided to visit a pottery village.” So sánh kép dùng The + so sánh hơn ở cả hai vế."}]},{"test":10,"title":"TEST 10 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"night","B":"right","C":"eight","D":"bright"},"optionMarks":[{"word":"night","marked":"igh"},{"word":"right","marked":"igh"},{"word":"eight","marked":"eigh"},{"word":"bright","marked":"igh"}],"answer":"C","explanation":"Phần gạch chân trong “eight” đọc /eɪ/; trong ba từ night, right, bright đều đọc /aɪ/. Vì vậy “eight” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"put","B":"sun","C":"fun","D":"run"},"optionMarks":[{"word":"put","marked":"u"},{"word":"sun","marked":"u"},{"word":"fun","marked":"u"},{"word":"run","marked":"u"}],"answer":"A","explanation":"Phần gạch chân trong “put” đọc /ʊ/; trong ba từ sun, fun, run đều đọc /ʌ/. Vì vậy “put” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"road","B":"broad","C":"goat","D":"coat"},"optionMarks":[{"word":"road","marked":"oa"},{"word":"broad","marked":"oa"},{"word":"goat","marked":"oa"},{"word":"coat","marked":"oa"}],"answer":"B","explanation":"Phần gạch chân trong “broad” đọc /ɔː/; trong ba từ road, goat, coat đều đọc /əʊ/. Vì vậy “broad” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"fair","B":"hear","C":"chair","D":"pair"},"optionMarks":[{"word":"fair","marked":"air"},{"word":"hear","marked":"ear"},{"word":"chair","marked":"air"},{"word":"pair","marked":"air"}],"answer":"B","explanation":"Phần gạch chân trong “hear” đọc /ɪə/; trong ba từ fair, chair, pair đều đọc /eə/. Vì vậy “hear” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"preserve","B":"develop","C":"local","D":"attract"},"answer":"C","explanation":"“local” nhấn âm tiết thứ 1; preserve, develop, attract đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"travel","B":"market","C":"amazing","D":"village"},"answer":"C","explanation":"“amazing” nhấn âm tiết thứ 2; travel, market, village đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"polluted","B":"exciting","C":"traditional","D":"heritage"},"answer":"D","explanation":"“heritage” nhấn âm tiết thứ 1; polluted, exciting, traditional đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"relaxed","B":"helpful","C":"surprised","D":"amazed"},"answer":"B","explanation":"“helpful” nhấn âm tiết thứ 1; relaxed, surprised, amazed đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"The new bus service is affordable for students.","options":{"A":"cheap","B":"inexpensive","C":"reasonable","D":"expensive"},"answer":"D","keyword":"affordable","explanation":"“affordable” nghĩa là giá phải chăng. “expensive” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"Online booking is convenient for many travellers.","options":{"A":"easy","B":"practical","C":"inconvenient","D":"useful"},"answer":"C","keyword":"convenient","explanation":"“convenient” nghĩa là tiện lợi. “inconvenient” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"The city has a modern transport system.","options":{"A":"advanced","B":"updated","C":"recent","D":"old-fashioned"},"answer":"D","keyword":"modern","explanation":"“modern” nghĩa là hiện đại. “old-fashioned” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"This traditional tune sounded familiar to the villagers.","options":{"A":"recognisable","B":"unfamiliar","C":"known","D":"common"},"answer":"B","keyword":"traditional","explanation":"“traditional” nghĩa là truyền thống. “unfamiliar” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"The local restaurant serves affordable meals.","options":{"A":"pricey","B":"luxurious","C":"costly","D":"inexpensive"},"answer":"D","keyword":"affordable","explanation":"“affordable” nghĩa là giá phải chăng. “inexpensive” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"The town is proud of its cultural heritage.","options":{"A":"legacy","B":"traffic","C":"weather","D":"equipment"},"answer":"A","keyword":"heritage","explanation":"“heritage” nghĩa là di sản. “legacy” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"We visited an ancient citadel.","options":{"A":"new","B":"recent","C":"modern","D":"very old"},"answer":"D","keyword":"ancient","explanation":"“ancient” nghĩa là cổ xưa. “very old” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"The summer course was a great opportunity to practise English.","options":{"A":"chance","B":"danger","C":"mistake","D":"problem"},"answer":"A","keyword":"opportunity","explanation":"“opportunity” nghĩa là cơ hội. “chance” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"An does not know ______ to find the sports centre.","options":{"A":"who","B":"how","C":"what","D":"which"},"answer":"B","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to a youth sports festival.","options":{"A":"when","B":"who","C":"where","D":"why"},"answer":"B","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"looked up","B":"turned down","C":"passed down","D":"cut down"},"answer":"C","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"An had to ______ an invitation to the club because of an exam.","options":{"A":"turn down","B":"find out","C":"pass down","D":"get over"},"answer":"A","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"more confident","B":"the most confident","C":"the confidence","D":"the more confident"},"answer":"D","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"the longest","B":"long","C":"longer","D":"the longer"},"answer":"D","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If An feels anxious before the test, An ______ ask a teacher for advice.","options":{"A":"did","B":"was","C":"should","D":"would"},"answer":"C","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"mustn't","B":"could","C":"might","D":"should"},"answer":"A","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, An ______ photos of the old town.","options":{"A":"takes","B":"is taking","C":"was taking","D":"has taken"},"answer":"C","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Quy Nhon, it began to rain.","options":{"A":"have walked","B":"walk","C":"are walking","D":"were walking"},"answer":"D","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the town hall.","options":{"A":"live","B":"lived","C":"will live","D":"have lived"},"answer":"B","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time An ______ a traditional pottery workshop.","options":{"A":"visited","B":"was visiting","C":"has visited","D":"visits"},"answer":"C","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Quy Nhon since 2019.","options":{"A":"were living","B":"have lived","C":"live","D":"lived"},"answer":"B","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"to learn","B":"learn","C":"learned","D":"learning"},"answer":"D","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ a youth sports festival next month.","options":{"A":"organising","B":"to organise","C":"organise","D":"organised"},"answer":"B","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"An: \"Could I use your dictionary for a moment?\"  A friend: \"______\"","options":{"A":"I have no idea where.","B":"Of course. Here you are.","C":"Yes, I used it yesterday.","D":"No, I am afraid of it."},"answer":"B","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “Of course. Here you are.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"An: \"How about visiting the local museum this Sunday?\"  A friend: \"______\"","options":{"A":"It is made of glass.","B":"That sounds like a great idea!","C":"No, I have never been a museum.","D":"How many kilometres?"},"answer":"B","explanation":"Đây là tình huống giao tiếp trong đoạn hội thoại. Câu đáp “That sounds like a great idea!” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"A visitor: \"Could you tell me how to get to the local market?\"  A resident: \"______\"","options":{"A":"Yes, I have.","B":"I bought it yesterday.","C":"That is my favourite subject.","D":"Go straight ahead, then turn left."},"answer":"D","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “Go straight ahead, then turn left.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"An: \"Would you mind helping me carry these books?\"  A friend: \"______\"","options":{"A":"No, not at all.","B":"Thank you very much.","C":"I don't know where.","D":"Yes, I am tired."},"answer":"A","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “No, not at all.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) While my mother (B) was cooking(C)  dinner, I (D) was watch television.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) was watching television.”. Hành động đang xảy ra trong quá khứ dùng was/were + V-ing."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) This is the first time (B) we visit(C)  a pottery workshop (D) in Ha Noi.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) we have visited”. Xét cấu trúc câu, dạng động từ và dấu hiệu thời gian để sửa lỗi."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The more you practise, (B) the confident(C)  you will (D) become.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) the more confident”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) My brother decided (B) joining(C)  the volunteer club (D) last week.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) to join”. Sau decide dùng to-infinitive: decide to + V."},{"number":40,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – STUDENT FITNESS DAY\nOur school is organising Student Fitness Day next Friday. Students are encouraged to (40) _____ part and try healthy activities after class. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring sports shoes and help us cut down (42) _____ unnecessary waste.","options":{"A":"get","B":"do","C":"make","D":"take"},"answer":"D","explanation":"“take part in” = tham gia. Đây là cụm cố định; không nói make/get/do part in."},{"number":41,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – STUDENT FITNESS DAY\nOur school is organising Student Fitness Day next Friday. Students are encouraged to (40) _____ part and try healthy activities after class. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring sports shoes and help us cut down (42) _____ unnecessary waste.","options":{"A":"to join","B":"joined","C":"join","D":"joining"},"answer":"A","explanation":"“want + to V” là cấu trúc đúng: want to join the event."},{"number":42,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – STUDENT FITNESS DAY\nOur school is organising Student Fitness Day next Friday. Students are encouraged to (40) _____ part and try healthy activities after class. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring sports shoes and help us cut down (42) _____ unnecessary waste.","options":{"A":"from","B":"at","C":"on","D":"of"},"answer":"C","explanation":"“cut down on + noun” = cắt giảm điều gì. Giới từ bắt buộc là on."},{"number":43,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"City Transport Changes\nMany residents in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. As a result, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"to learn","B":"learned","C":"learning","D":"learn"},"answer":"A","explanation":"Sau how diễn đạt cách học dùng cấu trúc “how + to V”: how to learn."},{"number":44,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"City Transport Changes\nMany residents in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. As a result, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"turn down","B":"take off","C":"find","D":"give up"},"answer":"C","explanation":"“find information” = tìm kiếm thông tin từ nguồn đáng tin cậy. Các phrasal verbs khác không hợp ngữ cảnh."},{"number":45,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"City Transport Changes\nMany residents in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. As a result, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"more knowledgeable","B":"knowledgeably","C":"most knowledgeable","D":"knowledge"},"answer":"A","explanation":"So sánh hai trạng thái mức độ hiểu biết: become + comparative adjective → more knowledgeable."},{"number":46,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"City Transport Changes\nMany residents in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. As a result, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"did","B":"should","C":"were","D":"have"},"answer":"B","explanation":"Lời khuyên trong tình huống khó khăn dùng should + V: they should ask for advice."},{"number":47,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"City Transport Changes\nMany residents in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. As a result, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"freely","B":"more","C":"efficient","D":"quickly"},"answer":"C","explanation":"Trước danh từ “experience” cần tính từ bổ nghĩa: valuable experience = trải nghiệm quý giá."},{"number":48,"part":"PART 10 – READING TRUE / FALSE","stem":"The students went to Da Nang to learn about road safety.   T ☐    F ☐","passage":"Safer City Cycling\nLast Saturday, a group of Grade 9 students visited Da Nang to learn about road safety. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a traffic officer, who explained the main ideas and gave practical examples. Each student received a bicycle helmet to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Bài đọc xác nhận ngay câu mở đầu: Last Saturday, a group of Grade 9 students visited Da Nang to learn about road safety. Before the activity, their teacher asked them to prepare a few . Vì vậy phát biểu này đúng."},{"number":49,"part":"PART 10 – READING TRUE / FALSE","stem":"The students received no preparation instructions from their teacher.   T ☐    F ☐","passage":"Safer City Cycling\nLast Saturday, a group of Grade 9 students visited Da Nang to learn about road safety. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a traffic officer, who explained the main ideas and gave practical examples. Each student received a bicycle helmet to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Trong đoạn, giáo viên yêu cầu học sinh chuẩn bị câu hỏi và mang sổ ghi chép; vì vậy nói “không hướng dẫn chuẩn bị” là sai."},{"number":50,"part":"PART 10 – READING TRUE / FALSE","stem":"They met a traffic officer during the activity.   T ☐    F ☐","passage":"Safer City Cycling\nLast Saturday, a group of Grade 9 students visited Da Nang to learn about road safety. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a traffic officer, who explained the main ideas and gave practical examples. Each student received a bicycle helmet to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Đoạn văn ghi rõ học sinh gặp giáo viên tại nơi diễn ra hoạt động; vì vậy phát biểu đúng."},{"number":51,"part":"PART 10 – READING TRUE / FALSE","stem":"The activity continued until after midnight.   T ☐    F ☐","passage":"Safer City Cycling\nLast Saturday, a group of Grade 9 students visited Da Nang to learn about road safety. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a traffic officer, who explained the main ideas and gave practical examples. Each student received a bicycle helmet to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"Safer City Cycling\nLast Saturday, a group of Grade 9 students visited Da Nang to learn about road safety. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a traffic officer, who explained the main ideas and gave practical examples. Each student received a bicycle helmet to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"A Better City Commute\nAn is a Grade 9 student who recently completed a project about easier daily travel in Da Nang. At first, An thought the project might be difficult because there was so much information to collect. However, things became easier after the student tested a new bus route. An older community member offered useful advice and explained why the topic matters to local people. During the project, An received a bus timetable as a reminder of the experience. The student described the visit as convenient and was proud of completing the work. After returning to school, An prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"The history of modern smartphones","B":"An expensive shopping experience","C":"An's project about easier daily travel","D":"A guide to international airports"},"answer":"C","explanation":"Ý chính bao quát toàn đoạn là “An's project about easier daily travel”, đúng với hoạt động được giới thiệu ở đầu bài và phát triển xuyên suốt đoạn. Các đáp án khác không phản ánh nội dung chính."},{"number":54,"part":"PART 11 – READING COMPREHENSION","stem":"Where did An carry out the project?","passage":"A Better City Commute\nAn is a Grade 9 student who recently completed a project about easier daily travel in Da Nang. At first, An thought the project might be difficult because there was so much information to collect. However, things became easier after the student tested a new bus route. An older community member offered useful advice and explained why the topic matters to local people. During the project, An received a bus timetable as a reminder of the experience. The student described the visit as convenient and was proud of completing the work. After returning to school, An prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"New York","B":"Da Nang","C":"London","D":"Sydney"},"answer":"B","explanation":"Địa điểm “Da Nang” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “convenient” in the passage is CLOSEST in meaning to ______.","passage":"A Better City Commute\nAn is a Grade 9 student who recently completed a project about easier daily travel in Da Nang. At first, An thought the project might be difficult because there was so much information to collect. However, things became easier after the student tested a new bus route. An older community member offered useful advice and explained why the topic matters to local people. During the project, An received a bus timetable as a reminder of the experience. The student described the visit as convenient and was proud of completing the work. After returning to school, An prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"unpleasant","B":"boring","C":"ordinary","D":"practical"},"answer":"D","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “practical”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"A Better City Commute\nAn is a Grade 9 student who recently completed a project about easier daily travel in Da Nang. At first, An thought the project might be difficult because there was so much information to collect. However, things became easier after the student tested a new bus route. An older community member offered useful advice and explained why the topic matters to local people. During the project, An received a bus timetable as a reminder of the experience. The student described the visit as convenient and was proud of completing the work. After returning to school, An prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"a classmate","B":"the teacher","C":"the community member","D":"An"},"answer":"D","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “An” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"A Better City Commute\nAn is a Grade 9 student who recently completed a project about easier daily travel in Da Nang. At first, An thought the project might be difficult because there was so much information to collect. However, things became easier after the student tested a new bus route. An older community member offered useful advice and explained why the topic matters to local people. During the project, An received a bus timetable as a reminder of the experience. The student described the visit as convenient and was proud of completing the work. After returning to school, An prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"An kept the results secret and never presented them.","B":"Several classmates wanted to try a similar project.","C":"An received a bus timetable during the project.","D":"An gave a presentation at school."},"answer":"A","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"We admired the ______ of traditional wooden houses. (BEAUTIFUL)","answer":"beauty","explanation":"Từ gốc trong ngoặc phải biến đổi thành “beauty” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"City traffic can be very ______ during rush hour. (NOISE)","answer":"noisy","explanation":"Từ gốc trong ngoặc phải biến đổi thành “noisy” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"We were surprised by the ______ of the local people. (FRIEND)","answer":"friendliness","explanation":"Từ gốc trong ngoặc phải biến đổi thành “friendliness” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"The government is working to improve road ______. (SAFE)","answer":"safety","explanation":"Từ gốc trong ngoặc phải biến đổi thành “safety” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"The craftsperson was highly ______ and made every item carefully. (SKILL)","answer":"skilled","explanation":"Từ gốc trong ngoặc phải biến đổi thành “skilled” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"He did not know the place where he should park. (WHERE)","answer":"He did not know where to park.","explanation":"Đáp án mẫu: “He did not know where to park.” Rút gọn mệnh đề gián tiếp: wh-word + to-infinitive."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"If you practise speaking more, you will become more confident. (THE)","answer":"The more you practise speaking, the more confident you will become.","explanation":"Đáp án mẫu: “The more you practise speaking, the more confident you will become.” So sánh kép: The + comparative..., the + comparative..."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"He likes collecting old photographs. (ENJOYS)","answer":"He enjoys collecting old photographs.","explanation":"Đáp án mẫu: “He enjoys collecting old photographs.” Giữ nguyên nghĩa câu gốc đồng thời đổi cấu trúc phù hợp từ gợi ý."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"The last time Mai visited Hue was in 2021. (SINCE)","answer":"Mai has not visited Hue since 2021.","explanation":"Đáp án mẫu: “Mai has not visited Hue since 2021.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"the / more / we / read / the / more / we / understand / history.","answer":"The more we read, the more we understand history.","explanation":"Câu hoàn chỉnh: “The more we read, the more we understand history.” So sánh kép dùng The + so sánh hơn ở cả hai vế."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"If / you / feel / stressed / you / should / talk / teacher.","answer":"If you feel stressed, you should talk to a teacher.","explanation":"Câu hoàn chỉnh: “If you feel stressed, you should talk to a teacher.” Câu điều kiện loại 1: If + hiện tại đơn, S + modal/will + V."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"I / wish / my school / have / a bigger library.","answer":"I wish my school had a bigger library.","explanation":"Câu hoàn chỉnh: “I wish my school had a bigger library.” Sắp xếp đúng S–V–O, giới từ và thì theo mốc thời gian."}]},{"test":11,"title":"TEST 11 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"watches","B":"shops","C":"classes","D":"buses"},"optionMarks":[{"word":"watches","marked":"es"},{"word":"shops","marked":"s"},{"word":"classes","marked":"es"},{"word":"buses","marked":"es"}],"answer":"B","explanation":"Phần gạch chân trong “shops” đọc /s/; trong ba từ watches, classes, buses đều đọc /ɪz/. Vì vậy “shops” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"playe
