ince","D":"for"},"answer":"C","explanation":"Trước danh từ “experience” cần tính từ bổ nghĩa: valuable experience = trải nghiệm quý giá."},{"number":48,"part":"PART 10 – READING TRUE / FALSE","stem":"The students went to Da Nang to learn about public transport.   T ☐    F ☐","passage":"Modern Transport Project\nLast Thursday, a group of Grade 9 students visited Da Nang to learn about public transport. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a bus driver, who explained the main ideas and gave practical examples. Each student received a route map to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Bài đọc xác nhận ngay câu mở đầu: Last Thursday, a group of Grade 9 students visited Da Nang to learn about public transport. Before the activity, their teacher asked them to prepare a. Vì vậy phát biểu này đúng."},{"number":49,"part":"PART 10 – READING TRUE / FALSE","stem":"The students received no preparation instructions from their teacher.   T ☐    F ☐","passage":"Modern Transport Project\nLast Thursday, a group of Grade 9 students visited Da Nang to learn about public transport. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a bus driver, who explained the main ideas and gave practical examples. Each student received a route map to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Trong đoạn, giáo viên yêu cầu học sinh chuẩn bị câu hỏi và mang sổ ghi chép; vì vậy nói “không hướng dẫn chuẩn bị” là sai."},{"number":50,"part":"PART 10 – READING TRUE / FALSE","stem":"They met a bus driver during the activity.   T ☐    F ☐","passage":"Modern Transport Project\nLast Thursday, a group of Grade 9 students visited Da Nang to learn about public transport. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a bus driver, who explained the main ideas and gave practical examples. Each student received a route map to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Đoạn văn ghi rõ học sinh gặp giáo viên tại nơi diễn ra hoạt động; vì vậy phát biểu đúng."},{"number":51,"part":"PART 10 – READING TRUE / FALSE","stem":"The activity continued until after midnight.   T ☐    F ☐","passage":"Modern Transport Project\nLast Thursday, a group of Grade 9 students visited Da Nang to learn about public transport. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a bus driver, who explained the main ideas and gave practical examples. Each student received a route map to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"Modern Transport Project\nLast Thursday, a group of Grade 9 students visited Da Nang to learn about public transport. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a bus driver, who explained the main ideas and gave practical examples. Each student received a route map to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"Changing City Transport\nLan is a Grade 9 student who recently completed a project about new public transport routes in Da Nang. At first, Lan thought the project might be difficult because there was so much information to collect. However, things became easier after the student travelled by electric bus. An older community member offered useful advice and explained why the topic matters to local people. During the project, Lan received a reusable travel card as a reminder of the experience. The student described the visit as efficient and was proud of completing the work. After returning to school, Lan prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"An expensive shopping experience","B":"The history of modern smartphones","C":"Lan's project about new public transport routes","D":"A guide to international airports"},"answer":"C","explanation":"Ý chính bao quát toàn đoạn là “Lan's project about new public transport routes”, đúng với hoạt động được giới thiệu ở đầu bài và phát triển xuyên suốt đoạn. Các đáp án khác không phản ánh nội dung chính."},{"number":54,"part":"PART 11 – READING COMPREHENSION","stem":"Where did Lan carry out the project?","passage":"Changing City Transport\nLan is a Grade 9 student who recently completed a project about new public transport routes in Da Nang. At first, Lan thought the project might be difficult because there was so much information to collect. However, things became easier after the student travelled by electric bus. An older community member offered useful advice and explained why the topic matters to local people. During the project, Lan received a reusable travel card as a reminder of the experience. The student described the visit as efficient and was proud of completing the work. After returning to school, Lan prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"London","B":"Sydney","C":"Da Nang","D":"New York"},"answer":"C","explanation":"Địa điểm “Da Nang” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “efficient” in the passage is CLOSEST in meaning to ______.","passage":"Changing City Transport\nLan is a Grade 9 student who recently completed a project about new public transport routes in Da Nang. At first, Lan thought the project might be difficult because there was so much information to collect. However, things became easier after the student travelled by electric bus. An older community member offered useful advice and explained why the topic matters to local people. During the project, Lan received a reusable travel card as a reminder of the experience. The student described the visit as efficient and was proud of completing the work. After returning to school, Lan prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"boring","B":"ordinary","C":"effective","D":"unpleasant"},"answer":"C","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “effective”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"Changing City Transport\nLan is a Grade 9 student who recently completed a project about new public transport routes in Da Nang. At first, Lan thought the project might be difficult because there was so much information to collect. However, things became easier after the student travelled by electric bus. An older community member offered useful advice and explained why the topic matters to local people. During the project, Lan received a reusable travel card as a reminder of the experience. The student described the visit as efficient and was proud of completing the work. After returning to school, Lan prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"the community member","B":"a classmate","C":"the teacher","D":"Lan"},"answer":"D","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Lan” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"Changing City Transport\nLan is a Grade 9 student who recently completed a project about new public transport routes in Da Nang. At first, Lan thought the project might be difficult because there was so much information to collect. However, things became easier after the student travelled by electric bus. An older community member offered useful advice and explained why the topic matters to local people. During the project, Lan received a reusable travel card as a reminder of the experience. The student described the visit as efficient and was proud of completing the work. After returning to school, Lan prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Lan gave a presentation at school.","B":"Lan received a reusable travel card during the project.","C":"Lan kept the results secret and never presented them.","D":"Several classmates wanted to try a similar project."},"answer":"C","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"The museum provides useful ______ about local history. (INFORM)","answer":"information","explanation":"Từ gốc trong ngoặc phải biến đổi thành “information” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"He gave a very ______ explanation of the route. (HELP)","answer":"helpful","explanation":"Từ gốc trong ngoặc phải biến đổi thành “helpful” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"We admired the ______ of traditional wooden houses. (BEAUTIFUL)","answer":"beauty","explanation":"Từ gốc trong ngoặc phải biến đổi thành “beauty” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"City traffic can be very ______ during rush hour. (NOISE)","answer":"noisy","explanation":"Từ gốc trong ngoặc phải biến đổi thành “noisy” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"We were surprised by the ______ of the local people. (FRIEND)","answer":"friendliness","explanation":"Từ gốc trong ngoặc phải biến đổi thành “friendliness” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"They started living in this city three years ago. (FOR)","answer":"They have lived in this city for three years.","explanation":"Đáp án mẫu: “They have lived in this city for three years.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"You will understand the lesson better if you revise more. (THE)","answer":"The more you revise, the better you will understand the lesson.","explanation":"Đáp án mẫu: “The more you revise, the better you will understand the lesson.” So sánh kép: The + comparative..., the + comparative..."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"She does not like wasting food. (AVOIDS)","answer":"She avoids wasting food.","explanation":"Đáp án mẫu: “She avoids wasting food.” Giữ nguyên nghĩa câu gốc đồng thời đổi cấu trúc phù hợp từ gợi ý."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"She started collecting postcards in 2020. (SINCE)","answer":"She has collected postcards since 2020.","explanation":"Đáp án mẫu: “She has collected postcards since 2020.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"I / not know / where / buy / a handmade souvenir.","answer":"I do not know where to buy a handmade souvenir.","explanation":"Câu hoàn chỉnh: “I do not know where to buy a handmade souvenir.” Cấu trúc wh-word + to V diễn đạt cách/nơi/thời điểm thực hiện."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"The volunteers / enjoy / help / elderly people / at weekends.","answer":"The volunteers enjoy helping elderly people at weekends.","explanation":"Câu hoàn chỉnh: “The volunteers enjoy helping elderly people at weekends.” So sánh kép dùng The + so sánh hơn ở cả hai vế."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"He / not know / how / get / the town museum.","answer":"He does not know how to get to the town museum.","explanation":"Câu hoàn chỉnh: “He does not know how to get to the town museum.” Cấu trúc wh-word + to V diễn đạt cách/nơi/thời điểm thực hiện."}]},{"test":3,"title":"TEST 03 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"stopped","B":"wanted","C":"watched","D":"looked"},"optionMarks":[{"word":"stopped","marked":"ed"},{"word":"wanted","marked":"ed"},{"word":"watched","marked":"ed"},{"word":"looked","marked":"ed"}],"answer":"B","explanation":"Phần gạch chân trong “wanted” đọc /ɪd/; trong ba từ stopped, watched, looked đều đọc /t/. Vì vậy “wanted” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"market","B":"car","C":"many","D":"park"},"optionMarks":[{"word":"market","marked":"ar"},{"word":"car","marked":"ar"},{"word":"many","marked":"a"},{"word":"park","marked":"ar"}],"answer":"C","explanation":"Phần gạch chân trong “many” đọc /e/; trong ba từ market, car, park đều đọc /ɑː/. Vì vậy “many” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"map","B":"hat","C":"cat","D":"father"},"optionMarks":[{"word":"map","marked":"a"},{"word":"hat","marked":"a"},{"word":"cat","marked":"a"},{"word":"father","marked":"a"}],"answer":"D","explanation":"Phần gạch chân trong “father” đọc /ɑː/; trong ba từ map, hat, cat đều đọc /æ/. Vì vậy “father” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"foot","B":"food","C":"good","D":"book"},"optionMarks":[{"word":"foot","marked":"oo"},{"word":"food","marked":"oo"},{"word":"good","marked":"oo"},{"word":"book","marked":"oo"}],"answer":"B","explanation":"Phần gạch chân trong “food” đọc /uː/; trong ba từ foot, good, book đều đọc /ʊ/. Vì vậy “food” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"protect","B":"mountain","C":"advice","D":"support"},"answer":"B","explanation":"“mountain” nhấn âm tiết thứ 1; protect, advice, support đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"wonderful","B":"festival","C":"experience","D":"fortunate"},"answer":"C","explanation":"“experience” nhấn âm tiết thứ 2; wonderful, festival, fortunate đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"remember","B":"famous","C":"colourful","D":"peaceful"},"answer":"A","explanation":"“remember” nhấn âm tiết thứ 2; famous, colourful, peaceful đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"important","B":"historical","C":"garden","D":"traditional"},"answer":"C","explanation":"“garden” nhấn âm tiết thứ 1; important, historical, traditional đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"The family kept its valuable photographs.","options":{"A":"important","B":"precious","C":"meaningful","D":"worthless"},"answer":"D","keyword":"valuable","explanation":"“valuable” nghĩa là có giá trị. “worthless” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"The guide gave us reliable information.","options":{"A":"unreliable","B":"dependable","C":"trustworthy","D":"accurate"},"answer":"A","keyword":"reliable","explanation":"“reliable” nghĩa là đáng tin cậy. “unreliable” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"Our neighbours are very friendly to visitors.","options":{"A":"warm","B":"welcoming","C":"kind","D":"unfriendly"},"answer":"D","keyword":"friendly","explanation":"“friendly” nghĩa là thân thiện. “unfriendly” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"Their clean-up campaign was successful.","options":{"A":"productive","B":"positive","C":"effective","D":"unsuccessful"},"answer":"D","keyword":"successful","explanation":"“successful” nghĩa là thành công. “unsuccessful” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"The tour was a memorable experience.","options":{"A":"dull","B":"unforgettable","C":"ordinary","D":"common"},"answer":"B","keyword":"memorable","explanation":"“memorable” nghĩa là đáng nhớ. “unforgettable” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"The night market is very lively.","options":{"A":"dull","B":"energetic","C":"quiet","D":"silent"},"answer":"B","keyword":"lively","explanation":"“lively” nghĩa là sôi động. “energetic” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"You can improve your health by exercising.","options":{"A":"ignore","B":"damage","C":"reduce","D":"make better"},"answer":"D","keyword":"improve","explanation":"“improve” nghĩa là cải thiện. “make better” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"The school wants to protect the environment.","options":{"A":"deadline","B":"schedule","C":"surroundings","D":"result"},"answer":"C","keyword":"protect","explanation":"“protect” nghĩa là bảo vệ. “surroundings” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Mai does not know ______ to find the health clinic.","options":{"A":"how","B":"what","C":"which","D":"who"},"answer":"A","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to the school wellness campaign.","options":{"A":"where","B":"why","C":"when","D":"who"},"answer":"D","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"looked up","B":"turned down","C":"cut down","D":"passed down"},"answer":"D","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Mai had to ______ an invitation to the club because of an exam.","options":{"A":"pass down","B":"find out","C":"get over","D":"turn down"},"answer":"D","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"more confident","B":"the most confident","C":"the confidence","D":"the more confident"},"answer":"D","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"the longer","B":"longer","C":"the longest","D":"long"},"answer":"A","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Mai feels anxious before the test, Mai ______ ask a teacher for advice.","options":{"A":"would","B":"should","C":"was","D":"did"},"answer":"B","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"mustn't","B":"might","C":"should","D":"could"},"answer":"A","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Mai ______ photos of the old town.","options":{"A":"takes","B":"has taken","C":"is taking","D":"was taking"},"answer":"D","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Hue, it began to rain.","options":{"A":"are walking","B":"were walking","C":"walk","D":"have walked"},"answer":"B","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the youth club.","options":{"A":"will live","B":"live","C":"have lived","D":"lived"},"answer":"D","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Mai ______ a traditional pottery workshop.","options":{"A":"visits","B":"was visiting","C":"has visited","D":"visited"},"answer":"C","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Hue since 2019.","options":{"A":"have lived","B":"were living","C":"lived","D":"live"},"answer":"A","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"learn","B":"learned","C":"to learn","D":"learning"},"answer":"D","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ the school wellness campaign next month.","options":{"A":"to organise","B":"organise","C":"organised","D":"organising"},"answer":"A","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"Mai: \"Thank you for showing us around the old town.\"  A guide: \"______\"","options":{"A":"How exciting!","B":"You are welcome.","C":"Yes, please.","D":"That is a pity."},"answer":"B","explanation":"Đây là lời cảm ơn. Câu đáp “You are welcome.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"A student: \"I am sorry I was late for the heritage tour.\"  Teacher: \"______\"","options":{"A":"Please try to be on time next time.","B":"You must buy it.","C":"Congratulations!","D":"Nice to meet you."},"answer":"A","explanation":"Đây là lời xin lỗi. Câu đáp “Please try to be on time next time.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"Mai: \"Would you like to join us for a summer volunteer trip?\"  A friend: \"______\"","options":{"A":"That is my bicycle.","B":"No, I am not a place.","C":"Yes, I would love to.","D":"Yes, I am like it."},"answer":"C","explanation":"Đây là lời mời. Câu đáp “Yes, I would love to.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"Mai: \"I think preserving traditional customs is important.\"  A friend: \"______\"","options":{"A":"It was at 6 p.m.","B":"I am sorry you lost it.","C":"Never travel by bus.","D":"I completely agree with you."},"answer":"D","explanation":"Đây là tình huống giao tiếp trong đoạn hội thoại. Câu đáp “I completely agree with you.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{
