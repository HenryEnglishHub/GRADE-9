d","B":"washed","C":"walked","D":"helped"},"optionMarks":[{"word":"played","marked":"ed"},{"word":"washed","marked":"ed"},{"word":"walked","marked":"ed"},{"word":"helped","marked":"ed"}],"answer":"A","explanation":"Phần gạch chân trong “played” đọc /d/; trong ba từ washed, walked, helped đều đọc /t/. Vì vậy “played” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"visited","B":"worked","C":"needed","D":"wanted"},"optionMarks":[{"word":"visited","marked":"ed"},{"word":"worked","marked":"ed"},{"word":"needed","marked":"ed"},{"word":"wanted","marked":"ed"}],"answer":"B","explanation":"Phần gạch chân trong “worked” đọc /t/; trong ba từ visited, needed, wanted đều đọc /ɪd/. Vì vậy “worked” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"pear","B":"wear","C":"hear","D":"bear"},"optionMarks":[{"word":"pear","marked":"ear"},{"word":"wear","marked":"ear"},{"word":"hear","marked":"ear"},{"word":"bear","marked":"ear"}],"answer":"C","explanation":"Phần gạch chân trong “hear” đọc /ɪə/; trong ba từ pear, wear, bear đều đọc /eə/. Vì vậy “hear” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"support","B":"advice","C":"protect","D":"mountain"},"answer":"D","explanation":"“mountain” nhấn âm tiết thứ 1; support, advice, protect đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"fortunate","B":"experience","C":"wonderful","D":"festival"},"answer":"B","explanation":"“experience” nhấn âm tiết thứ 2; fortunate, wonderful, festival đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"colourful","B":"famous","C":"peaceful","D":"remember"},"answer":"D","explanation":"“remember” nhấn âm tiết thứ 2; colourful, famous, peaceful đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"important","B":"traditional","C":"historical","D":"garden"},"answer":"D","explanation":"“garden” nhấn âm tiết thứ 1; important, traditional, historical đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"Lan felt confident before the speaking competition.","options":{"A":"relaxed","B":"insecure","C":"sure","D":"brave"},"answer":"B","keyword":"confident","explanation":"“confident” nghĩa là tự tin. “insecure” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"There are frequent buses between the two towns.","options":{"A":"regular","B":"rare","C":"common","D":"repeated"},"answer":"B","keyword":"frequent","explanation":"“frequent” nghĩa là thường xuyên. “rare” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"They found a temporary solution to the problem.","options":{"A":"short-term","B":"permanent","C":"limited","D":"brief"},"answer":"B","keyword":"temporary","explanation":"“temporary” nghĩa là tạm thời. “permanent” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"The teenagers are becoming more independent.","options":{"A":"dependent","B":"capable","C":"confident","D":"self-reliant"},"answer":"A","keyword":"independent","explanation":"“independent” nghĩa là độc lập. “dependent” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"The new bus route is convenient for commuters.","options":{"A":"practical","B":"difficult","C":"confusing","D":"expensive"},"answer":"A","keyword":"convenient","explanation":"“convenient” nghĩa là tiện lợi. “practical” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"After yoga, Hoa felt relaxed.","options":{"A":"nervous","B":"calm","C":"angry","D":"frightened"},"answer":"B","keyword":"relaxed","explanation":"“relaxed” nghĩa là thư giãn. “calm” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"Families prepared traditional dishes for Tet.","options":{"A":"imported","B":"modern","C":"customary","D":"unusual"},"answer":"C","keyword":"traditional","explanation":"“traditional” nghĩa là truyền thống. “customary” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"We need reliable information about the city.","options":{"A":"risky","B":"trustworthy","C":"false","D":"unclear"},"answer":"B","keyword":"reliable","explanation":"“reliable” nghĩa là đáng tin cậy. “trustworthy” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Trang does not know ______ to find the city park.","options":{"A":"which","B":"how","C":"who","D":"what"},"answer":"B","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to an old photograph exhibition.","options":{"A":"where","B":"when","C":"who","D":"why"},"answer":"C","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"looked up","B":"cut down","C":"turned down","D":"passed down"},"answer":"D","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Trang had to ______ an invitation to the club because of an exam.","options":{"A":"turn down","B":"pass down","C":"find out","D":"get over"},"answer":"A","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"more confident","B":"the confidence","C":"the most confident","D":"the more confident"},"answer":"D","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"longer","B":"the longest","C":"the longer","D":"long"},"answer":"C","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Trang feels anxious before the test, Trang ______ ask a teacher for advice.","options":{"A":"was","B":"did","C":"should","D":"would"},"answer":"C","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"might","B":"mustn't","C":"should","D":"could"},"answer":"B","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Trang ______ photos of the old town.","options":{"A":"has taken","B":"is taking","C":"takes","D":"was taking"},"answer":"D","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Hoi An, it began to rain.","options":{"A":"have walked","B":"were walking","C":"walk","D":"are walking"},"answer":"B","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the craft workshop.","options":{"A":"live","B":"lived","C":"have lived","D":"will live"},"answer":"B","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Trang ______ a traditional pottery workshop.","options":{"A":"was visiting","B":"visits","C":"has visited","D":"visited"},"answer":"C","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Hoi An since 2019.","options":{"A":"were living","B":"lived","C":"have lived","D":"live"},"answer":"C","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"learn","B":"learned","C":"learning","D":"to learn"},"answer":"C","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ an old photograph exhibition next month.","options":{"A":"to organise","B":"organised","C":"organising","D":"organise"},"answer":"A","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"A visitor: \"Could you tell me how to get to the city park?\"  A resident: \"______\"","options":{"A":"Yes, I have.","B":"Go straight ahead, then turn left.","C":"I bought it yesterday.","D":"That is my favourite subject."},"answer":"B","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “Go straight ahead, then turn left.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"Trang: \"Would you mind helping me carry these books?\"  A friend: \"______\"","options":{"A":"Thank you very much.","B":"I don't know where.","C":"Yes, I am tired.","D":"No, not at all."},"answer":"D","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “No, not at all.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"Trang: \"I have won the school speaking competition!\"  A friend: \"______\"","options":{"A":"Congratulations!","B":"I am sorry to hear that.","C":"Never mind.","D":"That is unfortunate."},"answer":"A","explanation":"Đây là thông báo tin vui. Câu đáp “Congratulations!” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"Trang: \"I feel stressed about tomorrow's exam.\"  A friend: \"______\"","options":{"A":"Please stay worried.","B":"That is not your problem.","C":"Why not take a short break and revise calmly?","D":"You should stop sleeping."},"answer":"C","explanation":"Đây là chia sẻ sự căng thẳng, cần lời khuyên. Câu đáp “Why not take a short break and revise calmly?” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) My brother decided (B) joining(C)  the volunteer club (D) last week.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) to join”. Sau decide dùng to-infinitive: decide to + V."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The guide did not explain (B) where finding(C)  the local market (D) after the tour.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) where to find”. Sau từ để hỏi dùng to + động từ nguyên mẫu, không dùng V-ing."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) They (B) have visited(C)  the museum (D) yesterday afternoon.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) visited”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The more crowded (B) the road is,(C)  the (D) long traffic takes.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) longer the journey takes.”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":40,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"JOIN TRADITIONAL FOOD FESTIVAL!\nAll Grade 9 students are invited to take part in our special event. We are looking (40) _____ volunteers who can prepare and display local dishes. Participants should remember (41) _____ an apron with them. The event will be (42) _____ by teachers and student leaders so that everyone stays safe.","options":{"A":"of","B":"to","C":"at","D":"for"},"answer":"D","explanation":"“take part in” = tham gia. Đây là cụm cố định; không nói make/get/do part in."},{"number":41,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"JOIN TRADITIONAL FOOD FESTIVAL!\nAll Grade 9 students are invited to take part in our special event. We are looking (40) _____ volunteers who can prepare and display local dishes. Participants should remember (41) _____ an apron with them. The event will be (42) _____ by teachers and student leaders so that everyone stays safe.","options":{"A":"bringing","B":"brought","C":"bring","D":"to bring"},"answer":"D","explanation":"“want + to V” là cấu trúc đúng: want to join the event."},{"number":42,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"JOIN TRADITIONAL FOOD FESTIVAL!\nAll Grade 9 students are invited to take part in our special event. We are looking (40) _____ volunteers who can prepare and display local dishes. Participants should remember (41) _____ an apron with them. The event will be (42) _____ by teachers and student leaders so that everyone stays safe.","options":{"A":"organising","B":"organise","C":"organisation","D":"organised"},"answer":"D","explanation":"“cut down on + noun” = cắt giảm điều gì. Giới từ bắt buộc là on."},{"number":43,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Traditional Festivals\nMany villagers in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. The more we listened, the (46) _____ we understood the local community. We have kept in touch with community members (47) _____ last week, and many classmates have asked to join the next project.","options":{"A":"organising","B":"organise","C":"to organise","D":"organised"},"answer":"C","explanation":"Sau how diễn đạt cách học dùng cấu trúc “how + to V”: how to learn."},{"number":44,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Traditional Festivals\nMany villagers in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. The more we listened, the (46) _____ we understood the local community. We have kept in touch with community members (47) _____ last week, and many classmates have asked to join the next project.","options":{"A":"were taking","B":"have taken","C":"will take","D":"take"},"answer":"A","explanation":"“find information” = tìm kiếm thông tin từ nguồn đáng tin cậy. Các phrasal verbs khác không hợp ngữ cảnh."},{"number":45,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Traditional Festivals\nMany villagers in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. The more we listened, the (46) _____ we understood the local community. We have kept in touch with community members (47) _____ last week, and many classmates have asked to join the next project.","options":{"A":"practised","B":"practise","C":"practises","D":"practising"},"answer":"A","explanation":"So sánh hai trạng thái mức độ hiểu biết: become + comparative adjective → more knowledgeable."},{"number":46,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Traditional Festivals\nMany villagers in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. The more we listened, the (46) _____ we understood the local community. We have kept in touch with community members (47) _____ last week, and many classmates have asked to join the next project.","options":{"A":"better","B":"best","C":"good","D":"well"},"answer":"A","explanation":"Lời khuyên trong tình huống khó khăn dùng should + V: they should ask for advice."},{"number":47,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Traditional Festivals\nMany villagers in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. The more we listened, the (46) _____ we understood the local community. We have kept in touch with community members (47) _____ last week, and many classmates have asked to join the next project.","options":{"A":"from","B":"during","C":"since","D":"for"},"answer":"C","explanation":"Trước danh từ “experience” cần tính từ bổ nghĩa: valuable experience = trải nghiệm quý giá."},{"number":48,"part":"PART 10 – READING TRUE / FALSE","stem":"The students went to Hue to learn about family recipes.   T ☐    F ☐","passage":"Traditional Food Day\nLast Thursday, a group of Grade 9 students visited Hue to learn about family recipes. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their aunt, who explained the main ideas and gave practical examples. Each student received a recipe card to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Bài đọc xác nhận ngay câu mở đầu: Last Thursday, a group of Grade 9 students visited Hue to learn about family recipes. Before the activity, their teacher asked them to prepare a few q. Vì vậy phát biểu này đúng."},{"number":49,"part":"PART 10 – READING TRUE / FALSE","stem":"The students received no preparation instructions from their teacher.   T ☐    F ☐","passage":"Traditional Food Day\nLast Thursday, a group of Grade 9 students visited Hue to learn about family recipes. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their aunt, who explained the main ideas and gave practical examples. Each student received a recipe card to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Trong đoạn, giáo viên yêu cầu học sinh chuẩn bị câu hỏi và mang sổ ghi chép; vì vậy nói “không hướng dẫn chuẩn bị” là sai."},{"number":50,"part":"PART 10 – READING TRUE / FALSE","stem":"They met their aunt during the activity.   T ☐    F ☐","passage":"Traditional Food Day\nLast Thursday, a group of Grade 9 students visited Hue to learn about family recipes. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their aunt, who explained the main ideas and gave practical examples. Each student received a recipe card to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Đoạn văn ghi rõ học sinh gặp giáo viên tại nơi diễn ra hoạt động; vì vậy phát biểu đúng."},{"number":51,"part":"PART 10 – READING TRUE / FALSE","stem":"The activity continued until after midnight.   T ☐    F ☐","passage":"Traditional Food Day\nLast Thursday, a group of Grade 9 students visited Hue to learn about family recipes. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their aunt, who explained the main ideas and gave practical examples. Each student received a recipe card to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"Traditional Food Day\nLast Thursday, a group of Grade 9 students visited Hue to learn about family recipes. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their aunt, who explained the main ideas and gave practical examples. Each student received a recipe card to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"Traditional Food Stories\nTrang is a Grade 9 student who recently completed a project about traditional recipes in Hue. At first, Trang thought the project might be difficult because there was so much information to collect. However, things became easier after the student cooked with her aunt. An older community member offered useful advice and explained why the topic matters to local people. During the project, Trang received a family recipe book as a reminder of the experience. The student described the visit as delicious and was proud of completing the work. After returning to school, Trang prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"A guide to international airports","B":"Trang's project about traditional recipes","C":"The history of modern smartphones","D":"An expensive shopping experience"},"answer":"B","explanation":"Ý chính bao quát toàn đoạn là “Trang's project about traditional recipes”, đúng với hoạt động được giới thiệu ở đầu bài và phát triển xuyên suốt đoạn. Các đáp án khác không phản ánh nội dung chính."},{"number":54,"part":"PART 11 – READING COMPREHENSION","stem":"Where did Trang carry out the project?","passage":"Traditional Food Stories\nTrang is a Grade 9 student who recently completed a project about traditional recipes in Hue. At first, Trang thought the project might be difficult because there was so much information to collect. However, things became easier after the student cooked with her aunt. An older community member offered useful advice and explained why the topic matters to local people. During the project, Trang received a family recipe book as a reminder of the experience. The student described the visit as delicious and was proud of completing the work. After returning to school, Trang prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Hue","B":"New York","C":"Sydney","D":"London"},"answer":"A","explanation":"Địa điểm “Hue” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “delicious” in the passage is CLOSEST in meaning to ______.","passage":"Traditional Food Stories\nTrang is a Grade 9 student who recently completed a project about traditional recipes in Hue. At first, Trang thought the project might be difficult because there was so much information to collect. However, things became easier after the student cooked with her aunt. An older community member offered useful advice and explained why the topic matters to local people. During the project, Trang received a family recipe book as a reminder of the experience. The student described the visit as delicious and was proud of completing the work. After returning to school, Trang prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"boring","B":"tasty","C":"ordinary","D":"unpleasant"},"answer":"B","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “tasty”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"Traditional Food Stories\nTrang is a Grade 9 student who recently completed a project about traditional recipes in Hue. At first, Trang thought the project might be difficult because there was so much information to collect. However, things became easier after the student cooked with her aunt. An older community member offered useful advice and explained why the topic matters to local people. During the project, Trang received a family recipe book as a reminder of the experience. The student described the visit as delicious and was proud of completing the work. After returning to school, Trang prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"a classmate","B":"the teacher","C":"Trang","D":"the community member"},"answer":"C","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Trang” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"Traditional Food Stories\nTrang is a Grade 9 student who recently completed a project about traditional recipes in Hue. At first, Trang thought the project might be difficult because there was so much information to collect. However, things became easier after the student cooked with her aunt. An older community member offered useful advice and explained why the topic matters to local people. During the project, Trang received a family recipe book as a reminder of the experience. The student described the visit as delicious and was proud of completing the work. After returning to school, Trang prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Several classmates wanted to try a similar project.","B":"Trang kept the results secret and never presented them.","C":"Trang gave a presentation at school.","D":"Trang received a family recipe book during the project."},"answer":"B","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"There is a wide ______ of street food in the city. (VARY)","answer":"variety","explanation":"Từ gốc trong ngoặc phải biến đổi thành “variety” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"Our teacher encouraged ______ thinking during the project. (CREATE)","answer":"creative","explanation":"Từ gốc trong ngoặc phải biến đổi thành “creative” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"The new metro makes travelling across the city more ______. (CONVENIENCE)","answer":"convenient","explanation":"Từ gốc trong ngoặc phải biến đổi thành “convenient” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"The ______ of traditional buildings is important. (PRESERVE)","answer":"preservation","explanation":"Từ gốc trong ngoặc phải biến đổi thành “preservation” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"The museum provides useful ______ about local history. (INFORM)","answer":"information","explanation":"Từ gốc trong ngoặc phải biến đổi thành “information” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"I do not know how I can reach the traditional craft village. (HOW)","answer":"I do not know how to reach the traditional craft village.","explanation":"Đáp án mẫu: “I do not know how to reach the traditional craft village.” Rút gọn mệnh đề gián tiếp: wh-word + to-infinitive."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"The phone rang during my homework. (WHILE)","answer":"The phone rang while I was doing my homework.","explanation":"Đáp án mẫu: “The phone rang while I was doing my homework.” Đặt hành động đang diễn ra ở quá khứ tiếp diễn, kết hợp when/while phù hợp."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"I cannot speak English fluently now. (WISH)","answer":"I wish I could speak English fluently now.","explanation":"Đáp án mẫu: “I wish I could speak English fluently now.” Wish ở hiện tại: S + wish(es) + S + past simple / could + V."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"They made a plan to visit the museum. (PLANNED)","answer":"They planned to visit the museum.","explanation":"Đáp án mẫu: “They planned to visit the museum.” Các động từ như plan, decide, want đi với to-infinitive."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"At 8 p.m. / last night / my grandmother / tell / stories / while / we / listen.","answer":"At 8 p.m. last night, my grandmother was telling stories while we were listening.","explanation":"Câu hoàn chỉnh: “At 8 p.m. last night, my grandmother was telling stories while we were listening.” Hai hành động đồng thời trong quá khứ dùng while + past continuous; chú ý was/were + V-ing."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"the / crowded / the city / be / the / difficult / travelling / become.","answer":"The more crowded the city is, the more difficult travelling becomes.","explanation":"Câu hoàn chỉnh: “The more crowded the city is, the more difficult travelling becomes.” So sánh kép dùng The + so sánh hơn ở cả hai vế."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"While / Minh / take / photos / Lan / interview / a craft worker.","answer":"While Minh was taking photos, Lan was interviewing a craft worker.","explanation":"Câu hoàn chỉnh: “While Minh was taking photos, Lan was interviewing a craft worker.” Hai hành động đồng thời trong quá khứ dùng while + past continuous; chú ý was/were + V-ing."}]},{"test":12,"title":"TEST 12 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"book","B":"food","C":"foot","D":"good"},"optionMarks":[{"word":"book","marked":"oo"},{"word":"food","marked":"oo"},{"word":"foot","marked":"oo"},{"word":"good","marked":"oo"}],"answer":"B","explanation":"Phần gạch chân trong “food” đọc /uː/; trong ba từ book, foot, good đều đọc /ʊ/. Vì vậy “food” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"thin","B":"thank","C":"those","D":"think"},"optionMarks":[{"word":"thin","marked":"th"},{"word":"thank","marked":"th"},{"word":"those","marked":"th"},{"word":"think","marked":"th"}],"answer":"C","explanation":"Phần gạch chân trong “those” đọc /ð/; trong ba từ thin, thank, think đều đọc /θ/. Vì vậy “those” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"night","B":"right","C":"bright","D":"eight"},"optionMarks":[{"word":"night","marked":"igh"},{"word":"right","marked":"igh"},{"word":"bright","marked":"igh"},{"word":"eight","marked":"eigh"}],"answer":"D","explanation":"Phần gạch chân trong “eight” đọc /eɪ/; trong ba từ night, right, bright đều đọc /aɪ/. Vì vậy “eight” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"fun","B":"run","C":"sun","D":"put"},"optionMarks":[{"word":"fun","marked":"u"},{"word":"run","marked":"u"},{"word":"sun","marked":"u"},{"word":"put","marked":"u"}],"answer":"D","explanation":"Phần gạch chân trong “put” đọc /ʊ/; trong ba từ fun, run, sun đều đọc /ʌ/. Vì vậy “put” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"university","B":"opportunity","C":"community","D":"electricity"},"answer":"C","explanation":"“community” nhấn âm tiết thứ 2; university, opportunity, electricity đều nhấn âm tiết thứ 3. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"family","B":"convenient","C":"important","D":"attractive"},"answer":"A","explanation":"“family” nhấn âm tiết thứ 1; convenient, important, attractive đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"convenient","B":"attractive","C":"expensive","D":"crowded"},"answer":"D","explanation":"“crowded” nhấn âm tiết thứ 1; convenient, attractive, expensive đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"countryside","B":"history","C":"district","D":"explore"},"answer":"D","explanation":"“explore” nhấn âm tiết thứ 2; countryside, history, district đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"The guide gave us reliable information.","options":{"A":"unreliable","B":"trustworthy","C":"dependable","D":"accurate"},"answer":"A","keyword":"reliable","explanation":"“reliable” nghĩa là đáng tin cậy. “unreliable” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"Our neighbours are very friendly to visitors.","options":{"A":"welcoming","B":"warm","C":"kind","D":"unfriendly"},"answer":"D","keyword":"friendly","explanation":"“friendly” nghĩa là thân thiện. “unfriendly” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"Their clean-up campaign was successful.","options":{"A":"positive","B":"effective","C":"productive","D":"unsuccessful"},"answer":"D","keyword":"successful","explanation":"“successful” nghĩa là thành công. “unsuccessful” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"We should reduce the amount of plastic we use.","options":{"A":"decrease","B":"lower","C":"cut","D":"increase"},"answer":"D","keyword":"reduce","explanation":"“reduce” nghĩa là giảm bớt. “increase” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"The night market is very lively.","options":{"A":"quiet","B":"silent","C":"energetic","D":"dull"},"answer":"C","keyword":"lively","explanation":"“lively” nghĩa là sôi động. “energetic” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"You can improve your health by exercising.","options":{"A":"damage","B":"reduce","C":"make better","D":"ignore"},"answer":"C","keyword":"improve","explanation":"“improve” nghĩa là cải thiện. “make better” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"The school wants to protect the environment.","options":{"A":"result","B":"schedule","C":"deadline","D":"surroundings"},"answer":"D","keyword":"protect","explanation":"“protect” nghĩa là bảo vệ. “surroundings” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"A local craft shop sells handmade souvenirs.","options":{"A":"distant","B":"foreign","C":"nearby","D":"overseas"},"answer":"C","keyword":"handmade","explanation":"“handmade” nghĩa là làm thủ công. “nearby” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Bao does not know ______ to find the local market.","options":{"A":"who","B":"which","C":"how","D":"what"},"answer":"C","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to a pottery experience.","options":{"A":"when","B":"why","C":"where","D":"who"},"answer":"D","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"turned down","B":"cut down","C":"passed down","D":"looked up"},"answer":"C","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Bao had to ______ an invitation to the club because of an exam.","options":{"A":"get over","B":"pass down","C":"turn down","D":"find out"},"answer":"C","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"more confident","B":"the more confident","C":"the confidence","D":"the most confident"},"answer":"B","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"long","B":"longer","C":"the longer","D":"the longest"},"answer":"C","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Bao feels anxious before the test, Bao ______ ask a teacher for advice.","options":{"A":"did","B":"was","C":"would","D":"should"},"answer":"D","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"mustn't","B":"should","C":"might","D":"could"},"answer":"A","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Bao ______ photos of the old town.","options":{"A":"was taking","B":"takes","C":"is taking","D":"has taken"},"answer":"A","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Da Lat, it began to rain.","options":{"A":"are walking","B":"have walked","C":"walk","D":"were walking"},"answer":"D","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the community centre.","options":{"A":"lived","B":"have lived","C":"will live","D":"live"},"answer":"A","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Bao ______ a traditional pottery workshop.","options":{"A":"has visited","B":"visited","C":"was visiting","D":"visits"},"answer":"A","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Da Lat since 2019.","options":{"A":"live","B":"lived","C":"were living","D":"have lived"},"answer":"D","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"learning","B":"learned","C":"to learn","D":"learn"},"answer":"A","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ a pottery experience next month.","options":{"A":"to organise","B":"organised","C":"organising","D":"organise"},"answer":"A","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"Bao: \"I have won the school speaking competition!\"  A friend: \"______\"","options":{"A":"Never mind.","B":"That is unfortunate.","C":"Congratulations!","D":"I am sorry to hear that."},"answer":"C","explanation":"Đây là thông báo tin vui. Câu đáp “Congratulations!” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"Bao: \"I feel stressed about tomorrow's exam.\"  A friend: \"______\"","options":{"A":"That is not your problem.","B":"Please stay worried.","C":"You should stop sleeping.","D":"Why not take a short break and revise calmly?"},"answer":"D","explanation":"Đây là chia sẻ sự căng thẳng, cần lời khuyên. Câu đáp “Why not take a short break and revise calmly?” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"Bao: \"Thank you for showing us around the old town.\"  A guide: \"______\"","options":{"A":"You are welcome.","B":"That is a pity.","C":"How exciting!","D":"Yes, please."},"answer":"A","explanation":"Đây là lời cảm ơn. Câu đáp “You are welcome.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"A student: \"I am sorry I was late for the heritage tour.\"  Teacher: \"______\"","options":{"A":"Nice to meet you.","B":"You must buy it.","C":"Please try to be on time next time.","D":"Congratulations!"},"answer":"C","explanation":"Đây là lời xin lỗi. Câu đáp “Please try to be on time next time.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The more crowded (B) the road is,(C)  the (D) long traffic takes.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) longer the journey takes.”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) I wish (B) I have(C)  more free time (D) this weekend.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) I had”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) If you (B) will feel(C)  stressed, you should (D) talk to a teacher.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) feel”. Xét cấu trúc câu, dạng động từ và dấu hiệu thời gian để sửa lỗi."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) She did not know (B) how to finding(C)  the way (D) to the craft village.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) how to find”. Sau từ để hỏi dùng to + động từ nguyên mẫu, không dùng V-ing."},{"number":40,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"NOTICE – VILLAGE HISTORY TOUR\nOur youth club has planned an activity this weekend. It aims (40) _____ students understand local life through practical tasks. Everyone interested (41) _____ the event should contact the club office. You can bring a notebook. Please arrive (42) _____ so the group can start on time.","options":{"A":"helping","B":"to help","C":"help","D":"helped"},"answer":"B","explanation":"“take part in” = tham gia. Đây là cụm cố định; không nói make/get/do part in."},{"number":41,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"NOTICE – VILLAGE HISTORY TOUR\nOur youth club has planned an activity this weekend. It aims (40) _____ students understand local life through practical tasks. Everyone interested (41) _____ the event should contact the club office. You can bring a notebook. Please arrive (42) _____ so the group can start on time.","options":{"A":"at","B":"for","C":"in","D":"on"},"answer":"C","explanation":"“want + to V” là cấu trúc đúng: want to join the event."},{"number":42,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"NOTICE – VILLAGE HISTORY TOUR\nOur youth club has planned an activity this weekend. It aims (40) _____ students understand local life through practical tasks. Everyone interested (41) _____ the event should contact the club office. You can bring a notebook. Please arrive (42) _____ so the group can start on time.","options":{"A":"earlier","B":"early","C":"earliest","D":"earliness"},"answer":"B","explanation":"“cut down on + noun” = cắt giảm điều gì. Giới từ bắt buộc là on."},{"number":43,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Museum Learning Day\nMany students in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"protect","B":"forget","C":"remember","D":"learn"},"answer":"B","explanation":"Sau how diễn đạt cách học dùng cấu trúc “how + to V”: how to learn."},{"number":44,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Museum Learning Day\nMany students in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"sharing","B":"share","C":"shared","D":"shares"},"answer":"B","explanation":"“find information” = tìm kiếm thông tin từ nguồn đáng tin cậy. Các phrasal verbs khác không hợp ngữ cảnh."},{"number":45,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Museum Learning Day\nMany students in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"learned","B":"learning","C":"to learn","D":"learn"},"answer":"B","explanation":"So sánh hai trạng thái mức độ hiểu biết: become + comparative adjective → more knowledgeable."},{"number":46,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Museum Learning Day\nMany students in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"would","B":"should","C":"did","D":"are"},"answer":"B","explanation":"Lời khuyên trong tình huống khó khăn dùng should + V: they should ask for advice."},{"number":47,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Museum Learning Day\nMany students in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"passed down","B":"turned down","C":"looked up","D":"cut down"},"answer":"A","explanation":"Trước danh từ “experience” cần tính từ bổ nghĩa: valuable experience = trải nghiệm quý giá."},{"number":48,"part":"PART 10 – READING TRUE / FALSE","stem":"The students went to Ha Noi to learn about life in the past.   T ☐    F ☐","passage":"History Museum Visit\nLast Monday, a group of Grade 9 students visited Ha Noi to learn about life in the past. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a museum guide, who explained the main ideas and gave practical examples. Each student received a museum leaflet to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Bài đọc xác nhận ngay câu mở đầu: Last Monday, a group of Grade 9 students visited Ha Noi to learn about life in the past. Before the activity, their teacher asked them to prepare a fe. Vì vậy phát biểu này đúng."},{"number":49,"part":"PART 10 – READING TRUE / FALSE","stem":"The students received no preparation instructions from their teacher.   T ☐    F ☐","passage":"History Museum Visit\nLast Monday, a group of Grade 9 students visited Ha Noi to learn about life in the past. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a museum guide, who explained the main ideas and gave practical examples. Each student received a museum leaflet to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Trong đoạn, giáo viên yêu cầu học sinh chuẩn bị câu hỏi và mang sổ ghi chép; vì vậy nói “không hướng dẫn chuẩn bị” là sai."},{"number":50,"part":"PART 10 – READING TRUE / FALSE","stem":"They met a museum guide during the activity.   T ☐    F ☐","passage":"History Museum Visit\nLast Monday, a group of Grade 9 students visited Ha Noi to learn about life in the past. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a museum guide, who explained the main ideas and gave practical examples. Each student received a museum leaflet to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Đoạn văn ghi rõ học sinh gặp giáo viên tại nơi diễn ra hoạt động; vì vậy phát biểu đúng."},{"number":51,"part":"PART 10 – READING TRUE / FALSE","stem":"The activity continued until after midnight.   T ☐    F ☐","passage":"History Museum Visit\nLast Monday, a group of Grade 9 students visited Ha Noi to learn about life in the past. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a museum guide, who explained the main ideas and gave practical examples. Each student received a museum leaflet to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"History Museum Visit\nLast Monday, a group of Grade 9 students visited Ha Noi to learn about life in the past. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a museum guide, who explained the main ideas and gave practical examples. Each student received a museum leaflet to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"The Local History Museum\nBao is a Grade 9 student who recently completed a project about traditional school life in Ha Noi. At first, Bao thought the project might be difficult because there was so much information to collect. However, things became easier after the student watched a heritage presentation. An older community member offered useful advice and explained why the topic matters to local people. During the project, Bao received a museum brochure as a reminder of the experience. The student described the visit as informative and was proud of completing the work. After returning to school, Bao prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"A guide to international airports","B":"Bao's project about traditional school life","C":"The history of modern smartphones","D":"An expensive shopping experience"},"answer":"B","explanation":"Ý chính bao quát toàn đoạn là “Bao's project about traditional school life”, đúng với hoạt động được giới thiệu ở đầu bài và phát triển xuyên suốt đoạn. Các đáp án khác không phản ánh nội dung chính."},{"number":54,"part":"PART 11 – READING COMPREHENSION","stem":"Where did Bao carry out the project?","passage":"The Local History Museum\nBao is a Grade 9 student who recently completed a project about traditional school life in Ha Noi. At first, Bao thought the project might be difficult because there was so much information to collect. However, things became easier after the student watched a heritage presentation. An older community member offered useful advice and explained why the topic matters to local people. During the project, Bao received a museum brochure as a reminder of the experience. The student described the visit as informative and was proud of completing the work. After returning to school, Bao prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Sydney","B":"New York","C":"Ha Noi","D":"London"},"answer":"C","explanation":"Địa điểm “Ha Noi” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “informative” in the passage is CLOSEST in meaning to ______.","passage":"The Local History Museum\nBao is a Grade 9 student who recently completed a project about traditional school life in Ha Noi. At first, Bao thought the project might be difficult because there was so much information to collect. However, things became easier after the student watched a heritage presentation. An older community member offered useful advice and explained why the topic matters to local people. During the project, Bao received a museum brochure as a reminder of the experience. The student described the visit as informative and was proud of completing the work. After returning to school, Bao prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"boring","B":"educational","C":"ordinary","D":"unpleasant"},"answer":"B","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “educational”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"The Local History Museum\nBao is a Grade 9 student who recently completed a project about traditional school life in Ha Noi. At first, Bao thought the project might be difficult because there was so much information to collect. However, things became easier after the student watched a heritage presentation. An older community member offered useful advice and explained why the topic matters to local people. During the project, Bao received a museum brochure as a reminder of the experience. The student described the visit as informative and was proud of completing the work. After returning to school, Bao prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"the teacher","B":"a classmate","C":"the community member","D":"Bao"},"answer":"D","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Bao” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"The Local History Museum\nBao is a Grade 9 student who recently completed a project about traditional school life in Ha Noi. At first, Bao thought the project might be difficult because there was so much information to collect. However, things became easier after the student watched a heritage presentation. An older community member offered useful advice and explained why the topic matters to local people. During the project, Bao received a museum brochure as a reminder of the experience. The student described the visit as informative and was proud of completing the work. After returning to school, Bao prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Bao kept the results secret and never presented them.","B":"Bao gave a presentation at school.","C":"Bao received a museum brochure during the project.","D":"Several classmates wanted to try a similar project."},"answer":"A","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"Talking to a counsellor may help reduce your ______. (ANXIOUS)","answer":"anxiety","explanation":"Từ gốc trong ngoặc phải biến đổi thành “anxiety” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"The festival includes many ______ activities. (CULTURE)","answer":"cultural","explanation":"Từ gốc trong ngoặc phải biến đổi thành “cultural” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"The holiday was a wonderful and ______ experience. (MEMORY)","answer":"memorable","explanation":"Từ gốc trong ngoặc phải biến đổi thành “memorable” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"The children listened ______ to their grandmother. (CARE)","answer":"carefully","explanation":"Từ gốc trong ngoặc phải biến đổi thành “carefully” (trạng từ bổ nghĩa cho động từ). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"The new community park is a welcome ______. (DEVELOP)","answer":"development","explanation":"Từ gốc trong ngoặc phải biến đổi thành “development” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"They started living in this city three years ago. (FOR)","answer":"They have lived in this city for three years.","explanation":"Đáp án mẫu: “They have lived in this city for three years.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"You will understand the lesson better if you revise more. (THE)","answer":"The more you revise, the better you will understand the lesson.","explanation":"Đáp án mẫu: “The more you revise, the better you will understand the lesson.” So sánh kép: The + comparative..., the + comparative..."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"She does not like wasting food. (AVOIDS)","answer":"She avoids wasting food.","explanation":"Đáp án mẫu: “She avoids wasting food.” Giữ nguyên nghĩa câu gốc đồng thời đổi cấu trúc phù hợp từ gợi ý."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"She started collecting postcards in 2020. (SINCE)","answer":"She has collected postcards since 2020.","explanation":"Đáp án mẫu: “She has collected postcards since 2020.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"I / not know / where / buy / a handmade souvenir.","answer":"I do not know where to buy a handmade souvenir.","explanation":"Câu hoàn chỉnh: “I do not know where to buy a handmade souvenir.” Cấu trúc wh-word + to V diễn đạt cách/nơi/thời điểm thực hiện."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"The volunteers / enjoy / help / elderly people / at weekends.","answer":"The volunteers enjoy helping elderly people at weekends.","explanation":"Câu hoàn chỉnh: “The volunteers enjoy helping elderly people at weekends.” So sánh kép dùng The + so sánh hơn ở cả hai vế."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"He / not know / how / get / the town museum.","answer":"He does not know how to get to the town museum.","explanation":"Câu hoàn chỉnh: “He does not know how to get to the town museum.” Cấu trúc wh-word + to V diễn đạt cách/nơi/thời điểm thực hiện."}]},{"test":13,"title":"TEST 13 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"break","B":"heat","C":"meat","D":"seat"},"optionMarks":[{"word":"break","marked":"ea"},{"word":"heat","marked":"ea"},{"word":"meat","marked":"ea"},{"word":"seat","marked":"ea"}],"answer":"A","explanation":"Phần gạch chân trong “break” đọc /eɪ/; trong ba từ heat, meat, seat đều đọc /iː/. Vì vậy “break” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"brown","B":"town","C":"down","D":"shown"},"optionMarks":[{"word":"brown","marked":"ow"},{"word":"town","marked":"ow"},{"word":"down","marked":"ow"},{"word":"shown","marked":"ow"}],"answer":"D","explanation":"Phần gạch chân trong “shown” đọc /əʊ/; trong ba từ brown, town, down đều đọc /aʊ/. Vì vậy “shown” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"shops","B":"watches","C":"buses","D":"classes"},"optionMarks":[{"word":"shops","marked":"s"},{"word":"watches","marked":"es"},{"word":"buses","marked":"es"},{"word":"classes","marked":"es"}],"answer":"A","explanation":"Phần gạch chân trong “shops” đọc /s/; trong ba từ watches, buses, classes đều đọc /ɪz/. Vì vậy “shops” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"helped","B":"washed","C":"played","D":"walked"},"optionMarks":[{"word":"helped","marked":"ed"},{"word":"washed","marked":"ed"},{"word":"played","marked":"ed"},{"word":"walked","marked":"ed"}],"answer":"C","explanation":"Phần gạch chân trong “played” đọc /d/; trong ba từ helped, washed, walked đều đọc /t/. Vì vậy “played” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"culture","B":"preserve","C":"village","D":"local"},"answer":"B","explanation":"“preserve” nhấn âm tiết thứ 2; culture, village, local đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"ancient","B":"become","C":"enjoy","D":"relax"},"answer":"A","explanation":"“ancient” nhấn âm tiết thứ 1; become, enjoy, relax đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"pottery","B":"improve","C":"discover","D":"remember"},"answer":"A","explanation":"“pottery” nhấn âm tiết thứ 1; improve, discover, remember đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"collect","B":"custom","C":"return","D":"event"},"answer":"B","explanation":"“custom” nhấn âm tiết thứ 1; collect, return, event đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"The local fair has become popular with teenagers.","options":{"A":"famous","B":"favoured","C":"well-liked","D":"unpopular"},"answer":"D","keyword":"popular","explanation":"“popular” nghĩa là được ưa chuộng. “unpopular” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"I will always remember our family trip.","options":{"A":"forget","B":"keep in mind","C":"recall","D":"recollect"},"answer":"A","keyword":"remember","explanation":"“remember” nghĩa là ghi nhớ. “forget” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"The streets were crowded after the festival.","options":{"A":"lively","B":"busy","C":"empty","D":"noisy"},"answer":"C","keyword":"crowded","explanation":"“crowded” nghĩa là đông đúc. “empty” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"The new bus service is affordable for students.","options":{"A":"expensive","B":"reasonable","C":"inexpensive","D":"cheap"},"answer":"A","keyword":"affordable","explanation":"“affordable” nghĩa là giá phải chăng. “expensive” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"We should respect older generations.","options":{"A":"blame","B":"insult","C":"ignore","D":"admire"},"answer":"D","keyword":"respect","explanation":"“respect” nghĩa là tôn trọng. “admire” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"Her progress has been remarkable.","options":{"A":"tiny","B":"weak","C":"impressive","D":"ordinary"},"answer":"C","keyword":"remarkable","explanation":"“remarkable” nghĩa là đáng chú ý. “impressive” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"The bustling streets were full of people.","options":{"A":"empty","B":"busy","C":"peaceful","D":"silent"},"answer":"B","keyword":"bustling","explanation":"“bustling” nghĩa là nhộn nhịp. “busy” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"The local restaurant serves affordable meals.","options":{"A":"luxurious","B":"pricey","C":"inexpensive","D":"costly"},"answer":"C","keyword":"affordable","explanation":"“affordable” nghĩa là giá phải chăng. “inexpensive” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Thao does not know ______ to find the art gallery.","options":{"A":"which","B":"who","C":"what","D":"how"},"answer":"D","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to a bicycle safety campaign.","options":{"A":"who","B":"when","C":"why","D":"where"},"answer":"A","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"looked up","B":"passed down","C":"turned down","D":"cut down"},"answer":"B","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Thao had to ______ an invitation to the club because of an exam.","options":{"A":"pass down","B":"turn down","C":"find out","D":"get over"},"answer":"B","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"the confidence","B":"more confident","C":"the more confident","D":"the most confident"},"answer":"C","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"the longer","B":"the longest","C":"long","D":"longer"},"answer":"A","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Thao feels anxious before the test, Thao ______ ask a teacher for advice.","options":{"A":"did","B":"was","C":"should","D":"would"},"answer":"C","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"should","B":"might","C":"mustn't","D":"could"},"answer":"C","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Thao ______ photos of the old town.","options":{"A":"takes","B":"is taking","C":"was taking","D":"has taken"},"answer":"C","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Vung Tau, it began to rain.","options":{"A":"were walking","B":"walk","C":"are walking","D":"have walked"},"answer":"A","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the health clinic.","options":{"A":"live","B":"have lived","C":"will live","D":"lived"}
