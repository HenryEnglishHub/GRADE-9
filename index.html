eficial and was proud of completing the work. After returning to school, Mai prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Ha Noi","B":"New York","C":"Sydney","D":"London"},"answer":"A","explanation":"Địa điểm “Ha Noi” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “beneficial” in the passage is CLOSEST in meaning to ______.","passage":"Life Without Exam Stress\nMai is a Grade 9 student who recently completed a project about healthy study habits in Ha Noi. At first, Mai thought the project might be difficult because there was so much information to collect. However, things became easier after the student joined a school wellbeing club. An older community member offered useful advice and explained why the topic matters to local people. During the project, Mai received a weekly study plan as a reminder of the experience. The student described the visit as beneficial and was proud of completing the work. After returning to school, Mai prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"boring","B":"unpleasant","C":"helpful","D":"ordinary"},"answer":"C","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “helpful”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"Life Without Exam Stress\nMai is a Grade 9 student who recently completed a project about healthy study habits in Ha Noi. At first, Mai thought the project might be difficult because there was so much information to collect. However, things became easier after the student joined a school wellbeing club. An older community member offered useful advice and explained why the topic matters to local people. During the project, Mai received a weekly study plan as a reminder of the experience. The student described the visit as beneficial and was proud of completing the work. After returning to school, Mai prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"the teacher","B":"the community member","C":"a classmate","D":"Mai"},"answer":"D","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Mai” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"Life Without Exam Stress\nMai is a Grade 9 student who recently completed a project about healthy study habits in Ha Noi. At first, Mai thought the project might be difficult because there was so much information to collect. However, things became easier after the student joined a school wellbeing club. An older community member offered useful advice and explained why the topic matters to local people. During the project, Mai received a weekly study plan as a reminder of the experience. The student described the visit as beneficial and was proud of completing the work. After returning to school, Mai prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Several classmates wanted to try a similar project.","B":"Mai kept the results secret and never presented them.","C":"Mai gave a presentation at school.","D":"Mai received a weekly study plan during the project."},"answer":"B","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"The new community park is a welcome ______. (DEVELOP)","answer":"development","explanation":"Từ gốc trong ngoặc phải biến đổi thành “development” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"The visitors found the old streets very ______. (INTEREST)","answer":"interesting","explanation":"Từ gốc trong ngoặc phải biến đổi thành “interesting” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"There is a wide ______ of street food in the city. (VARY)","answer":"variety","explanation":"Từ gốc trong ngoặc phải biến đổi thành “variety” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"Our teacher encouraged ______ thinking during the project. (CREATE)","answer":"creative","explanation":"Từ gốc trong ngoặc phải biến đổi thành “creative” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"The new metro makes travelling across the city more ______. (CONVENIENCE)","answer":"convenient","explanation":"Từ gốc trong ngoặc phải biến đổi thành “convenient” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"I do not know the time when I should leave. (WHEN)","answer":"I do not know when to leave.","explanation":"Đáp án mẫu: “I do not know when to leave.” Rút gọn mệnh đề gián tiếp: wh-word + to-infinitive."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"I was cleaning the room. Then my grandmother arrived. (WHEN)","answer":"I was cleaning the room when my grandmother arrived.","explanation":"Đáp án mẫu: “I was cleaning the room when my grandmother arrived.” So sánh kép: The + comparative..., the + comparative..."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"I have no bicycle, so I cannot join the cycling tour. (WISH)","answer":"I wish I had a bicycle so I could join the cycling tour.","explanation":"Đáp án mẫu: “I wish I had a bicycle so I could join the cycling tour.” Wish ở hiện tại: S + wish(es) + S + past simple / could + V."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"Lan started learning English in 2022. (SINCE)","answer":"Lan has learnt English since 2022.","explanation":"Đáp án mẫu: “Lan has learnt English since 2022.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"We / learn / about / local customs / since / last year.","answer":"We have learnt about local customs since last year.","explanation":"Câu hoàn chỉnh: “We have learnt about local customs since last year.” Hiện tại hoàn thành đi với since (mốc) hoặc for (khoảng thời gian)."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"My parents / decide / move / to the city / in 2020.","answer":"My parents decided to move to the city in 2020.","explanation":"Câu hoàn chỉnh: “My parents decided to move to the city in 2020.” Đúng dạng động từ sau động từ chính hoặc giới từ."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"Our class / take part in / three / community projects / so far.","answer":"Our class has taken part in three community projects so far.","explanation":"Câu hoàn chỉnh: “Our class has taken part in three community projects so far.” Sắp xếp đúng S–V–O, giới từ và thì theo mốc thời gian."}]},{"test":4,"title":"TEST 04 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"likes","B":"plays","C":"books","D":"stops"},"optionMarks":[{"word":"likes","marked":"s"},{"word":"plays","marked":"s"},{"word":"books","marked":"s"},{"word":"stops","marked":"s"}],"answer":"B","explanation":"Phần gạch chân trong “plays” đọc /z/; trong ba từ likes, books, stops đều đọc /s/. Vì vậy “plays” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"meat","B":"head","C":"bread","D":"dead"},"optionMarks":[{"word":"meat","marked":"ea"},{"word":"head","marked":"ea"},{"word":"bread","marked":"ea"},{"word":"dead","marked":"ea"}],"answer":"A","explanation":"Phần gạch chân trong “meat” đọc /iː/; trong ba từ head, bread, dead đều đọc /e/. Vì vậy “meat” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"children","B":"chemical","C":"chair","D":"church"},"optionMarks":[{"word":"children","marked":"ch"},{"word":"chemical","marked":"ch"},{"word":"chair","marked":"ch"},{"word":"church","marked":"ch"}],"answer":"B","explanation":"Phần gạch chân trong “chemical” đọc /k/; trong ba từ children, chair, church đều đọc /tʃ/. Vì vậy “chemical” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"seat","B":"meat","C":"heat","D":"break"},"optionMarks":[{"word":"seat","marked":"ea"},{"word":"meat","marked":"ea"},{"word":"heat","marked":"ea"},{"word":"break","marked":"ea"}],"answer":"D","explanation":"Phần gạch chân trong “break” đọc /eɪ/; trong ba từ seat, meat, heat đều đọc /iː/. Vì vậy “break” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"opportunity","B":"electricity","C":"community","D":"university"},"answer":"C","explanation":"“community” nhấn âm tiết thứ 2; opportunity, electricity, university đều nhấn âm tiết thứ 3. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"convenient","B":"important","C":"family","D":"attractive"},"answer":"C","explanation":"“family” nhấn âm tiết thứ 1; convenient, important, attractive đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"expensive","B":"attractive","C":"convenient","D":"crowded"},"answer":"D","explanation":"“crowded” nhấn âm tiết thứ 1; expensive, attractive, convenient đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"district","B":"history","C":"explore","D":"countryside"},"answer":"C","explanation":"“explore” nhấn âm tiết thứ 2; district, history, countryside đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"Daily exercise helps us stay healthy.","options":{"A":"fit","B":"unhealthy","C":"well","D":"active"},"answer":"B","keyword":"healthy","explanation":"“healthy” nghĩa là khỏe mạnh. “unhealthy” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"The local fair has become popular with teenagers.","options":{"A":"famous","B":"unpopular","C":"well-liked","D":"favoured"},"answer":"B","keyword":"popular","explanation":"“popular” nghĩa là được ưa chuộng. “unpopular” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"I will always remember our family trip.","options":{"A":"keep in mind","B":"forget","C":"recall","D":"recollect"},"answer":"B","keyword":"remember","explanation":"“remember” nghĩa là ghi nhớ. “forget” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"The streets were crowded after the festival.","options":{"A":"lively","B":"busy","C":"empty","D":"noisy"},"answer":"C","keyword":"crowded","explanation":"“crowded” nghĩa là đông đúc. “empty” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"The festival can attract many visitors.","options":{"A":"reject","B":"turn away","C":"discourage","D":"draw"},"answer":"D","keyword":"attract","explanation":"“attract” nghĩa là thu hút. “draw” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"We should respect older generations.","options":{"A":"insult","B":"admire","C":"ignore","D":"blame"},"answer":"B","keyword":"respect","explanation":"“respect” nghĩa là tôn trọng. “admire” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"Her progress has been remarkable.","options":{"A":"tiny","B":"ordinary","C":"impressive","D":"weak"},"answer":"C","keyword":"remarkable","explanation":"“remarkable” nghĩa là đáng chú ý. “impressive” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"The bustling streets were full of people.","options":{"A":"peaceful","B":"silent","C":"busy","D":"empty"},"answer":"C","keyword":"bustling","explanation":"“bustling” nghĩa là nhộn nhịp. “busy” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Phong does not know ______ to find the history museum.","options":{"A":"what","B":"which","C":"how","D":"who"},"answer":"C","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to a heritage exhibition.","options":{"A":"who","B":"where","C":"when","D":"why"},"answer":"A","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"turned down","B":"cut down","C":"looked up","D":"passed down"},"answer":"D","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Phong had to ______ an invitation to the club because of an exam.","options":{"A":"get over","B":"turn down","C":"pass down","D":"find out"},"answer":"B","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"more confident","B":"the more confident","C":"the most confident","D":"the confidence"},"answer":"B","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"long","B":"the longer","C":"longer","D":"the longest"},"answer":"B","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Phong feels anxious before the test, Phong ______ ask a teacher for advice.","options":{"A":"was","B":"did","C":"would","D":"should"},"answer":"D","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"might","B":"should","C":"mustn't","D":"could"},"answer":"C","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Phong ______ photos of the old town.","options":{"A":"was taking","B":"has taken","C":"is taking","D":"takes"},"answer":"A","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Da Nang, it began to rain.","options":{"A":"were walking","B":"have walked","C":"are walking","D":"walk"},"answer":"A","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the cultural centre.","options":{"A":"live","B":"lived","C":"have lived","D":"will live"},"answer":"B","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Phong ______ a traditional pottery workshop.","options":{"A":"has visited","B":"visited","C":"visits","D":"was visiting"},"answer":"A","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Da Nang since 2019.","options":{"A":"live","B":"were living","C":"lived","D":"have lived"},"answer":"D","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"learn","B":"learning","C":"to learn","D":"learned"},"answer":"B","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ a heritage exhibition next month.","options":{"A":"organising","B":"organised","C":"to organise","D":"organise"},"answer":"C","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"Phong: \"Would you like to join us for a heritage exhibition?\"  A friend: \"______\"","options":{"A":"No, I am not a place.","B":"Yes, I would love to.","C":"That is my bicycle.","D":"Yes, I am like it."},"answer":"B","explanation":"Đây là lời mời. Câu đáp “Yes, I would love to.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"Phong: \"I think preserving traditional customs is important.\"  A friend: \"______\"","options":{"A":"It was at 6 p.m.","B":"I am sorry you lost it.","C":"Never travel by bus.","D":"I completely agree with you."},"answer":"D","explanation":"Đây là tình huống giao tiếp trong đoạn hội thoại. Câu đáp “I completely agree with you.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"Phong: \"Could I use your dictionary for a moment?\"  A friend: \"______\"","options":{"A":"No, I am afraid of it.","B":"Of course. Here you are.","C":"Yes, I used it yesterday.","D":"I have no idea where."},"answer":"B","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “Of course. Here you are.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"Phong: \"How about visiting the local museum this Sunday?\"  A friend: \"______\"","options":{"A":"No, I have never been a museum.","B":"It is made of glass.","C":"How many kilometres?","D":"That sounds like a great idea!"},"answer":"D","explanation":"Đây là tình huống giao tiếp trong đoạn hội thoại. Câu đáp “That sounds like a great idea!” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The more crowded (B) the road is,(C)  the (D) long traffic takes.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) longer the journey takes.”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) I wish (B) I have(C)  more free time (D) this weekend.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) I had”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) If you (B) will feel(C)  stressed, you should (D) talk to a teacher.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) feel”. Xét cấu trúc câu, dạng động từ và dấu hiệu thời gian để sửa lỗi."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) She did not know (B) how to finding(C)  the way (D) to the craft village.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) how to find”. Sau từ để hỏi dùng to + động từ nguyên mẫu, không dùng V-ing."},{"number":40,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – HERITAGE OPEN DAY\nOur school is organising Heritage Open Day next Friday. Students are encouraged to (40) _____ part and explore the town museum and old houses. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring a notebook and help us cut down (42) _____ unnecessary waste.","options":{"A":"take","B":"make","C":"get","D":"do"},"answer":"A","explanation":"“take part in” = tham gia. Đây là cụm cố định; không nói make/get/do part in."},{"number":41,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – HERITAGE OPEN DAY\nOur school is organising Heritage Open Day next Friday. Students are encouraged to (40) _____ part and explore the town museum and old houses. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring a notebook and help us cut down (42) _____ unnecessary waste.","options":{"A":"joining","B":"join","C":"joined","D":"to join"},"answer":"D","explanation":"“want + to V” là cấu trúc đúng: want to join the event."},{"number":42,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – HERITAGE OPEN DAY\nOur school is organising Heritage Open Day next Friday. Students are encouraged to (40) _____ part and explore the town museum and old houses. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring a notebook and help us cut down (42) _____ unnecessary waste.","options":{"A":"at","B":"from","C":"on","D":"of"},"answer":"C","explanation":"“cut down on + noun” = cắt giảm điều gì. Giới từ bắt buộc là on."},{"number":43,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Stories From The Past\nMany grandparents in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. In addition, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"learn","B":"to learn","C":"learned","D":"learning"},"answer":"B","explanation":"Sau how diễn đạt cách học dùng cấu trúc “how + to V”: how to learn."},{"number":44,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Stories From The Past\nMany grandparents in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. In addition, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"give up","B":"turn down","C":"find","D":"take off"},"answer":"C","explanation":"“find information” = tìm kiếm thông tin từ nguồn đáng tin cậy. Các phrasal verbs khác không hợp ngữ cảnh."},{"number":45,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Stories From The Past\nMany grandparents in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. In addition, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"knowledgeably","B":"most knowledgeable","C":"more knowledgeable","D":"knowledge"},"answer":"C","explanation":"So sánh hai trạng thái mức độ hiểu biết: become + comparative adjective → more knowledgeable."},{"number":46,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Stories From The Past\nMany grandparents in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. In addition, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"have","B":"did","C":"should","D":"were"},"answer":"C","explanation":"Lời khuyên trong tình huống khó khăn dùng should + V: they should ask for advice."},{"number":47,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Stories From The Past\nMany grandparents in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. In addition, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"quickly","B":"freely","C":"meaningful","D":"more"},"answer":"C","explanation":"Trước danh từ “experience” cần tính từ bổ nghĩa: valuable experience = trải nghiệm quý giá."},{"number":48,"part":"PART 10 – READING TRUE / FALSE","stem":"The students went to Hue to learn about old family photographs.   T ☐    F ☐","passage":"Family Memories Exhibition\nLast Sunday, a group of Grade 9 students visited Hue to learn about old family photographs. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their grandmother, who explained the main ideas and gave practical examples. Each student received a photo album to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Bài đọc xác nhận ngay câu mở đầu: Last Sunday, a group of Grade 9 students visited Hue to learn about old family photographs. Before the activity, their teacher asked them to prepare a. Vì vậy phát biểu này đúng."},{"number":49,"part":"PART 10 – READING TRUE / FALSE","stem":"The students received no preparation instructions from their teacher.   T ☐    F ☐","passage":"Family Memories Exhibition\nLast Sunday, a group of Grade 9 students visited Hue to learn about old family photographs. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their grandmother, who explained the main ideas and gave practical examples. Each student received a photo album to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Trong đoạn, giáo viên yêu cầu học sinh chuẩn bị câu hỏi và mang sổ ghi chép; vì vậy nói “không hướng dẫn chuẩn bị” là sai."},{"number":50,"part":"PART 10 – READING TRUE / FALSE","stem":"They met their grandmother during the activity.   T ☐    F ☐","passage":"Family Memories Exhibition\nLast Sunday, a group of Grade 9 students visited Hue to learn about old family photographs. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their grandmother, who explained the main ideas and gave practical examples. Each student received a photo album to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Đoạn văn ghi rõ học sinh gặp giáo viên tại nơi diễn ra hoạt động; vì vậy phát biểu đúng."},{"number":51,"part":"PART 10 – READING TRUE / FALSE","stem":"The activity continued until after midnight.   T ☐    F ☐","passage":"Family Memories Exhibition\nLast Sunday, a group of Grade 9 students visited Hue to learn about old family photographs. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their grandmother, who explained the main ideas and gave practical examples. Each student received a photo album to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"Family Memories Exhibition\nLast Sunday, a group of Grade 9 students visited Hue to learn about old family photographs. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their grandmother, who explained the main ideas and gave practical examples. Each student received a photo album to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"Family Stories From Hue\nPhong is a Grade 9 student who recently completed a project about traditional family memories in Hue. At first, Phong thought the project might be difficult because there was so much information to collect. However, things became easier after the student interviewed his grandmother. An older community member offered useful advice and explained why the topic matters to local people. During the project, Phong received a collection of old photos as a reminder of the experience. The student described the visit as precious and was proud of completing the work. After returning to school, Phong prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"The history of modern smartphones","B":"An expensive shopping experience","C":"A guide to international airports","D":"Phong's project about traditional family memories"},"answer":"D","explanation":"Ý chính bao quát toàn đoạn là “Phong's project about traditional family memories”, đúng với hoạt động được giới thiệu ở đầu bài và phát triển xuyên suốt đoạn. Các đáp án khác không phản ánh nội dung chính."},{"number":54,"part":"PART 11 – READING COMPREHENSION","stem":"Where did Phong carry out the project?","passage":"Family Stories From Hue\nPhong is a Grade 9 student who recently completed a project about traditional family memories in Hue. At first, Phong thought the project might be difficult because there was so much information to collect. However, things became easier after the student interviewed his grandmother. An older community member offered useful advice and explained why the topic matters to local people. During the project, Phong received a collection of old photos as a reminder of the experience. The student described the visit as precious and was proud of completing the work. After returning to school, Phong prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"London","B":"New York","C":"Sydney","D":"Hue"},"answer":"D","explanation":"Địa điểm “Hue” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “precious” in the passage is CLOSEST in meaning to ______.","passage":"Family Stories From Hue\nPhong is a Grade 9 student who recently completed a project about traditional family memories in Hue. At first, Phong thought the project might be difficult because there was so much information to collect. However, things became easier after the student interviewed his grandmother. An older community member offered useful advice and explained why the topic matters to local people. During the project, Phong received a collection of old photos as a reminder of the experience. The student described the visit as precious and was proud of completing the work. After returning to school, Phong prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"valuable","B":"boring","C":"unpleasant","D":"ordinary"},"answer":"A","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “valuable”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"Family Stories From Hue\nPhong is a Grade 9 student who recently completed a project about traditional family memories in Hue. At first, Phong thought the project might be difficult because there was so much information to collect. However, things became easier after the student interviewed his grandmother. An older community member offered useful advice and explained why the topic matters to local people. During the project, Phong received a collection of old photos as a reminder of the experience. The student described the visit as precious and was proud of completing the work. After returning to school, Phong prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Phong","B":"a classmate","C":"the community member","D":"the teacher"},"answer":"A","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Phong” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"Family Stories From Hue\nPhong is a Grade 9 student who recently completed a project about traditional family memories in Hue. At first, Phong thought the project might be difficult because there was so much information to collect. However, things became easier after the student interviewed his grandmother. An older community member offered useful advice and explained why the topic matters to local people. During the project, Phong received a collection of old photos as a reminder of the experience. The student described the visit as precious and was proud of completing the work. After returning to school, Phong prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Phong kept the results secret and never presented them.","B":"Phong gave a presentation at school.","C":"Several classmates wanted to try a similar project.","D":"Phong received a collection of old photos during the project."},"answer":"A","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"The children returned home ______ after the trip. (SAFE)","answer":"safely","explanation":"Từ gốc trong ngoặc phải biến đổi thành “safely” (trạng từ bổ nghĩa cho động từ). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"The town is famous for its ______ buildings. (HISTORY)","answer":"historical","explanation":"Từ gốc trong ngoặc phải biến đổi thành “historical” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"Talking to a counsellor may help reduce your ______. (ANXIOUS)","answer":"anxiety","explanation":"Từ gốc trong ngoặc phải biến đổi thành “anxiety” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"The festival includes many ______ activities. (CULTURE)","answer":"cultural","explanation":"Từ gốc trong ngoặc phải biến đổi thành “cultural” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"The holiday was a wonderful and ______ experience. (MEMORY)","answer":"memorable","explanation":"Từ gốc trong ngoặc phải biến đổi thành “memorable” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"We began working on this project two months ago. (FOR)","answer":"We have worked on this project for two months.","explanation":"Đáp án mẫu: “We have worked on this project for two months.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"If you exercise more, you will become healthier. (THE)","answer":"The more you exercise, the healthier you will become.","explanation":"Đáp án mẫu: “The more you exercise, the healthier you will become.” So sánh kép: The + comparative..., the + comparative..."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"I do not have enough time to visit the museum. (WISH)","answer":"I wish I had enough time to visit the museum.","explanation":"Đáp án mẫu: “I wish I had enough time to visit the museum.” Wish ở hiện tại: S + wish(es) + S + past simple / could + V."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"She chose to join the art club. (DECIDED)","answer":"She decided to join the art club.","explanation":"Đáp án mẫu: “She decided to join the art club.” Các động từ như plan, decide, want đi với to-infinitive."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"If / you / want / reduce / stress / you / should / sleep / enough.","answer":"If you want to reduce stress, you should sleep enough.","explanation":"Câu hoàn chỉnh: “If you want to reduce stress, you should sleep enough.” Câu điều kiện loại 1: If + hiện tại đơn, S + modal/will + V."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"She / wish / she / have / more time / for exercise.","answer":"She wishes she had more time for exercise.","explanation":"Câu hoàn chỉnh: “She wishes she had more time for exercise.” Hiện tại hoàn thành đi với since (mốc) hoặc for (khoảng thời gian)."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"Last month / the students / decide / visit / a pottery village.","answer":"Last month, the students decided to visit a pottery village.","explanation":"Câu hoàn chỉnh: “Last month, the students decided to visit a pottery village.” So sánh kép dùng The + so sánh hơn ở cả hai vế."}]},{"test":5,"title":"TEST 05 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"town","B":"snow","C":"now","D":"cow"},"optionMarks":[{"word":"town","marked":"ow"},{"word":"snow","marked":"ow"},{"word":"now","marked":"ow"},{"word":"cow","marked":"ow"}],"answer":"B","explanation":"Phần gạch chân trong “snow” đọc /əʊ/; trong ba từ town, now, cow đều đọc /aʊ/. Vì vậy “snow” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"young","B":"house","C":"count","D":"mouse"},"optionMarks":[{"word":"young","marked":"ou"},{"word":"house","marked":"ou"},{"word":"count","marked":"ou"},{"word":"mouse","marked":"ou"}],"answer":"A","explanation":"Phần gạch chân trong “young” đọc /ʌ/; trong ba từ house, count, mouse đều đọc /aʊ/. Vì vậy “young” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"wanted","B":"watched","C":"stopped","D":"looked"},"optionMarks":[{"word":"wanted","marked":"ed"},{"word":"watched","marked":"ed"},{"word":"stopped","marked":"ed"},{"word":"looked","marked":"ed"}],"answer":"A","explanation":"Phần gạch chân trong “wanted” đọc /ɪd/; trong ba từ watched, stopped, looked đều đọc /t/. Vì vậy “wanted” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"many","B":"market","C":"park","D":"car"},"optionMarks":[{"word":"many","marked":"a"},{"word":"market","marked":"ar"},{"word":"park","marked":"ar"},{"word":"car","marked":"ar"}],"answer":"A","explanation":"Phần gạch chân trong “many” đọc /e/; trong ba từ market, park, car đều đọc /ɑː/. Vì vậy “many” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"village","B":"preserve","C":"local","D":"culture"},"answer":"B","explanation":"“preserve” nhấn âm tiết thứ 2; village, local, culture đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"become","B":"ancient","C":"enjoy","D":"relax"},"answer":"B","explanation":"“ancient” nhấn âm tiết thứ 1; become, enjoy, relax đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"discover","B":"improve","C":"remember","D":"pottery"},"answer":"D","explanation":"“pottery” nhấn âm tiết thứ 1; discover, improve, remember đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"event","B":"return","C":"collect","D":"custom"},"answer":"D","explanation":"“custom” nhấn âm tiết thứ 1; event, return, collect đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"They wore traditional clothes at the ceremony.","options":{"A":"customary","B":"contemporary","C":"long-established","D":"cultural"},"answer":"B","keyword":"traditional","explanation":"“traditional” nghĩa là truyền thống. “contemporary” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"The village is famous for its ancient houses.","options":{"A":"traditional","B":"modern","C":"historic","D":"old"},"answer":"B","keyword":"ancient","explanation":"“ancient” nghĩa là cổ xưa. “modern” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"The museum visit was a thrilling experience.","options":{"A":"boring","B":"amazing","C":"exciting","D":"memorable"},"answer":"A","keyword":"thrilling","explanation":"“thrilling” nghĩa là hồi hộp, thú vị. “boring” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"The local residents were generous with their time.","options":{"A":"selfish","B":"helpful","C":"giving","D":"kind"},"answer":"A","keyword":"generous","explanation":"“generous” nghĩa là hào phóng. “selfish” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"The centre will provide free materials.","options":{"A":"supply","B":"borrow","C":"withhold","D":"remove"},"answer":"A","keyword":"provide","explanation":"“provide” nghĩa là cung cấp. “supply” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"Local people work hard to preserve the old temple.","options":{"A":"ignore","B":"protect","C":"replace","D":"damage"},"answer":"B","keyword":"preserve","explanation":"“preserve” nghĩa là gìn giữ, bảo tồn. “protect” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"The children were delighted with the school trip.","options":{"A":"bored","B":"worried","C":"annoyed","D":"very pleased"},"answer":"D","keyword":"delighted","explanation":"“delighted” nghĩa là vui mừng. “very pleased” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"The skilled artisans made beautiful pottery.","options":{"A":"untrained","B":"talented","C":"inexperienced","D":"careless"},"answer":"B","keyword":"skilled","explanation":"“skilled” nghĩa là lành nghề. “talented” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Nga does not know ______ to find the public library.","options":{"A":"how","B":"what","C":"who","D":"which"},"answer":"A","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to a summer volunteer trip.","options":{"A":"who","B":"when","C":"why","D":"where"},"answer":"A","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"passed down","B":"looked up","C":"cut down","D":"turned down"},"answer":"A","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Nga had to ______ an invitation to the club because of an exam.","options":{"A":"find out","B":"get over","C":"turn down","D":"pass down"},"answer":"C","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"more confident","B":"the confidence","C":"the more confident","D":"the most confident"},"answer":"C","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"long","B":"the longest","C":"the longer","D":"longer"},"answer":"C","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Nga feels anxious before the test, Nga ______ ask a teacher for advice.","options":{"A":"should","B":"did","C":"was","D":"would"},"answer":"A","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"might","B":"mustn't","C":"should","D":"could"},"answer":"B","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Nga ______ photos of the old town.","options":{"A":"was taking","B":"has taken","C":"is taking","D":"takes"},"answer":"A","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Sa Pa, it began to rain.","options":{"A":"walk","B":"are walking","C":"were walking","D":"have walked"},"answer":"C","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the sports centre.","options":{"A":"will live","B":"live","C":"lived","D":"have lived"},"answer":"C","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Nga ______ a traditional pottery workshop.","options":{"A":"visits","B":"visited","C":"has visited","D":"was visiting"},"answer":"C","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Sa Pa since 2019.","options":{"A":"live","B":"were living","C":"lived","D":"have lived"},"answer":"D","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"learned","B":"learning","C":"to learn","D":"learn"},"answer":"B","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ a summer volunteer trip next month.","options":{"A":"organise","B":"organising","C":"to organise","D":"organised"},"answer":"C","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"Nga: \"Could I use your dictionary for a moment?\"  A friend: \"______\"","options":{"A":"I have no idea where.","B":"Yes, I used it yesterday.","C":"Of course. Here you are.","D":"No, I am afraid of it."},"answer":"C","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “Of course. Here you are.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"Nga: \"How about visiting the local museum this Sunday?\"  A friend: \"______\"","options":{"A":"How many kilometres?","B":"No, I have never been a museum.","C":"It is made of glass.","D":"That sounds like a great idea!"},"answer":"D","explanation":"Đây là tình huống giao tiếp trong đoạn hội thoại. Câu đáp “That sounds like a great idea!” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"A visitor: \"Could you tell me how to get to the bus station?\"  A resident: \"______\"","options":{"A":"Go straight ahead, then turn left.","B":"That is my favourite subject.","C":"I bought it yesterday.","D":"Yes, I have."},"answer":"A","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “Go straight ahead, then turn left.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"Nga: \"Would you mind helping me carry these books?\"  A friend: \"______\"","options":{"A":"I don't know where.","B":"No, not at all.","C":"Thank you very much.","D":"Yes, I am tired."},"answer":"B","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “No, not at all.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) She did not know (B) how to finding(C)  the way (D) to the craft village.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) how to find”. Sau từ để hỏi dùng to + động từ nguyên mẫu, không dùng V-ing."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The students enjoy (B) to learn(C)  about local customs (D) at school.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) learning”. Sau enjoy dùng V-ing."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) She (B) was reading(C)  a book when the lights (D) go out suddenly last night.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) went out suddenly last night.”. Hành động xảy ra đột ngột trong quá khứ dùng quá khứ đơn: went out."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) While my mother (B) was cooking(C)  dinner, I (D) was watch television.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) was watching television.”. Hành động đang xảy ra trong quá khứ dùng was/were + V-ing."},{"number":40,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"JOIN SUMMER VOLUNTEER CAMP!\nAll Grade 9 students are invited to take part in our special event. We are looking (40) _____ volunteers who can help clean the riverside area. Participants should remember (41) _____ comfortable shoes with them. The event will be (42) _____ by teachers and student leaders so that everyone stays safe.","options":{"A":"of","B":"to","C":"for","D":"at"},"answer":"C","explanation":"“take part in” = tham gia. Đây là cụm cố định; không nói make/get/do part in."},{"number":41,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"JOIN SUMMER VOLUNTEER CAMP!\nAll Grade 9 students are invited to take part in our special event. We are looking (40) _____ volunteers who can help clean the riverside area. Participants should remember (41) _____ comfortable shoes with them. The event will be (42) _____ by teachers and student leaders so that everyone stays safe.","options":{"A":"bringing","B":"brought","C":"to bring","D":"bring"},"answer":"C","explanation":"“want + to V” là cấu trúc đúng: want to join the event."},{"number":42,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"JOIN SUMMER VOLUNTEER CAMP!\nAll Grade 9 students are invited to take part in our special event. We are looking (40) _____ volunteers who can help clean the riverside area. Participants should remember (41) _____ comfortable shoes with them. The event will be (42) _____ by teachers and student leaders so that everyone stays safe.","options":{"A":"organise","B":"organisation","C":"organising","D":"organised"},"answer":"D","explanation":"“cut down on + noun” = cắt giảm điều gì. Giới từ bắt buộc là on."},{"number":43,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"An Unforgettable Journey\nMany visitors in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. The more we listened, the (46) _____ we understood the local community. We have kept in touch with community members (47) _____ last week, and many classmates have asked to join the next project.","options":{"A":"organising","B":"to organise","C":"organise","D":"organised"},"answer":"B","explanation":"Sau how diễn đạt cách học dùng cấu trúc “how + to V”: how to learn."},{"number":44,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"An Unforgettable Journey\nMany visitors in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. The more we listened, the (46) _____ we understood the local community. We have kept in touch with community members (47) _____ last week, and many classmates have asked to join the next project.","options":{"A":"will take","B":"have taken","C":"take","D":"were taking"},"answer":"D","explanation":"“find information” = tìm kiếm thông tin từ nguồn đáng tin cậy. Các phrasal verbs khác không hợp ngữ cảnh."},{"number":45,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"An Unforgettable Journey\nMany visitors in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. Th B":"since","C":"for","D":"during"},"answer":"B","explanation":"Trước danh từ “experience” cần tính từ bổ nghĩa: valuable experience = trải nghiệm quý giá."},{"number":48,"part":"PART 10 – READING TRUE / FALSE","stem":"The students went to Da Lat to learn about outdoor activities.   T ☐    F ☐","passage":"First Camping Experience\nLast Saturday, a group of Grade 9 students visited Da Lat to learn about outdoor activities. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a campsite guide, who explained the main ideas and gave practical examples. Each student received a camping checklist to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Bài đọc xác nhận ngay câu mở đầu: Last Saturday, a group of Grade 9 students visited Da Lat to learn about outdoor activities. Before the activity, their teacher asked them to prepare . Vì vậy phát biểu này đúng."},{"number":49,"part":"PART 10 – READING TRUE / FALSE","stem":"The students received no preparation instructions from their teacher.   T ☐    F ☐","passage":"First Camping Experience\nLast Saturday, a group of Grade 9 students visited Da Lat to learn about outdoor activities. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a campsite guide, who explained the main ideas and gave practical examples. Each student received a camping checklist to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand ải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"First Camping Experience\nLast Saturday, a group of Grade 9 students visited Da Lat to learn about outdoor activities. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a campsite guide, who explained the main ideas and gave practical examples. Each student received a camping checklist to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"A First Summer Course\nNga is a Grade 9 student who recently completed a project about a summer English course in Da Lat. At first, Nga thought the project might be difficult because there was so much information to collect. However, things became easier after the student stayed with a host family. An older community member offered useful advice and explained why the topic matters to local people. During the project, Nga received a learning diary as a reminder of the experience. The student described the visit as memorable and was proud of completing the work. After returning to school, Nga prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"A guide to international airports","B":"Nga's project about a summer English course","C":"The history of modern smartphones","D":"An expensive t as memorable and was proud of completing the work. After returning to school, Nga prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"ordinary","B":"unpleasant","C":"unforgettable","D":"boring"},"answer":"C","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “unforgettable”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"A First Summer Course\nNga is a Grade 9 student who recently completed a project about a summer English course in Da Lat. At first, Nga thought the project might be difficult because there was so much information to collect. However, things became easier after the student stayed with a host family. An older community member offered useful advice and explained why the topic matters to local people. During the project, Nga received a learning diary as a reminder of the experience. The student described the visit as memorable and was proud of completing the work. After returning to school, Nga prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"the teacher","B":"the community member","C":"Nga","D":"a classmate"},"answer":"C","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Nga” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"A First Summer Course\nNga is a Grade 9 student who recently completed a project about a summer English course in Da Lat. At first, Nga thought the project might be difficult because there was so much information to collect. However, things became easier after the student stayed with a host family. An older community member offered useful advice and explained why the topic matters to local people. During the project, Nga received a learning diary as a reminder of the experience. The student described the visit as memorable and was proud of completing the work. After returning to school, Nga prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Nga kept the results secret and never presented them.","B":"Several classmates wanted to try a similar project.","C":"Nga gave a presentation at school.","D":"Nga received a learning diary during the project."},"answer":"A","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"Our trip to the old town was truly ______. (FORGET)","answer":"unforgettable","explanation":"Từ gốc trong ngoặc phải biến đổi thành “unforgettable” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"Students should take ______ for their learning. (RESPONSIBLE)","answer":"responsibility","explanation":"Từ gốc trong ngoặc phải biến đổi thành “responsibility” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"The local market is a major tourist ______. (ATTRACT)","answer":"attraction","explanation":"Từ gốc trong ngoặc phải biến đổi thành “attraction” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"Online learning offers greater ______ to many students. (FLEXIBLE)","answer":"flexibility","explanation":"Từ gốc trong ngoặc phải biến đổi thành “flexibility” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"The pottery exhibition was extremely ______. (IMPRESS)","answer":"impressive","explanation":"Từ gốc trong ngoặc phải biến đổi thành “impressive” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"He did not know the place where he should park. (WHERE)","answer":"He did not know where to park.","explanation":"Đáp án mẫu: “He did not know where to park.” Rút gọn mệnh đề gián tiếp: wh-word + to-infinitive."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"If you practise speaking more, you will become more confident. (THE)","answer":"The more you practise speaking, the more confident you will become.","explanation":"Đáp án mẫu: “The more you practise speaking, the more confident you will become.” So sánh kép: The + comparative..., the + comparative..."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"He likes collecting old photographs. (ENJOYS)","answer":"He enjoys collecting old photographs.","explanation":"Đáp án mẫu: “He enjoys collecting old photographs.” Giữ nguyên nghĩa câu gốc đồng thời đổi cấu trúc phù hợp từ gợi ý."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"The last time Mai visited Hue was in 2021. (SINCE)","answer":"Mai has not visited Hue since 2021.","explanation":"Đáp án mẫu: “Mai has not visited Hue since 2021.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"the / more / we / read / the / more / we / understand / history.","answer":"The more we read, the more we understand history.","explanation":"Câu hoàn chỉnh: “The more we read, the more we understand history.” So sánh kép dùng The + so sánh hơn ở cả hai vế."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"If / you / feel / stressed / you / should / talk / teacher.","answer":"If you feel stressed, you should talk to a teacher.","explanation":"Câu hoàn chỉnh: “If you feel stressed, you should talk to a teacher.” Câu điều kiện loại 1: If + hiện tại đơn, S + modal/will + V."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"I / wish / my school / have / a bigger library.","answer":"I wish my school had a bigger library.","explanation":"Câu hoàn chỉnh: “I wish my school had a bigger library.” Sắp xếp đúng S–V–O, giới từ và thì theo mốc thời gian."}]},{"test":6,"title":"TEST 06 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"cat","B":"city","C":"cycle","D":"centre"},"optionMarks":[{"word":"cat","marked":"c"},{"word":"city","marked":"c"},{"word":"cycle","marked":"c"},{"word":"centre","marked":"c"}],"answer":"A","explanation":"Phần gạch chân trong “cat” đọc /k/; trong ba từ city, cycle, centre đều đọc /s/. Vì vậy “cat” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"chemical","B":"church","C":"chair","D":"children"},"optionMarks":[{"word":"chemical","marked":"ch"},{"word":"church","marked":"ch"},{"word":"chair","marked":"ch"},{"word":"children","marked":"ch"}],"answer":"A","explanation":"Phần gạch chân trong “chemical” đọc /k/; trong ba từ church, chair, children đều đọc /tʃ/. Vì vậy “chemical” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"plays","B":"likes","C":"books","D":"stops"},"optionMarks":[{"word":"plays","marked":"s"},{"word":"likes","marked":"s"},{"word":"books","marked":"s"},{"word":"stops","marked":"s"}],"answer":"A","explanation":"Phần gạch chân trong “plays” đọc /z/; trong ba từ likes, books, stops đều đọc /s/. Vì vậy “plays” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"head","B":"bread","C":"meat","D":"dead"},"optionMarks":[{"word":"head","marked":"ea"},{"word":"bread","marked":"ea"},{"word":"meat","marked":"ea"},{"word":"dead","marked":"ea"}],"answer":"C","explanation":"Phần gạch chân trong “meat” đọc /iː/; trong ba từ head, bread, dead đều đọc /e/. Vì vậy “meat” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"local","B":"develop","C":"attract","D":"preserve"},"answer":"A","explanation":"“local” nhấn âm tiết thứ 1; develop, attract, preserve đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"market","B":"amazing","C":"travel","D":"village"},"answer":"B","explanation":"“amazing” nhấn âm tiết thứ 2; market, travel, village đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"polluted","B":"heritage","C":"traditional","D":"exciting"},"answer":"B","explanation":"“heritage” nhấn âm tiết thứ 1; polluted, traditional, exciting đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"surprised","B":"relaxed","C":"helpful","D":"amazed"},"answer":"C","explanation":"“helpful” nhấn âm tiết thứ 1; surprised, relaxed, amazed đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"The countryside was very peaceful at night.","options":{"A":"calm","B":"noisy","C":"relaxing","D":"quiet"},"answer":"B","keyword":"peaceful","explanation":"“peaceful” nghĩa là yên bình. “noisy” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"The new cycle lane is safe for children.","options":{"A":"protected","B":"harmless","C":"secure","D":"dangerous"},"answer":"D","keyword":"safe","explanation":"“safe” nghĩa là an toàn. “dangerous” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"The student felt anxious before his exams.","options":{"A":"uneasy","B":"nervous","C":"worried","D":"calm"},"answer":"D","keyword":"anxious","explanation":"“anxious” nghĩa là lo lắng. “calm” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"The family kept its valuable photographs.","options":{"A":"important","B":"precious","C":"worthless","D":"meaningful"},"answer":"C","keyword":"valuable","explanation":"“valuable” nghĩa là có giá trị. “worthless” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"The roads are congested during rush hour.","options":{"A":"empty","B":"quiet","C":"crowded","D":"safe"},"answer":"C","keyword":"congested","explanation":"“congested” nghĩa là ùn tắc. “crowded” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"The guide told us a fascinating story.","options":{"A":"boring","B":"unpleasant","C":"ordinary","D":"interesting"},"answer":"D","keyword":"fascinating","explanation":"“fascinating” nghĩa là hấp dẫn. “interesting” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"Teachers should support stressed students.","options":{"A":"punish","B":"blame","C":"ignore","D":"help"},"answer":"D","keyword":"support","explanation":"“support” nghĩa là hỗ trợ. “help” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"The tour was a memorable experience.","options":{"A":"dull","B":"common","C":"ordinary","D":"unforgettable"},"answer":"D","keyword":"memorable","explanation":"“memorable” nghĩa là đáng nhớ. “unforgettable” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Huy does not know ______ to find the pottery village.","options":{"A":"what","B":"which","C":"how","D":"who"},"answer":"C","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to the local lifestyle project.","options":{"A":"when","B":"why","C":"who","D":"where"},"answer":"C","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"turned down","B":"passed down","C":"cut down","D":"looked up"},"answer":"B","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Huy had to ______ an inv
