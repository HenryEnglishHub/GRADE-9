,"answer":"D","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Thao ______ a traditional pottery workshop.","options":{"A":"visited","B":"has visited","C":"visits","D":"was visiting"},"answer":"B","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Vung Tau since 2019.","options":{"A":"have lived","B":"live","C":"lived","D":"were living"},"answer":"A","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"learning","B":"learn","C":"learned","D":"to learn"},"answer":"A","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ a bicycle safety campaign next month.","options":{"A":"organising","B":"organise","C":"to organise","D":"organised"},"answer":"C","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"Thao: \"Thank you for showing us around the old town.\"  A guide: \"______\"","options":{"A":"Yes, please.","B":"You are welcome.","C":"That is a pity.","D":"How exciting!"},"answer":"B","explanation":"Đây là lời cảm ơn. Câu đáp “You are welcome.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"A student: \"I am sorry I was late for the heritage tour.\"  Teacher: \"______\"","options":{"A":"You must buy it.","B":"Nice to meet you.","C":"Congratulations!","D":"Please try to be on time next time."},"answer":"D","explanation":"Đây là lời xin lỗi. Câu đáp “Please try to be on time next time.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"Thao: \"Would you like to join us for a cultural exchange?\"  A friend: \"______\"","options":{"A":"Yes, I am like it.","B":"That is my bicycle.","C":"No, I am not a place.","D":"Yes, I would love to."},"answer":"D","explanation":"Đây là lời mời. Câu đáp “Yes, I would love to.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"Thao: \"I think preserving traditional customs is important.\"  A friend: \"______\"","options":{"A":"It was at 6 p.m.","B":"I am sorry you lost it.","C":"I completely agree with you.","D":"Never travel by bus."},"answer":"C","explanation":"Đây là tình huống giao tiếp trong đoạn hội thoại. Câu đáp “I completely agree with you.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) She did not know (B) how to finding(C)  the way (D) to the craft village.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) how to find”. Sau từ để hỏi dùng to + động từ nguyên mẫu, không dùng V-ing."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The students enjoy (B) to learn(C)  about local customs (D) at school.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) learning”. Sau enjoy dùng V-ing."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) She (B) was reading(C)  a book when the lights (D) go out suddenly last night.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) went out suddenly last night.”. Hành động xảy ra đột ngột trong quá khứ dùng quá khứ đơn: went out."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) While my mother (B) was cooking(C)  dinner, I (D) was watch television.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) was watching television.”. Hành động đang xảy ra trong quá khứ dùng was/were + V-ing."},{"number":40,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – CYCLING SAFETY DAY\nOur school is organising Cycling Safety Day next Friday. Students are encouraged to (40) _____ part and learn safe cycling habits. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring a helmet and help us cut down (42) _____ unnecessary waste.","options":{"A":"do","B":"get","C":"make","D":"take"},"answer":"D","explanation":"“take part in” = tham gia. Đây là cụm cố định; không nói make/get/do part in."},{"number":41,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – CYCLING SAFETY DAY\nOur school is organising Cycling Safety Day next Friday. Students are encouraged to (40) _____ part and learn safe cycling habits. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring a helmet and help us cut down (42) _____ unnecessary waste.","options":{"A":"joining","B":"join","C":"to join","D":"joined"},"answer":"C","explanation":"“want + to V” là cấu trúc đúng: want to join the event."},{"number":42,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – CYCLING SAFETY DAY\nOur school is organising Cycling Safety Day next Friday. Students are encouraged to (40) _____ part and learn safe cycling habits. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring a helmet and help us cut down (42) _____ unnecessary waste.","options":{"A":"on","B":"from","C":"of","D":"at"},"answer":"A","explanation":"“cut down on + noun” = cắt giảm điều gì. Giới từ bắt buộc là on."},{"number":43,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Cycling Club\nMany teenagers in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. Therefore, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"learn","B":"learned","C":"to learn","D":"learning"},"answer":"C","explanation":"Sau how diễn đạt cách học dùng cấu trúc “how + to V”: how to learn."},{"number":44,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Cycling Club\nMany teenagers in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. Therefore, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"find","B":"take off","C":"turn down","D":"give up"},"answer":"A","explanation":"“find information” = tìm kiếm thông tin từ nguồn đáng tin cậy. Các phrasal verbs khác không hợp ngữ cảnh."},{"number":45,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Cycling Club\nMany teenagers in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. Therefore, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"most knowledgeable","B":"more knowledgeable","C":"knowledgeably","D":"knowledge"},"answer":"B","explanation":"So sánh hai trạng thái mức độ hiểu biết: become + comparative adjective → more knowledgeable."},{"number":46,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Cycling Club\nMany teenagers in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. Therefore, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"should","B":"did","C":"have","D":"were"},"answer":"A","explanation":"Lời khuyên trong tình huống khó khăn dùng should + V: they should ask for advice."},{"number":47,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Cycling Club\nMany teenagers in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. Therefore, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"freely","B":"quickly","C":"enjoyable","D":"more"},"answer":"C","explanation":"Trước danh từ “experience” cần tính từ bổ nghĩa: valuable experience = trải nghiệm quý giá."},{"number":48,"part":"PART 10 – READING TRUE / FALSE","stem":"The students went to Quy Nhon to learn about regular exercise.   T ☐    F ☐","passage":"Youth Sports Festival\nLast Saturday, a group of Grade 9 students visited Quy Nhon to learn about regular exercise. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a fitness coach, who explained the main ideas and gave practical examples. Each student received a sports timetable to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Bài đọc xác nhận ngay câu mở đầu: Last Saturday, a group of Grade 9 students visited Quy Nhon to learn about regular exercise. Before the activity, their teacher asked them to prepare . Vì vậy phát biểu này đúng."},{"number":49,"part":"PART 10 – READING TRUE / FALSE","stem":"The students received no preparation instructions from their teacher.   T ☐    F ☐","passage":"Youth Sports Festival\nLast Saturday, a group of Grade 9 students visited Quy Nhon to learn about regular exercise. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a fitness coach, who explained the main ideas and gave practical examples. Each student received a sports timetable to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Trong đoạn, giáo viên yêu cầu học sinh chuẩn bị câu hỏi và mang sổ ghi chép; vì vậy nói “không hướng dẫn chuẩn bị” là sai."},{"number":50,"part":"PART 10 – READING TRUE / FALSE","stem":"They met a fitness coach during the activity.   T ☐    F ☐","passage":"Youth Sports Festival\nLast Saturday, a group of Grade 9 students visited Quy Nhon to learn about regular exercise. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a fitness coach, who explained the main ideas and gave practical examples. Each student received a sports timetable to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Đoạn văn ghi rõ học sinh gặp giáo viên tại nơi diễn ra hoạt động; vì vậy phát biểu đúng."},{"number":51,"part":"PART 10 – READING TRUE / FALSE","stem":"The activity continued until after midnight.   T ☐    F ☐","passage":"Youth Sports Festival\nLast Saturday, a group of Grade 9 students visited Quy Nhon to learn about regular exercise. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a fitness coach, who explained the main ideas and gave practical examples. Each student received a sports timetable to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"Youth Sports Festival\nLast Saturday, a group of Grade 9 students visited Quy Nhon to learn about regular exercise. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a fitness coach, who explained the main ideas and gave practical examples. Each student received a sports timetable to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"A Community Sports Day\nThao is a Grade 9 student who recently completed a project about healthy outdoor activities in Quy Nhon. At first, Thao thought the project might be difficult because there was so much information to collect. However, things became easier after the student played badminton with friends. An older community member offered useful advice and explained why the topic matters to local people. During the project, Thao received a sports badge as a reminder of the experience. The student described the visit as en ed a project about healthy outdoor activities in Quy Nhon. At first, Thao thought the project might be difficult because there was so much information to collect. However, things became easier after the student played badminton with friends. An older community member offered useful advice and explained why the topic matters to local people. During the project, Thao received a sports badge as a reminder of the experience. The student described the visit as energetic and was proud of completing the work. After returning to school, Thao prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"boring","B":"ordinary","C":"unpleasant","D":"active"},"answer":"D","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “active”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"A Community Sports Day\nThao is a Grade 9 student who recently completed a project about healthy outdoor activities in Quy Nhon. At first, Thao thought the project might be difficult because there was so much information to collect. However, things became easier after the student played badminton with friends. An older community member offered useful advice and explained why the topic matters to local people. During the project, Thao received a sports badge as a reminder of the experience. The student described the visit as energetic and was proud of completing the work. After returning to school, Thao prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"the community member","B":"a classmate","C":"the teacher","D":"Thao"},"answer":"D","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Thao” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"A Community Sports Day\nThao is a Grade 9 student who recently completed a project about healthy outdoor activities in Quy Nhon. At first, Thao thought the project might be difficult because there was so much information to collect. However, things became easier after the student played badminton with friends. An older community member offered useful advice and explained why the topic matters to local people. During the project, Thao received a sports badge as a reminder of the experience. The student described the visit as energetic and was proud of completing the work. After returning to school, Thao prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Several classmates wanted to try a similar project.","B":"Thao gave a presentation at school.","C":"Thao received a sports badge during the project.","D":"Thao kept the results secret and never presented them."},"answer":"D","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"The local market is a major tourist ______. (ATTRACT)","answer":"attraction","explanation":"Từ gốc trong ngoặc phải biến đổi thành “attraction” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"Online learning offers greater ______ to many students. (FLEXIBLE)","answer":"flexibility","explanation":"Từ gốc trong ngoặc phải biến đổi thành “flexibility” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"The pottery exhibition was extremely ______. (IMPRESS)","answer":"impressive","explanation":"Từ gốc trong ngoặc phải biến đổi thành “impressive” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"The school organised a ______ tour of the heritage site. (EDUCATE)","answer":"educational","explanation":"Từ gốc trong ngoặc phải biến đổi thành “educational” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"The children returned home ______ after the trip. (SAFE)","answer":"safely","explanation":"Từ gốc trong ngoặc phải biến đổi thành “safely” (trạng từ bổ nghĩa cho động từ). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"I do not know the time when I should leave. (WHEN)","answer":"I do not know when to leave.","explanation":"Đáp án mẫu: “I do not know when to leave.” Rút gọn mệnh đề gián tiếp: wh-word + to-infinitive."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"I was cleaning the room. Then my grandmother arrived. (WHEN)","answer":"I was cleaning the room when my grandmother arrived.","explanation":"Đáp án mẫu: “I was cleaning the room when my grandmother arrived.” So sánh kép: The + comparative..., the + comparative..."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"I have no bicycle, so I cannot join the cycling tour. (WISH)","answer":"I wish I had a bicycle so I could join the cycling tour.","explanation":"Đáp án mẫu: “I wish I had a bicycle so I could join the cycling tour.” Wish ở hiện tại: S + wish(es) + S + past simple / could + V."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"Lan started learning English in 2022. (SINCE)","answer":"Lan has learnt English since 2022.","explanation":"Đáp án mẫu: “Lan has learnt English since 2022.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"We / learn / about / local customs / since / last year.","answer":"We have learnt about local customs since last year.","explanation":"Câu hoàn chỉnh: “We have learnt about local customs since last year.” Hiện tại hoàn thành đi với since (mốc) hoặc for (khoảng thời gian)."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"My parents / decide / move / to the city / in 2020.","answer":"My parents decided to move to the city in 2020.","explanation":"Câu hoàn chỉnh: “My parents decided to move to the city in 2020.” Đúng dạng động từ sau động từ chính hoặc giới từ."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"Our class / take part in / three / community projects / so far.","answer":"Our class has taken part in three community projects so far.","explanation":"Câu hoàn chỉnh: “Our class has taken part in three community projects so far.” Sắp xếp đúng S–V–O, giới từ và thì theo mốc thời gian."}]},{"test":14,"title":"TEST 14 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"many","B":"market","C":"park","D":"car"},"optionMarks":[{"word":"many","marked":"a"},{"word":"market","marked":"ar"},{"word":"park","marked":"ar"},{"word":"car","marked":"ar"}],"answer":"A","explanation":"Phần gạch chân trong “many” đọc /e/; trong ba từ market, park, car đều đọc /ɑː/. Vì vậy “many” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"father","B":"cat","C":"map","D":"hat"},"optionMarks":[{"word":"father","marked":"a"},{"word":"cat","marked":"a"},{"word":"map","marked":"a"},{"word":"hat","marked":"a"}],"answer":"A","explanation":"Phần gạch chân trong “father” đọc /ɑː/; trong ba từ cat, map, hat đều đọc /æ/. Vì vậy “father” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"foot","B":"good","C":"book","D":"food"},"optionMarks":[{"word":"foot","marked":"oo"},{"word":"good","marked":"oo"},{"word":"book","marked":"oo"},{"word":"food","marked":"oo"}],"answer":"D","explanation":"Phần gạch chân trong “food” đọc /uː/; trong ba từ foot, good, book đều đọc /ʊ/. Vì vậy “food” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"think","B":"thank","C":"thin","D":"those"},"optionMarks":[{"word":"think","marked":"th"},{"word":"thank","marked":"th"},{"word":"thin","marked":"th"},{"word":"those","marked":"th"}],"answer":"D","explanation":"Phần gạch chân trong “those” đọc /ð/; trong ba từ think, thank, thin đều đọc /θ/. Vì vậy “those” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"preserve","B":"local","C":"develop","D":"attract"},"answer":"B","explanation":"“local” nhấn âm tiết thứ 1; preserve, develop, attract đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"amazing","B":"village","C":"travel","D":"market"},"answer":"A","explanation":"“amazing” nhấn âm tiết thứ 2; village, travel, market đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"heritage","B":"traditional","C":"exciting","D":"polluted"},"answer":"A","explanation":"“heritage” nhấn âm tiết thứ 1; traditional, exciting, polluted đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"relaxed","B":"surprised","C":"amazed","D":"helpful"},"answer":"D","explanation":"“helpful” nhấn âm tiết thứ 1; relaxed, surprised, amazed đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"The village is famous for its ancient houses.","options":{"A":"traditional","B":"modern","C":"old","D":"historic"},"answer":"B","keyword":"ancient","explanation":"“ancient” nghĩa là cổ xưa. “modern” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"The museum visit was a thrilling experience.","options":{"A":"boring","B":"memorable","C":"amazing","D":"exciting"},"answer":"A","keyword":"thrilling","explanation":"“thrilling” nghĩa là hồi hộp, thú vị. “boring” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"The local residents were generous with their time.","options":{"A":"giving","B":"selfish","C":"helpful","D":"kind"},"answer":"B","keyword":"generous","explanation":"“generous” nghĩa là hào phóng. “selfish” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"Lan felt confident before the speaking competition.","options":{"A":"brave","B":"relaxed","C":"insecure","D":"sure"},"answer":"C","keyword":"confident","explanation":"“confident” nghĩa là tự tin. “insecure” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"Local people work hard to preserve the old temple.","options":{"A":"protect","B":"ignore","C":"replace","D":"damage"},"answer":"A","keyword":"preserve","explanation":"“preserve” nghĩa là gìn giữ, bảo tồn. “protect” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"The children were delighted with the school trip.","options":{"A":"worried","B":"very pleased","C":"bored","D":"annoyed"},"answer":"B","keyword":"delighted","explanation":"“delighted” nghĩa là vui mừng. “very pleased” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"The skilled artisans made beautiful pottery.","options":{"A":"untrained","B":"inexperienced","C":"talented","D":"careless"},"answer":"C","keyword":"skilled","explanation":"“skilled” nghĩa là lành nghề. “talented” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"The new bus route is convenient for commuters.","options":{"A":"expensive","B":"confusing","C":"difficult","D":"practical"},"answer":"D","keyword":"convenient","explanation":"“convenient” nghĩa là tiện lợi. “practical” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Khanh does not know ______ to find the heritage house.","options":{"A":"what","B":"which","C":"who","D":"how"},"answer":"D","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to a family history project.","options":{"A":"why","B":"when","C":"where","D":"who"},"answer":"D","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"passed down","B":"cut down","C":"looked up","D":"turned down"},"answer":"A","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Khanh had to ______ an invitation to the club because of an exam.","options":{"A":"pass down","B":"turn down","C":"find out","D":"get over"},"answer":"B","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"the confidence","B":"more confident","C":"the most confident","D":"the more confident"},"answer":"D","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"longer","B":"the longest","C":"long","D":"the longer"},"answer":"D","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Khanh feels anxious before the test, Khanh ______ ask a teacher for advice.","options":{"A":"was","B":"did","C":"should","D":"would"},"answer":"C","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"could","B":"should","C":"mustn't","D":"might"},"answer":"C","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Khanh ______ photos of the old town.","options":{"A":"was taking","B":"has taken","C":"takes","D":"is taking"},"answer":"A","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Ben Tre, it began to rain.","options":{"A":"have walked","B":"were walking","C":"are walking","D":"walk"},"answer":"B","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the history museum.","options":{"A":"live","B":"will live","C":"lived","D":"have lived"},"answer":"C","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Khanh ______ a traditional pottery workshop.","options":{"A":"visits","B":"was visiting","C":"has visited","D":"visited"},"answer":"C","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Ben Tre since 2019.","options":{"A":"live","B":"have lived","C":"were living","D":"lived"},"answer":"B","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"to learn","B":"learned","C":"learn","D":"learning"},"answer":"D","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ a family history project next month.","options":{"A":"to organise","B":"organising","C":"organised","D":"organise"},"answer":"A","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"Khanh: \"Would you like to join us for a family history project?\"  A friend: \"______\"","options":{"A":"Yes, I am like it.","B":"No, I am not a place.","C":"That is my bicycle.","D":"Yes, I would love to."},"answer":"D","explanation":"Đây là lời mời. Câu đáp “Yes, I would love to.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"Khanh: \"I think preserving traditional customs is important.\"  A friend: \"______\"","options":{"A":"Never travel by bus.","B":"I am sorry you lost it.","C":"I completely agree with you.","D":"It was at 6 p.m."},"answer":"C","explanation":"Đây là tình huống giao tiếp trong đoạn hội thoại. Câu đáp “I completely agree with you.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"Khanh: \"Could I use your dictionary for a moment?\"  A friend: \"______\"","options":{"A":"Of course. Here you are.","B":"No, I am afraid of it.","C":"Yes, I used it yesterday.","D":"I have no idea where."},"answer":"A","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “Of course. Here you number":50,"part":"PART 10 – READING TRUE / FALSE","stem":"They met their grandfather during the activity.   T ☐    F ☐","passage":"Memories Of Village Life\nLast Wednesday, a group of Grade 9 students visited Ben Tre to learn about village traditions. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their grandfather, who explained the main ideas and gave practical examples. Each student received a short recording to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Đoạn văn ghi rõ học sinh gặp giáo viên tại nơi diễn ra hoạt động; vì vậy phát biểu đúng."},{"number":51,"part":"PART 10 – READING TRUE / FALSE","stem":"The activity continued until after midnight.   T ☐    F ☐","passage":"Memories Of Village Life\nLast Wednesday, a group of Grade 9 students visited Ben Tre to learn about village traditions. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their grandfather, who explained the main ideas and gave practical examples. Each student received a short recording to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"Memories Of Villa
