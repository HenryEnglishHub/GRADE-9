itation to the club because of an exam.","options":{"A":"turn down","B":"pass down","C":"get over","D":"find out"},"answer":"A","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"more confident","B":"the more confident","C":"the most confident","D":"the confidence"},"answer":"B","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"long","B":"longer","C":"the longest","D":"the longer"},"answer":"D","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Huy feels anxious before the test, Huy ______ ask a teacher for advice.","options":{"A":"would","B":"did","C":"should","D":"was"},"answer":"C","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"might","B":"should","C":"could","D":"mustn't"},"answer":"D","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Huy ______ photos of the old town.","options":{"A":"is taking","B":"takes","C":"was taking","D":"has taken"},"answer":"C","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Ha Noi, it began to rain.","options":{"A":"have walked","B":"are walking","C":"walk","D":"were walking"},"answer":"D","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the city park.","options":{"A":"lived","B":"will live","C":"have lived","D":"live"},"answer":"A","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Huy ______ a traditional pottery workshop.","options":{"A":"visits","B":"visited","C":"has visited","D":"was visiting"},"answer":"C","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Ha Noi since 2019.","options":{"A":"have lived","B":"lived","C":"live","D":"were living"},"answer":"A","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"learning","B":"learned","C":"to learn","D":"learn"},"answer":"A","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ the local lifestyle project next month.","options":{"A":"to organise","B":"organised","C":"organising","D":"organise"},"answer":"A","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"A visitor: \"Could you tell me how to get to the pottery village?\"  A resident: \"______\"","options":{"A":"Yes, I have.","B":"That is my favourite subject.","C":"Go straight ahead, then turn left.","D":"I bought it yesterday."},"answer":"C","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “Go straight ahead, then turn left.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"Huy: \"Would you mind helping me carry these books?\"  A friend: \"______\"","options":{"A":"I don't know where.","B":"Thank you very much.","C":"Yes, I am tired.","D":"No, not at all."},"answer":"D","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “No, not at all.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"Huy: \"I have won the school speaking competition!\"  A friend: \"______\"","options":{"A":"Congratulations!","B":"That is unfortunate.","C":"I am sorry to hear that.","D":"Never mind."},"answer":"A","explanation":"Đây là thông báo tin vui. Câu đáp “Congratulations!” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"Huy: \"I feel stressed about tomorrow's exam.\"  A friend: \"______\"","options":{"A":"Why not take a short break and revise calmly?","B":"That is not your problem.","C":"You should stop sleeping.","D":"Please stay worried."},"answer":"A","explanation":"Đây là chia sẻ sự căng thẳng, cần lời khuyên. Câu đáp “Why not take a short break and revise calmly?” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) While my mother (B) was cooking(C)  dinner, I (D) was watch television.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) was watching television.”. Hành động đang xảy ra trong quá khứ dùng was/were + V-ing."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) This is the first time (B) we visit(C)  a pottery workshop (D) in Ha Noi.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) we have visited”. Xét cấu trúc câu, dạng động từ và dấu hiệu thời gian để sửa lỗi."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The more you practise, (B) the confident(C)  you will (D) become.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) the more confident”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) My brother decided (B) joining(C)  the volunteer club (D) last week.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) to join”. Sau decide dùng to-infinitive: decide to + V."},{"number":40,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"NOTICE – LIFESTYLE EXHIBITION\nOur youth club has planned an activity this weekend. It aims (40) _____ students understand local life through practical tasks. Everyone interested (41) _____ the event should contact the club office. You can bring family photographs. Please arrive (42) _____ so the group can start on time.","options":{"A":"helping","B":"helped","C":"to help","D":"help"},"answer":"C","explanation":"“take part in” = tham gia. Đây là cụm cố định; không nói make/get/do part in."},{"number":41,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"NOTICE – LIFESTYLE EXHIBITION\nOur youth club has planned an activity this weekend. It aims (40) _____ students understand local life through practical tasks. Everyone interested (41) _____ the event should contact the club office. You can bring family photographs. Please arrive (42) _____ so the group can start on time.","options":{"A":"on","B":"for","C":"at","D":"in"},"answer":"D","explanation":"“want + to V” là cấu trúc đúng: want to join the event."},{"number":42,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"NOTICE – LIFESTYLE EXHIBITION\nOur youth club has planned an activity this weekend. It aims (40) _____ students understand local life through practical tasks. Everyone interested (41) _____ the event should contact the club office. You can bring family photographs. Please arrive (42) _____ so the group can start on time.","options":{"A":"earlier","B":"earliest","C":"earliness","D":"early"},"answer":"D","explanation":"“cut down on + noun” = cắt giảm điều gì. Giới từ bắt buộc là on."},{"number":43,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Vietnamese Lifestyles Today\nMany families in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"protect","B":"remember","C":"learn","D":"forget"},"answer":"D","explanation":"Sau how diễn đạt cách học dùng cấu trúc “how + to V”: how to learn."},{"number":44,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Vietnamese Lifestyles Today\nMany families in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"share","B":"shares","C":"shared","D":"sharing"},"answer":"A","explanation":"“find information” = tìm kiếm thông tin từ nguồn đáng tin cậy. Các phrasal verbs khác không hợp ngữ cảnh."},{"number":45,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Vietnamese Lifestyles Today\nMany families in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"learn","B":"to learn","C":"learned","D":"learning"},"answer":"D","explanation":"So sánh hai trạng thái mức độ hiểu biết: become + comparative adjective → more knowledgeable."},{"number":46,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Vietnamese Lifestyles Today\nMany families in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"did","B":"are","C":"would","D":"should"},"answer":"D","explanation":"Lời khuyên trong tình huống khó khăn dùng should + V: they should ask for advice."},{"number":47,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Vietnamese Lifestyles Today\nMany families in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"looked up","B":"turned down","C":"cut down","D":"passed down"},"answer":"D","explanation":"Trước danh từ “experience” cần tính từ bổ nghĩa: valuable experience = trải nghiệm quý giá."},{"number":48,"part":"PART 10 – READING TRUE / FALSE","stem":"The students went to Hoi An to learn about changes in daily life.   T ☐    F ☐","passage":"Then-And-Now Interview\nLast Wednesday, a group of Grade 9 students visited Hoi An to learn about changes in daily life. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met an elderly neighbour, who explained the main ideas and gave practical examples. Each student received an interview notebook to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Bài đọc xác nhận ngay câu mở đầu: Last Wednesday, a group of Grade 9 students visited Hoi An to learn about changes in daily life. Before the activity, their teacher asked them to prep. Vì vậy phát biểu này đúng."},{"number":49,"part":"PART 10 – READING TRUE / FALSE","stem":"The students received no preparation instructions from their teacher.   T ☐    F ☐","passage":"Then-And-Now Interview\nLast Wednesday, a group of Grade 9 students visited Hoi An to learn about changes in daily life. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met an elderly neighbour, who explained the main ideas and gave practical examples. Each student received an interview notebook to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Trong đoạn, giáo viên yêu cầu học sinh chuẩn bị câu hỏi và mang sổ ghi chép; vì vậy nói “không hướng dẫn chuẩn bị” là sai."},{"number":50,"part":"PART 10 – READING TRUE / FALSE","stem":"They met an elderly neighbour during the activity.   T ☐    F ☐","passage":"Then-And-Now Interview\nLast Wednesday, a group of Grade 9 students visited Hoi An to learn about changes in daily life. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met an elderly neighbour, who explained the main ideas and gave practical examples. Each student received an interview notebook to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Đoạn văn ghi rõ học sinh gặp giáo viên tại nơi diễn ra hoạt động; vì vậy phát biểu đúng."},{"number":51,"part":"PART 10 – READING TRUE / FALSE","stem":"The activity continued until after midnight.   T ☐    F ☐","passage":"Then-And-Now Interview\nLast Wednesday, a group of Grade 9 students visited Hoi An to learn about changes in daily life. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met an elderly neighbour, who explained the main ideas and gave practical examples. Each student received an interview notebook to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"Then-And-Now Interview\nLast Wednesday, a group of Grade 9 students visited Hoi An to learn about changes in daily life. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met an elderly neighbour, who explained the main ideas and gave practical examples. Each student received an interview notebook to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"Learning From The Past\nHuy is a Grade 9 student who recently completed a project about changes in Vietnamese lifestyle in Ninh Binh. At first, Huy thought the project might be difficult because there was so much information to collect. However, things became easier after the student visited a village museum. An older community member offered useful advice and explained why the topic matters to local people. During the project, Huy received a short audio interview as a reminder of the experience. The student described the visit as remarkable and was proud of completing the work. After returning to school, Huy prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"The history of modern smartphones","B":"A guide to international airports","C":"Huy's project about changes in Vietnamese lifestyle","D":"An expensive shopping experience"},"answer":"C","explanation":"Ý chính bao quát toàn đoạn là “Huy's project about changes in Vietnamese lifestyle”, đúng với hoạt động được giới thiệu ở đầu bài và phát triển xuyên suốt đoạn. Các đáp án khác không phản ánh nội dung chính."},{"number":54,"part":"PART 11 – READING COMPREHENSION","stem":"Where did Huy carry out the project?","passage":"Learning From The Past\nHuy is a Grade 9 student who recently completed a project about changes in Vietnamese lifestyle in Ninh Binh. At first, Huy thought the project might be difficult because there was so much information to collect. However, things became easier after the student visited a village museum. An older community member offered useful advice and explained why the topic matters to local people. During the project, Huy received a short audio interview as a reminder of the experience. The student described the visit as remarkable and was proud of completing the work. After returning to school, Huy prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"London","B":"New York","C":"Sydney","D":"Ninh Binh"},"answer":"D","explanation":"Địa điểm “Ninh Binh” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “remarkable” in the passage is CLOSEST in meaning to ______.","passage":"Learning From The Past\nHuy is a Grade 9 student who recently completed a project about changes in Vietnamese lifestyle in Ninh Binh. At first, Huy thought the project might be difficult because there was so much information to collect. However, things became easier after the student visited a village museum. An older community member offered useful advice and explained why the topic matters to local people. During the project, Huy received a short audio interview as a reminder of the experience. The student described the visit as remarkable and was proud of completing the work. After returning to school, Huy prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"ordinary","B":"boring","C":"impressive","D":"unpleasant"},"answer":"C","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “impressive”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"Learning From The Past\nHuy is a Grade 9 student who recently completed a project about changes in Vietnamese lifestyle in Ninh Binh. At first, Huy thought the project might be difficult because there was so much information to collect. However, things became easier after the student visited a village museum. An older community member offered useful advice and explained why the topic matters to local people. During the project, Huy received a short audio interview as a reminder of the experience. The student described the visit as remarkable and was proud of completing the work. After returning to school, Huy prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"a classmate","B":"Huy","C":"the teacher","D":"the community member"},"answer":"B","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Huy” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"Learning From The Past\nHuy is a Grade 9 student who recently completed a project about changes in Vietnamese lifestyle in Ninh Binh. At first, Huy thought the project might be difficult because there was so much information to collect. However, things became easier after the student visited a village museum. An older community member offered useful advice and explained why the topic matters to local people. During the project, Huy received a short audio interview as a reminder of the experience. The student described the visit as remarkable and was proud of completing the work. After returning to school, Huy prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Huy kept the results secret and never presented them.","B":"Several classmates wanted to try a similar project.","C":"Huy received a short audio interview during the project.","D":"Huy gave a presentation at school."},"answer":"A","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"He gave a very ______ explanation of the route. (HELP)","answer":"helpful","explanation":"Từ gốc trong ngoặc phải biến đổi thành “helpful” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"We admired the ______ of traditional wooden houses. (BEAUTIFUL)","answer":"beauty","explanation":"Từ gốc trong ngoặc phải biến đổi thành “beauty” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"City traffic can be very ______ during rush hour. (NOISE)","answer":"noisy","explanation":"Từ gốc trong ngoặc phải biến đổi thành “noisy” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"We were surprised by the ______ of the local people. (FRIEND)","answer":"friendliness","explanation":"Từ gốc trong ngoặc phải biến đổi thành “friendliness” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"The government is working to improve road ______. (SAFE)","answer":"safety","explanation":"Từ gốc trong ngoặc phải biến đổi thành “safety” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"I do not know how I can reach the traditional craft village. (HOW)","answer":"I do not know how to reach the traditional craft village.","explanation":"Đáp án mẫu: “I do not know how to reach the traditional craft village.” Rút gọn mệnh đề gián tiếp: wh-word + to-infinitive."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"The phone rang during my homework. (WHILE)","answer":"The phone rang while I was doing my homework.","explanation":"Đáp án mẫu: “The phone rang while I was doing my homework.” Đặt hành động đang diễn ra ở quá khứ tiếp diễn, kết hợp when/while phù hợp."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"I cannot speak English fluently now. (WISH)","answer":"I wish I could speak English fluently now.","explanation":"Đáp án mẫu: “I wish I could speak English fluently now.” Wish ở hiện tại: S + wish(es) + S + past simple / could + V."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"They made a plan to visit the museum. (PLANNED)","answer":"They planned to visit the museum.","explanation":"Đáp án mẫu: “They planned to visit the museum.” Các động từ như plan, decide, want đi với to-infinitive."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"At 8 p.m. / last night / my grandmother / tell / stories / while / we / listen.","answer":"At 8 p.m. last night, my grandmother was telling stories while we were listening.","explanation":"Câu hoàn chỉnh: “At 8 p.m. last night, my grandmother was telling stories while we were listening.” Hai hành động đồng thời trong quá khứ dùng while + past continuous; chú ý was/were + V-ing."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"the / crowded / the city / be / the / difficult / travelling / become.","answer":"The more crowded the city is, the more difficult travelling becomes.","explanation":"Câu hoàn chỉnh: “The more crowded the city is, the more difficult travelling becomes.” So sánh kép dùng The + so sánh hơn ở cả hai vế."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"While / Minh / take / photos / Lan / interview / a craft worker.","answer":"While Minh was taking photos, Lan was interviewing a craft worker.","explanation":"Câu hoàn chỉnh: “While Minh was taking photos, Lan was interviewing a craft worker.” Hai hành động đồng thời trong quá khứ dùng while + past continuous; chú ý was/were + V-ing."}]},{"test":7,"title":"TEST 07 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"moon","B":"food","C":"school","D":"good"},"optionMarks":[{"word":"moon","marked":"oo"},{"word":"food","marked":"oo"},{"word":"school","marked":"oo"},{"word":"good","marked":"oo"}],"answer":"D","explanation":"Phần gạch chân trong “good” đọc /ʊ/; trong ba từ moon, food, school đều đọc /uː/. Vì vậy “good” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"ship","B":"machine","C":"fish","D":"finish"},"optionMarks":[{"word":"ship","marked":"i"},{"word":"machine","marked":"i"},{"word":"fish","marked":"i"},{"word":"finish","marked":"i"}],"answer":"B","explanation":"Phần gạch chân trong “machine” đọc /iː/; trong ba từ ship, fish, finish đều đọc /ɪ/. Vì vậy “machine” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"snow","B":"cow","C":"now","D":"town"},"optionMarks":[{"word":"snow","marked":"ow"},{"word":"cow","marked":"ow"},{"word":"now","marked":"ow"},{"word":"town","marked":"ow"}],"answer":"A","explanation":"Phần gạch chân trong “snow” đọc /əʊ/; trong ba từ cow, now, town đều đọc /aʊ/. Vì vậy “snow” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"mouse","B":"count","C":"house","D":"young"},"optionMarks":[{"word":"mouse","marked":"ou"},{"word":"count","marked":"ou"},{"word":"house","marked":"ou"},{"word":"young","marked":"ou"}],"answer":"D","explanation":"Phần gạch chân trong “young” đọc /ʌ/; trong ba từ mouse, count, house đều đọc /aʊ/. Vì vậy “young” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"protect","B":"mountain","C":"support","D":"advice"},"answer":"B","explanation":"“mountain” nhấn âm tiết thứ 1; protect, support, advice đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"experience","B":"festival","C":"fortunate","D":"wonderful"},"answer":"A","explanation":"“experience” nhấn âm tiết thứ 2; festival, fortunate, wonderful đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"peaceful","B":"remember","C":"colourful","D":"famous"},"answer":"B","explanation":"“remember” nhấn âm tiết thứ 2; peaceful, colourful, famous đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"traditional","B":"important","C":"garden","D":"historical"},"answer":"C","explanation":"“garden” nhấn âm tiết thứ 1; traditional, important, historical đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"This traditional tune sounded familiar to the villagers.","options":{"A":"recognisable","B":"known","C":"common","D":"unfamiliar"},"answer":"D","keyword":"traditional","explanation":"“traditional” nghĩa là truyền thống. “unfamiliar” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"The school made the workshop compulsory for every pupil.","options":{"A":"necessary","B":"required","C":"obligatory","D":"optional"},"answer":"D","keyword":"compulsory","explanation":"“compulsory” nghĩa là bắt buộc. “optional” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"The library is usually quiet in the afternoon.","options":{"A":"peaceful","B":"loud","C":"calm","D":"silent"},"answer":"B","keyword":"quiet","explanation":"“quiet” nghĩa là yên tĩnh. “loud” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"Daily exercise helps us stay healthy.","options":{"A":"fit","B":"well","C":"active","D":"unhealthy"},"answer":"D","keyword":"healthy","explanation":"“healthy” nghĩa là khỏe mạnh. “unhealthy” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"The summer course was a great opportunity to practise English.","options":{"A":"mistake","B":"danger","C":"chance","D":"problem"},"answer":"C","keyword":"opportunity","explanation":"“opportunity” nghĩa là cơ hội. “chance” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"Sleep is essential for teenagers.","options":{"A":"necessary","B":"optional","C":"useless","D":"rare"},"answer":"A","keyword":"essential","explanation":"“essential” nghĩa là thiết yếu. “necessary” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"The camping trip was an adventure for our class.","options":{"A":"exciting experience","B":"argument","C":"routine","D":"failure"},"answer":"A","keyword":"adventure","explanation":"“adventure” nghĩa là cuộc phiêu lưu. “exciting experience” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"The festival can attract many visitors.","options":{"A":"discourage","B":"turn away","C":"reject","D":"draw"},"answer":"D","keyword":"attract","explanation":"“attract” nghĩa là thu hút. “draw” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Hoa does not know ______ to find the bus station.","options":{"A":"who","B":"how","C":"what","D":"which"},"answer":"B","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to a community clean-up.","options":{"A":"why","B":"where","C":"who","D":"when"},"answer":"C","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"looked up","B":"turned down","C":"cut down","D":"passed down"},"answer":"D","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Hoa had to ______ an invitation to the club because of an exam.","options":{"A":"get over","B":"pass down","C":"turn down","D":"find out"},"answer":"C","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"the most confident","B":"more confident","C":"the more confident","D":"the confidence"},"answer":"C","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"long","B":"the longest","C":"the longer","D":"longer"},"answer":"C","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Hoa feels anxious before the test, Hoa ______ ask a teacher for advice.","options":{"A":"was","B":"should","C":"did","D":"would"},"answer":"B","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"mustn't","B":"should","C":"might","D":"could"},"answer":"A","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Hoa ______ photos of the old town.","options":{"A":"takes","B":"is taking","C":"has taken","D":"was taking"},"answer":"D","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Ninh Binh, it began to rain.","options":{"A":"have walked","B":"are walking","C":"walk","D":"were walking"},"answer":"D","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the local market.","options":{"A":"lived","B":"will live","C":"live","D":"have lived"},"answer":"A","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Hoa ______ a traditional pottery workshop.","options":{"A":"visits","B":"was visiting","C":"visited","D":"has visited"},"answer":"D","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Ninh Binh since 2019.","options":{"A":"were living","B":"have lived","C":"lived","D":"live"},"answer":"B","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"learn","B":"to learn","C":"learned","D":"learning"},"answer":"D","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ a community clean-up next month.","options":{"A":"to organise","B":"organising","C":"organise","D":"organised"},"answer":"A","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"Hoa: \"I have won the school speaking competition!\"  A friend: \"______\"","options":{"A":"I am sorry to hear that.","B":"That is unfortunate.","C":"Never mind.","D":"Congratulations!"},"answer":"D","explanation":"Đây là thông báo tin vui. Câu đáp “Congratulations!” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"Hoa: \"I feel stressed about tomorrow's exam.\"  A friend: \"______\"","options":{"A":"That is not your problem.","B":"You should stop sleeping.","C":"Why not take a short break and revise calmly?","D":"Please stay worried."},"answer":"C","explanation":"Đây là chia sẻ sự căng thẳng, cần lời khuyên. Câu đáp “Why not take a short break and revise calmly?” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"Hoa: \"Thank you for showing us around the old town.\"  A guide: \"______\"","options":{"A":"That is a pity.","B":"You are welcome.","C":"Yes, please.","D":"How exciting!"},"answer":"B","explanation":"Đây là lời cảm ơn. Câu đáp “You are welcome.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"A student: \"I am sorry I was late for the heritage tour.\"  Teacher: \"______\"","options":{"A":"Nice to meet you.","B":"Congratulations!","C":"Please try to be on time next time.","D":"You must buy it."},"answer":"C","explanation":"Đây là lời xin lỗi. Câu đáp “Please try to be on time next time.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) My brother decided (B) joining(C)  the volunteer club (D) last week.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) to join”. Sau decide dùng to-infinitive: decide to + V."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The guide did not explain (B) where finding(C)  the local market (D) after the tour.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) where to find”. Sau từ để hỏi dùng to + động từ nguyên mẫu, không dùng V-ing."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) They (B) have visited(C)  the museum (D) yesterday afternoon.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) visited”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The more crowded (B) the road is,(C)  the (D) long traffic takes.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) longer the journey takes.”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":40,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – ARTISAN WORKSHOP\nOur school is organising Artisan Workshop next Friday. Students are encouraged to (40) _____ part and learn how to shape clay safely. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring an apron and help us cut down (42) _____ unnecessary waste.","options":{"A":"do","B":"take","C":"get","D":"make"},"answer":"B","explanation":"“take part in” = tham gia. Đây là cụm cố định; không nói make/get/do part in."},{"number":41,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – ARTISAN WORKSHOP\nOur school is organising Artisan Workshop next Friday. Students are encouraged to (40) _____ part and learn how to shape clay safely. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring an apron and help us cut down (42) _____ unnecessary waste.","options":{"A":"to join","B":"joined","C":"joining","D":"join"},"answer":"A","explanation":"“want + to V” là cấu trúc đúng: want to join the event."},{"number":42,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – ARTISAN WORKSHOP\nOur school is organising Artisan Workshop next Friday. Students are encouraged to (40) _____ part and learn how to shape clay safely. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring an apron and help us cut down (42) _____ unnecessary waste.","options":{"A":"on","B":"at","C":"of","D":"from"},"answer":"A","explanation":"“cut down on + noun” = cắt giảm điều gì. Giới từ bắt buộc là on."},{"number":43,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Community Volunteers\nMany students in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. Moreover, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"learn","B":"learned","C":"to learn","D":"learning"},"answer":"C","explanation":"Sau how diễn đạt cách học dùng cấu trúc “how + to V”: how to learn."},{"number":44,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Community Volunteers\nMany students in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. Moreover, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"turn down","B":"give up","C":"take off","D":"find"},"answer":"D","explanation":"“find information” = tìm kiếm thông tin từ nguồn đáng tin cậy. Các phrasal verbs khác không hợp ngữ cảnh."},{"number":45,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Community Volunteers\nMany students in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. Moreover, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"more knowledgeable","B":"knowledgeably","C":"most knowledgeable","D":"knowledge"},"answer":"A","explanation":"So sánh hai trạng thái mức độ hiểu biết: become + comparative adjective → more knowledgeable."},{"number":46,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Community Volunteers\nMany students in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. Moreover, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"were","B":"did","C":"should","D":"have"},"answer":"C","explanation":"Lời khuyên trong tình huống khó khăn dùng should + V: they should ask for advice."},{"number":47,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Community Volunteers\nMany students in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. Moreover, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"important","B":"quickly","C":"more","D":"freely"},"answer":"A","explanation":"Trước danh từ “experience” cần tính từ bổ nghĩa: valuable experience = trải nghiệm quý giá."},{"number":48,"part":"PART 10 – READING TRUE / FALSE","stem":"The students went to Can Tho to learn about environmental protection.   T ☐    F ☐","passage":"Riverside Clean-Up\nLast Sunday, a group of Grade 9 students visited Can Tho to learn about environmental protection. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a youth volunteer, who explained the main ideas and gave practical examples. Each student received reusable gloves to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Bài đọc xác nhận ngay câu mở đầu: Last Sunday, a group of Grade 9 students visited Can Tho to learn about environmental protection. Before the activity, their teacher asked them to pre. Vì vậy phát biểu này đúng."},{"number":49,"part":"PART 10 – READING TRUE / FALSE","stem":"The students received no preparation instructions from their teacher.   T ☐    F ☐","passage":"Riverside Clean-Up\nLast Sunday, a group of Grade 9 students visited Can Tho to learn about environmental protection. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a youth volunteer, who explained the main ideas and gave practical examples. Each student received reusable gloves to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Trong đoạn, giáo viên yêu cầu học sinh chuẩn bị câu hỏi và mang sổ ghi chép; vì vậy nói “không hướng dẫn chuẩn bị” là sai."},{"number":50,"part":"PART 10 – READING TRUE / FALSE","stem":"They met a youth volunteer during the activity.   T ☐    F ☐","passage":"Riverside Clean-Up\nLast Sunday, a group of Grade 9 students visited Can Tho to learn about environmental protection. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a youth volunteer, who explained the main ideas and gave practical examples. Each student received reusable gloves to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Đoạn văn ghi rõ học sinh gặp giáo viên tại nơi diễn ra hoạt động; vì vậy phát biểu đúng."},{"number":51,"part":"PART 10 – READING TRUE / FALSE","stem":"The activity continued until after midnight.   T ☐    F ☐","passage":"Riverside Clean-Up\nLast Sunday, a group of Grade 9 students visited Can Tho to learn about environmental protection. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a youth volunteer, who explained the main ideas and gave practical examples. Each student received reusable gloves to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"Riverside Clean-Up\nLast Sunday, a group of Grade 9 students visited Can Tho to learn about environmental protection. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a youth volunteer, who explained the main ideas and gave practical examples. Each student received reusable gloves to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"Community Helpers\nHoa is a Grade 9 student who recently completed a project about local community service in Can Tho. At first, Hoa thought the project might be difficult because there was so much information to collect. However, things became easier after the student helped at a clean-up event. An older community member offered useful advice and explained why the topic matters to local people. During the project, Hoa received a cloth shopping bag as a reminder of the experience. The student described the visit as essential and was proud of completing the work. After returning to school, Hoa prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"An expensive shopping experience","B":"A guide to international airports","C":"Hoa's project about local community service","D":"The history of modern smartphones"},"answer":"C","explanation":"Ý chính bao quát toàn đoạn là “Hoa's project about local community service”, đúng với hoạt động được giới thiệu ở đầu bài và phát triển xuyên suốt đoạn. Các đáp án khác không phản ánh nội dung chính."},{"number":54,"part":"PART 11 – READING COMPREHENSION","stem":"Where did Hoa carry out the project?","passage":"Community Helpers\nHoa is a Grade 9 student who recently completed a project about local community service in Can Tho. At first, Hoa thought the project might be difficult because there was so much information to collect. However, things became easier after the student helped at a clean-up event. An older community member offered useful advice and explained why the topic matters to local people. During the project, Hoa received a cloth shopping bag as a reminder of the experience. The student described the visit as essential and was proud of completing the work. After returning to school, Hoa prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Can Tho","B":"Sydney","C":"New York","D":"London"},"answer":"A","explanation":"Địa điểm “Can Tho” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “essential” in the passage is CLOSEST in meaning to ______.","passage":"Community Helpers\nHoa is a Grade 9 student who recently completed a project about local community service in Can Tho. At first, Hoa thought the project might be difficult because there was so much information to collect. However, things became easier after the student helped at a clean-up event. An older community member offered useful advice and explained why the topic matters to local people. During the project, Hoa received a cloth shopping bag as a reminder of the experience. The student described the visit as essential and was proud of completing the work. After returning to school, Hoa prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"boring","B":"unpleasant","C":"necessary","D":"ordinary"},"answer":"C","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “necessary”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"Community Helpers\nHoa is a Grade 9 student who recently completed a project about local community service in Can Tho. At first, Hoa thought the project might be difficult because there was so much information to collect. However, things became easier after the student helped at a clean-up event. An older community member offered useful advice and explained why the topic matters to local people. During the project, Hoa received a cloth shopping bag as a reminder of the experience. The student described the visit as essential and was proud of completing the work. After returning to school, Hoa prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"the community member","B":"the teacher","C":"Hoa","D":"a classmate"},"answer":"C","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Hoa” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"Community Helpers\nHoa is a Grade 9 student who recently completed a project about local community service in Can Tho. At first, Hoa thought the project might be difficult because there was so much information to collect. However, things became easier after the student helped at a clean-up event. An older community member offered useful advice and explained why the topic matters to local people. During the project, Hoa received a cloth shopping bag as a reminder of the experience. The student described the visit as essential and was proud of completing the work. After returning to school, Hoa prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Hoa gave a presentation at school.","B":"Hoa received a cloth shopping bag during the project.","C":"Several classmates wanted to try a similar project.","D":"Hoa kept the results secret and never presented them."},"answer":"D","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"The visitors found the old streets very ______. (INTEREST)","answer":"interesting","explanation":"Từ gốc trong ngoặc phải biến đổi thành “interesting” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"There is a wide ______ of street food in the city. (VARY)","answer":"variety","explanation":"Từ gốc trong ngoặc phải biến đổi thành “variety” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"Our teacher encouraged ______ thinking during the project. (CREATE)","answer":"creative","explanation":"Từ gốc trong ngoặc phải biến đổi thành “creative” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"The new metro makes travelling across the city more ______. (CONVENIENCE)","answer":"convenient","explanation":"Từ gốc trong ngoặc phải biến đổi thành “convenient” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"The ______ of traditional buildings is important. (PRESERVE)","answer":"preservation","explanation":"Từ gốc trong ngoặc phải biến đổi thành “preservation” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"They started living in this city three years ago. (FOR)","answer":"They have lived in this city for three years.","explanation":"Đáp án mẫu: “They have lived in this city for three years.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"You will understand the lesson better if you revise more. (THE)","answer":"The more you revise, the better you will understand the lesson.","explanation":"Đáp án mẫu: “The more you revise, the better you will understand the lesson.” So sánh kép: The + comparative..., the + comparative..."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"She does not like wasting food. (AVOIDS)","answer":"She avoids wasting food.","explanation":"Đáp án mẫu: “She avoids wasting food.” Giữ nguyên nghĩa câu gốc đồng thời đổi cấu trúc phù hợp từ gợi ý."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"She started collecting postcards in 2020. (SINCE)","answer":"She has collected postcards since 2020.","explanation":"Đáp án mẫu: “She has collected postcards since 2020.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"I / not know / where / buy / a handmade souvenir.","answer":"I do not know where to buy a handmade souvenir.","explanation":"Câu hoàn chỉnh: “I do not know where to buy a handmade souvenir.” Cấu trúc wh-word + to V diễn đạt cách/nơi/thời điểm thực hiện."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"The volunteers / enjoy / help / elderly people / at weekends.","answer":"The volunteers enjoy helping elderly people at weekends.","explanation":"Câu hoàn chỉnh: “The volunteers enjoy helping elderly people at weekends.” So sánh kép dùng The + so sánh hơn ở cả hai vế."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"He / not know / how / get / the town museum.","answer":"He does not know how to get to the town museum.","explanation":"Câu hoàn chỉnh: “He does not know how to get to the town museum.” Cấu trúc wh-word + to V diễn đạt cách/nơi/thời điểm thực hiện."}]},{"test":8,"title":"TEST 08 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"road","B":"broad","C":"coat","D":"goat"},"optionMarks":[{"word":"road","marked":"oa"},{"word":"broad","marked":"oa"},{"word":"coat","marked":"oa"},{"word":"goat","marked":"oa"}],"answer":"B","explanation":"Phần gạch chân trong “broad” đọc /ɔː/; trong ba từ road, coat, goat đều đọc /əʊ/. Vì vậy “broad” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"chair","B":"hear","C":"pair","D":"fair"},"optionMarks":[{"word":"chair","marked":"air"},{"word":"hear","marked":"ear"},{"word":"pair","marked":"air"},{"word":"fair","marked":"air"}],"answer":"B","explanation":"Phần gạch chân trong “hear” đọc /ɪə/; trong ba từ chair, pair, fair đều đọc /eə/. Vì vậy “hear” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"centre","B":"cycle","C":"city","D":"cat"},"optionMarks":[{"word":"centre","marked":"c"},{"word":"cycle","marked":"c"},{"word":"city","marked":"c"},{"word":"cat","marked":"c"}],"answer":"D","explanation":"Phần gạch chân trong “cat” đọc /k/; trong ba từ centre, cycle, city đều đọc /s/. Vì vậy “cat” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"church","B":"chemical","C":"chair","D":"children"},"optionMarks":[{"word":"church","marked":"ch"},{"word":"chemical","marked":"ch"},{"word":"chair","marked":"ch"},{"word":"children","marked":"ch"}],"answer":"B","explanation":"Phần gạch chân trong “chemical” đọc /k/; trong ba từ church, chair, children đều đọc /tʃ/. Vì vậy “chemical” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"community","B":"university","C":"opportunity","D":"electricity"},"answer":"A","explanation":"“community” nhấn âm tiết thứ 2; university, opportunity, electricity đều nhấn âm tiết thứ 3. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"important","B":"attractive","C":"family","D":"convenient"},"answer":"C","explanation":"“family” nhấn âm tiết thứ 1; important, attractive, convenient đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"attractive","B":"convenient","C":"expensive","D":"crowded"},"answer":"D","explanation":"“crowded” nhấn âm tiết thứ 1; attractive, convenient, expensive đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"district","B":"countryside","C":"explore","D":"history"},"answer":"C","explanation":"“explore” nhấn âm tiết thứ 2; district, countryside, history đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"The teenagers are becoming more independent.","options":{"A":"self-reliant","B":"dependent","C":"confident","D":"capable"},"answer":"B","keyword":"independent","explanation":"“independent” nghĩa là độc lập. “dependent” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"The old market covered an enormous area.","options":{"A":"huge","B":"tiny","C":"large","D":"massive"},"answer":"B","keyword":"enormous","explanation":"“enormous” nghĩa là rất lớn. “tiny” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"The receptionist was very polite.","options":{"A":"courteous","B":"rude","C":"respectful","D":"kind"},"answer":"B","keyword":"polite","explanation":"“polite” nghĩa là lịch sự. “rude” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"They wore traditional clothes at the ceremony.","options":{"A":"long-established","B":"customary","C":"cultural","D":"contemporary"},"answer":"D","keyword":"traditional","explanation":"“traditional” nghĩa là truyền thống. “contemporary” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"We need reliable information about the city.","options":{"A":"false","B":"trustworthy","C":"risky","D":"unclear"},"answer":"B","keyword":"reliable","explanation":"“reliable” nghĩa là đáng tin cậy. “trustworthy” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"Public transport is becoming more efficient.","options":{"A":"slow","B":"wasteful","C":"unreliable","D":"productive"},"answer":"D","keyword":"efficient","explanation":"“efficient” nghĩa là hiệu quả. “productive” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"We had time to explore the old town.","options":{"A":"avoid","B":"discover","C":"leave","D":"forget"},"answer":"B","keyword":"explore","explanation":"“explore” nghĩa là khám phá. “discover” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"The centre will provide free materials.","options":{"A":"remove","B":"supply","C":"borrow","D":"withhold"},"answer":"B","keyword":"provide","explanation":"“provide” nghĩa là cung cấp. “supply” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Nam does not know ______ to find the youth club.","options":{"A":"who","B":"how","C":"what","D":"which"},"answer":"B","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to an art workshop.","options":{"A":"when","B":"where","C":"who","D":"why"},"answer":"C","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"looked up","B":"cut down","C":"turned down","D":"passed down"},"answer":"D","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Nam had to ______ an invitation to the club because of an exam.","options":{"A":"turn down","B":"pass down","C":"get over","D":"find out"},"answer":"A","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"more confident","B":"the more confident","C":"the most confident","D":"the confidence"},"answer":"B","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"long","B":"the longer","C":"the longest","D":"longer"},"answer":"B","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Nam feels anxious before the test, Nam ______ ask a teacher for advice.","options":{"A":"should","B":"would","C":"was","D":"did"},"answer":"A","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"could","B":"should","C":"might","D":"mustn't"},"answer":"D","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Nam ______ photos of the old town.","options":{"A":"was taking","B":"is taking","C":"has taken","D":"takes"},"answer":"A","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Can Tho, it began to rain.","options":{"A":"were walking","B":"are walking","C":"walk","D":"have walked"},"answer":"A","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the art gallery.","options":{"A":"will live","B":"lived","C":"have lived","D":"live"},"answer":"B","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Nam ______ a traditional pottery workshop.","options":{"A":"visited","B":"visits","C":"was visiting","D":"has visited"},"answer":"D","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Can Tho since 2019.","options":{"A":"live","B":"have lived","C":"were living","D":"lived"},"answer":"B","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"learning","B":"learned","C":"to learn","D":"learn"},"answer":"A","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ an art workshop next month.","options":{"A":"organising","B":"organised","C":"to organise","D":"organise"},"answer":"C","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"Nam: \"Thank you for showing us around the old town.\"  A guide: \"______\"","options":{"A":"You are welcome.","B":"That is a pity.","C":"How exciting!","D":"Yes, please."},"answer":"A","explanation":"Đây là lời cảm ơn. Câu đáp “You are welcome.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"A student: \"I am sorry I was late for the heritage tour.\"  Teacher: \"______\"","options":{"A":"You must buy it.","B":"Nice to meet you.","C":"Congratulations!","D":"Please try to be on time next time."},"answer":"D","explanation":"Đây là lời xin lỗi. Câu đáp “Please try to be on time next time.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"Nam: \"Would you like to join us for a youth sports festival?\"  A friend: \"______\"","options":{"A":"That is my bicycle.","B":"No, I am not a place.","C":"Yes, I would love to.","D":"Yes, I am like it."},"answer":"C","explanation":"Đây là lời mời. Câu đáp “Yes, I would love to.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"Nam: \"I think preserving traditional customs is important.\"  A friend: \"______\"","options":{"A":"I am sorry you lost it.","B":"Never travel by bus.","C":"It was at 6 p.m.","D":"I completely agree with you."},"answer":"D","explanation":"Đây là tình huống giao tiếp trong đoạn hội thoại. Câu đáp “I completely agree with you.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The more crowded (B) the road is,(C)  the (D) long traffic takes.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) longer the journey takes.”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) I wish (B) I have(C)  more free time (D) this weekend.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) I had”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) If you (B) will feel(C)  stressed, you should (D) talk to a teacher.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) feel”. Xét cấu trúc câu, dạng động từ và dấu hiệu thời gian để sửa lỗi."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) She did not know (B) how to finding(C)  the way (D) to the craft village.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) how to find”. Sau từ để hỏi dùng to + động từ nguyên mẫu, không dùng V-ing."},{"number":40,"part":"P ":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"Handmade Paper Project\nLast Tuesday, a group of Grade 9 students visited Ha Noi to learn about traditional crafts. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a local artisan, who explained the main ideas and gave practical examples. Each student received a paper bookmark to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"A Craft Worker’S Skills\nNam is a Grade 9 student who recently completed a project about pottery-making traditions in Bat Trang. At first, Nam thought the project might be difficult because there was so much information to collect. However, things became easier after the student learnt to shape clay. An older community member offered useful advice and explained why the topic matters to local people. During the project, Nam received a small ceramic cup as a reminder of the experience. The student described the visit as skilled and was proud of completing the work. After returning to school, Nam prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"The history of modern smartphones","B":"An expensive shopping exp
