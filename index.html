dj: song ngữ, sử dụng được hai ngôn ngữ (đồng thời là tính từ)","He is a bilingual who speaks English and Vietnamese. / She attends a bilingual school.","Cậu ấy là người sử dụng được cả tiếng Anh và tiếng Việt. / Cô ấy học tại một trường song ngữ."],["bilingualism","/baɪˈlɪŋɡwəlɪzəm/","khả năng hoặc việc sử dụng hai ngôn ngữ","Bilingualism can create more opportunities for young people.","Khả năng sử dụng hai ngôn ngữ có thể tạo thêm cơ hội cho người trẻ."]],"adj":[],"adv":[]},"example":"He is a bilingual who speaks English and Vietnamese.","core":true},{"root":"propose","meaning":"Đề xuất","forms":{"v":[["propose","/prəˈpəʊz/","đề xuất","The teacher proposed a new learning method.","Giáo viên đề xuất một phương pháp học mới."]],"n":[["proposal","/prəˈpəʊzəl/","đề xuất, bản đề xuất","Her proposal was accepted by the school.","Đề xuất của cô ấy được nhà trường chấp nhận."]],"adj":[["proposed","/prəˈpəʊzd/","được đề xuất","The proposed course will focus on pronunciation.","Khóa học được đề xuất sẽ tập trung vào phát âm."]],"adv":[]},"example":"The teacher proposed a new learning method.","core":true},{"root":"borrow","meaning":"Mượn","forms":{"v":[["borrow","/ˈbɒrəʊ/","mượn, vay","English has borrowed many words from other languages.","Tiếng Anh đã mượn nhiều từ từ các ngôn ngữ khác."]],"n":[["borrowing","/ˈbɒrəʊɪŋ/","sự vay mượn","Linguistic borrowing happens when languages influence one another.","Việc vay mượn ngôn ngữ xảy ra khi các ngôn ngữ ảnh hưởng lẫn nhau."]],"adj":[["borrowed","/ˈbɒrəʊd/","được vay mượn","“Piano” is a borrowed word from Italian.","“Piano” là một từ mượn từ tiếng Ý."]],"adv":[]},"example":"English has borrowed many words from other languages.","core":true},{"root":"expand","meaning":"Mở rộng","forms":{"v":[["expand","/ɪkˈspænd/","mở rộng, phát triển","Reading English books can expand your vocabulary.","Đọc sách tiếng Anh có thể mở rộng vốn từ vựng."]],"n":[["expansion","/ɪkˈspænʃən/","sự mở rộng","The expansion of English has increased international communication.","Sự mở rộng của tiếng Anh đã làm gia tăng giao tiếp quốc tế."]],"adj":[["expanding","/ɪkˈspændɪŋ/","đang mở rộng","English is widely learned in countries in the Expanding Circle.","Tiếng Anh được học rộng rãi tại các nước thuộc Vòng tròn mở rộng."],["expansive","/ɪkˈspænsɪv/","rộng lớn, bao quát","The dictionary provides an expansive list of English expressions.","Từ điển cung cấp một danh sách các cách diễn đạt tiếng Anh rất phong phú."]],"adv":[]},"example":"Reading English books can expand your vocabulary.","core":true},{"root":"standard","meaning":"Tiêu chuẩn","forms":{"v":[["standardise","/ˈstændədaɪz/","tiêu chuẩn hóa","The examination board wants to standardise the test format.","Hội đồng khảo thí muốn tiêu chuẩn hóa định dạng bài thi."]],"n":[["standard","/ˈstændəd/","tiêu chuẩn, chuẩn mực | adj: tiêu chuẩn, chuẩn (đồng thời là tính từ)","This school has a high standard of English teaching. / Students learn standard spelling in class.","Trường này có tiêu chuẩn giảng dạy tiếng Anh cao. / Học sinh học cách viết chính tả chuẩn trên lớp."],["standardisation","/ˌstændədaɪˈzeɪʃən/","sự tiêu chuẩn hóa","Standardisation makes test results easier to compare.","Việc tiêu chuẩn hóa giúp so sánh kết quả kiểm tra dễ dàng hơn."]],"adj":[["standardised","/ˈstændədaɪzd/","được tiêu chuẩn hóa","Students will take a standardised English test.","Học sinh sẽ làm một bài kiểm tra tiếng Anh chuẩn hóa."]],"adv":[]},"example":"The examination board wants to standardise the test format.","core":true},{"root":"interpret","meaning":"Phiên dịch, giải thích","forms":{"v":[["interpret","/ɪnˈtɜːprɪt/","phiên dịch lời nói; giải thích","She can interpret between English and Vietnamese.","Cô ấy có thể phiên dịch giữa tiếng Anh và tiếng Việt."]],"n":[["interpretation","/ɪnˌtɜːprɪˈteɪʃən/","sự phiên dịch; cách giải thích","The speaker needed interpretation during the meeting.","Người phát biểu cần dịch nói trong cuộc họp."],["interpreter","/ɪnˈtɜːprɪtə/","phiên dịch viên","The interpreter translated the speaker's words into Vietnamese.","Phiên dịch viên dịch lời người phát biểu sang tiếng Việt."]],"adj":[],"adv":[]},"example":"She can interpret between English and Vietnamese.","core":true},{"root":"express","meaning":"Diễn đạt, bày tỏ","forms":{"v":[["express","/ɪkˈspres/","diễn đạt, bày tỏ","Students should learn to express their opinions clearly.","Học sinh nên học cách diễn đạt ý kiến rõ ràng."]],"n":[["expression","/ɪkˈspreʃən/","cách diễn đạt, sự bày tỏ","This expression is commonly used in British English.","Cách diễn đạt này thường được sử dụng trong tiếng Anh Anh."]],"adj":[["expressive","/ɪkˈspresɪv/","biểu cảm, giàu khả năng diễn đạt","She is an expressive speaker.","Cô ấy là một người nói rất biểu cảm."]],"adv":[["expressively","/ɪkˈspresɪvli/","một cách biểu cảm","The student read the story expressively.","Học sinh đọc câu chuyện một cách đầy biểu cảm."]]},"example":"Students should learn to express their opinions clearly.","core":true}];

const UNIT_GRAMMAR={"6":"<p>Mặc dù website có ba nhánh từ vựng, Unit 6 còn có một chủ điểm ngữ pháp cần học riêng: Verbs + to-infinitive / Verbs + V-ing.</p>\n<h2>A. Verbs + To-infinitive</h2>\n<p>Cấu trúc: S + V + to + V (nguyên mẫu)</p>\n<table>\n<thead>\n<tr>\n  <th>Verb</th>\n  <th>Nghĩa</th>\n  <th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>want</td>\n  <td>muốn</td>\n  <td>I want to learn about the past.</td>\n</tr>\n<tr>\n  <td>decide</td>\n  <td>quyết định</td>\n  <td>She decided to study abroad.</td>\n</tr>\n<tr>\n  <td>promise</td>\n  <td>hứa</td>\n  <td>He promised to help his parents.</td>\n</tr>\n<tr>\n  <td>agree</td>\n  <td>đồng ý</td>\n  <td>We agreed to join the activity.</td>\n</tr>\n<tr>\n  <td>plan</td>\n  <td>lên kế hoạch</td>\n  <td>They plan to visit their grandparents.</td>\n</tr>\n<tr>\n  <td>hope</td>\n  <td>hy vọng</td>\n  <td>I hope to become a teacher.</td>\n</tr>\n</tbody>\n</table>\n<h2>B. Verbs + V-ing</h2>\n<p>Cấu trúc: S + V + V-ing</p>\n<table>\n<thead>\n<tr>\n  <th>Verb</th>\n  <th>Nghĩa</th>\n  <th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>enjoy</td>\n  <td>yêu thích</td>\n  <td>I enjoy playing traditional games.</td>\n</tr>\n<tr>\n  <td>avoid</td>\n  <td>tránh</td>\n  <td>We avoid using phones during dinner.</td>\n</tr>\n<tr>\n  <td>finish</td>\n  <td>hoàn thành</td>\n  <td>She finished doing her homework.</td>\n</tr>\n<tr>\n  <td>mind</td>\n  <td>phiền, ngại</td>\n  <td>Do you mind opening the window?</td>\n</tr>\n<tr>\n  <td>suggest</td>\n  <td>đề nghị</td>\n  <td>He suggested visiting the museum.</td>\n</tr>\n<tr>\n  <td>fancy</td>\n  <td>thích, muốn</td>\n  <td>I fancy trying some traditional food.</td>\n</tr>\n</tbody>\n</table>\n<p>Chú ý: Sau decide dùng to V, còn sau avoid dùng V-ing.</p>\n<ul>\n<li>Đúng: She decided to study English.</li>\n<li>Sai: She decided studying English.</li>\n<li>Đúng: He avoids using his phone at night.</li>\n<li>Sai: He avoids to use his phone at night.</li>\n</ul>\n","7":"<h2>Reported Speech – Yes/No Questions</h2>\n<p>Câu hỏi Yes/No gián tiếp</p>\n<p>Cấu trúc thường dùng khi động từ tường thuật ở quá khứ:</p>\n<p>\\ S + asked + (O) + if/whether + S + V \\</p>\n<p>Khi chuyển câu hỏi trực tiếp thành câu gián tiếp, cần lưu ý trật tự câu trần thuật, đại từ, trạng từ thời gian và việc lùi thì khi phù hợp.</p>\n<table>\n<thead>\n<tr>\n  <th>Direct Question</th>\n  <th>Reported Question</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>“Is Ha Long Bay beautiful?”</td>\n  <td>He asked if Ha Long Bay was beautiful.</td>\n</tr>\n<tr>\n  <td>“Do you like natural wonders?”</td>\n  <td>She asked me whether I liked natural wonders.</td>\n</tr>\n<tr>\n  <td>“Have you visited this cave?”</td>\n  <td>He asked me if I had visited that cave.</td>\n</tr>\n<tr>\n  <td>“Can we enter the national park?”</td>\n  <td>They asked whether they could enter the national park.</td>\n</tr>\n<tr>\n  <td>“Did you climb the mountain?”</td>\n  <td>She asked me if I had climbed the mountain.</td>\n</tr>\n</tbody>\n</table>\n<h3>Ghi nhớ</h3>\n<ul>\n<li>If / whether: đều có thể dùng để giới thiệu câu hỏi Yes/No gián tiếp trong các cấu trúc trên.</li>\n<li>Không đảo trợ động từ: dùng if she liked, không dùng if did she like.</li>\n<li>Lùi thì khi cần: is → was; do/does + V → V2; have/has + V3 → had + V3; can → could.</li>\n<li>Thay đổi đại từ và từ chỉ thời gian/nơi chốn cho phù hợp với người kể và ngữ cảnh.</li>\n</ul>\n<p>Ví dụ lỗi thường gặp:</p>\n<p>Sai: He asked me if did I like the cave.</p>\n<p>Đúng: He asked me if I liked the cave.</p>\n","8":"<h2>Relative Pronouns: WHO – WHICH – WHOSE</h2>\n<p>Đại từ quan hệ là nội dung ngữ pháp trọng tâm Unit 8, được sử dụng để nối các mệnh đề và bổ sung thông tin về người, sự vật hoặc quan hệ sở hữu.</p>\n<table>\n<thead>\n<tr>\n  <th>Đại từ</th>\n  <th>Cách dùng</th>\n  <th>Ví dụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>WHO</td>\n  <td>Chỉ người</td>\n  <td>The woman who works here is a tour guide.</td>\n</tr>\n<tr>\n  <td>WHICH</td>\n  <td>Chỉ vật, sự việc</td>\n  <td>The hotel which we booked is near the beach.</td>\n</tr>\n<tr>\n  <td>WHOSE</td>\n  <td>Chỉ sự sở hữu</td>\n  <td>The tourist whose passport was lost asked for help.</td>\n</tr>\n</tbody>\n</table>\n<h3>1. WHO – Người mà</h3>\n<p>The man is a tour guide. He speaks English fluently.</p>\n<p>→ The man who speaks English fluently is a tour guide.</p>\n<p>(Người đàn ông nói tiếng Anh lưu loát là một hướng dẫn viên du lịch.)</p>\n<h3>2. WHICH – Cái mà</h3>\n<p>I booked a hotel. It is near the beach.</p>\n<p>→ The hotel which I booked is near the beach.</p>\n<p>(Khách sạn mà tôi đã đặt nằm gần bãi biển.)</p>\n<h3>3. WHOSE – Của người mà / có ... mà</h3>\n<p>The woman is my teacher. Her son is a tour guide.</p>\n<p>→ The woman whose son is a tour guide is my teacher.</p>\n<p>(Người phụ nữ có con trai là hướng dẫn viên du lịch chính là giáo viên của tôi.)</p>\n<h3>Bài tập luyện nhanh</h3>\n<p>Mini Test – 5 Questions</p>\n<p>Chọn một đáp án đúng</p>\n<p>1. The girl _____ works at this hotel speaks three languages.</p>\n<p>A. which</p>\n<p>B. who</p>\n<p>C. whose</p>\n<p>2. The travel app _____ I downloaded is very useful.</p>\n<p>A. which</p>\n<p>B. who</p>\n<p>C. whose</p>\n<p>3. The tourist _____ passport was missing contacted the police.</p>\n<p>A. whose</p>\n<p>B. which</p>\n<p>C. who</p>\n<p>4. The hotel _____ we stayed at was comfortable.</p>\n<p>A. whose</p>\n<p>B. who</p>\n<p>C. which</p>\n<p>5. The guide _____ helped us was very friendly.</p>\n<p>A. who</p>\n<p>B. which</p>\n<p>C. whose</p>\n<p>Chấm điểm</p>\n<p>Làm lại</p>\n","9":"<h2>DEFINING RELATIVE CLAUSES</h2>\n<p>Mệnh đề quan hệ xác định</p>\n<p>Unit 8 đã giới thiệu các đại từ quan hệ who, which, whose. Unit 9 phát triển kiến thức này bằng cách học cách dùng mệnh đề quan hệ xác định và quy tắc lược bỏ đại từ quan hệ khi đóng vai trò tân ngữ.</p>\n<h3>A. Đại từ quan hệ thường gặp</h3>\n<table>\n<thead>\n<tr>\n  <th>Đại từ</th>\n  <th>Cách dùng</th>\n  <th>Ví dụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>who</td>\n  <td>Thay cho người</td>\n  <td>The girl who speaks English is my friend.</td>\n</tr>\n<tr>\n  <td>which</td>\n  <td>Thay cho vật, sự việc</td>\n  <td>The book which is on the table is mine.</td>\n</tr>\n<tr>\n  <td>that</td>\n  <td>Thay cho người hoặc vật trong mệnh đề xác định</td>\n  <td>The word that I learnt is useful.</td>\n</tr>\n<tr>\n  <td>whose</td>\n  <td>Diễn đạt sở hữu</td>\n  <td>The student whose English is excellent won a prize.</td>\n</tr>\n<tr>\n  <td>whom</td>\n  <td>Thay cho người, làm tân ngữ; trang trọng</td>\n  <td>The teacher whom I admire is very kind.</td>\n</tr>\n</tbody>\n</table>\n<h3>B. Khi nào được lược bỏ đại từ quan hệ?</h3>\n<p>Trường hợp 1 – Đại từ quan hệ làm chủ ngữ: KHÔNG ĐƯỢC BỎ</p>\n<p>The student who speaks English fluently is my friend.</p>\n<p>Học sinh nói tiếng Anh trôi chảy là bạn của tôi.</p>\n<p>Không thể bỏ who vì nó làm chủ ngữ cho động từ speaks.</p>\n<p>Trường hợp 2 – Đại từ quan hệ làm tân ngữ: CÓ THỂ BỎ</p>\n<p>The word which I learnt yesterday is useful.</p>\n<p>→ The word I learnt yesterday is useful.</p>\n<p>Từ tôi học hôm qua rất hữu ích.</p>\n<p>Có thể bỏ which vì sau nó đã có chủ ngữ I và động từ learnt.</p>\n<h3>C. Bài tập viết lại câu mẫu</h3>\n<p>1. The boy is my classmate. He speaks three languages.</p>\n<p>→ The boy who speaks three languages is my classmate.</p>\n<p>2. The dictionary is very useful. I bought it yesterday.</p>\n<p>→ The dictionary which I bought yesterday is very useful.</p>\n<p>→ The dictionary I bought yesterday is very useful.</p>\n<p>3. The girl won the prize. Her pronunciation was excellent.</p>\n<p>→ The girl whose pronunciation was excellent won the prize.</p>\n<p>Ghi nhớ: Mệnh đề quan hệ xác định cung cấp thông tin thiết yếu để xác định người hoặc vật đang nói đến và thường không dùng dấu phẩy để ngăn cách mệnh đề này. Không được lược bỏ đại từ quan hệ khi nó làm chủ ngữ.</p>\n","10":"<h2>NON-DEFINING RELATIVE CLAUSES</h2>\n<p>Mệnh đề quan hệ không xác định</p>\n<p>Unit 9 học về mệnh đề quan hệ xác định. Unit 10 tiếp tục với mệnh đề quan hệ không xác định, dùng để bổ sung thông tin không thiết yếu về người hoặc vật đã được xác định.</p>\n<h3>A. Đại từ và trạng từ quan hệ thường gặp</h3>\n<table>\n<thead>\n<tr>\n  <th>Từ quan hệ</th>\n  <th>Cách dùng</th>\n  <th>Ví dụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>who</td>\n  <td>Bổ sung thông tin về người</td>\n  <td>Mr Brown, who teaches science, is very friendly.</td>\n</tr>\n<tr>\n  <td>which</td>\n  <td>Bổ sung thông tin về vật hoặc sự việc</td>\n  <td>Earth, which orbits the Sun, supports life.</td>\n</tr>\n<tr>\n  <td>whose</td>\n  <td>Diễn tả quan hệ sở hữu</td>\n  <td>Tom, whose father is a scientist, loves astronomy.</td>\n</tr>\n<tr>\n  <td>where</td>\n  <td>Bổ sung thông tin về nơi chốn</td>\n  <td>Cuc Phuong, where many rare animals live, is a national park.</td>\n</tr>\n</tbody>\n</table>\n<h3>B. Đặc điểm cần nhớ</h3>\n<p>1. Có dấu phẩy ngăn cách mệnh đề</p>\n<p>Earth, which is the third planet from the Sun, supports life.</p>\n<p>(Trái Đất, hành tinh thứ ba tính từ Mặt Trời, duy trì sự sống.)</p>\n<p>2. Có thể bỏ toàn bộ mệnh đề bổ sung mà câu vẫn đủ nghĩa chính</p>\n<p>Earth, which is the third planet from the Sun, supports life.</p>\n<p>→ Earth supports life.</p>\n<p>3. Không dùng THAT thay cho WHO hoặc WHICH trong mệnh đề quan hệ không xác định</p>\n<p>Sai: Ha Long Bay, that is in Viet Nam, is beautiful.</p>\n<p>Đúng: Ha Long Bay, which is in Viet Nam, is beautiful.</p>\n<p>4. Không được lược bỏ đại từ quan hệ</p>\n<p>Sai: My teacher, I met yesterday, is very kind.</p>\n<p>Đúng: My teacher, whom/who I met yesterday, is very kind.</p>\n<h3>C. So sánh Unit 9 và Unit 10</h3>\n<table>\n<thead>\n<tr>\n  <th>Unit 9 – Defining</th>\n  <th>Unit 10 – Non-defining</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Thông tin thiết yếu</td>\n  <td>Thông tin bổ sung</td>\n</tr>\n<tr>\n  <td>Không dùng dấu phẩy ngăn cách</td>\n  <td>Dùng dấu phẩy ngăn cách</td>\n</tr>\n<tr>\n  <td>Có thể dùng that</td>\n  <td>Không dùng that</td>\n</tr>\n<tr>\n  <td>Có thể bỏ đại từ quan hệ làm tân ngữ trong một số trường hợp</td>\n  <td>Không bỏ đại từ quan hệ</td>\n</tr>\n<tr>\n  <td>The students who study hard will pass the exam.</td>\n  <td>Lan, who studies hard, will pass the exam.</td>\n</tr>\n</tbody>\n</table>\n","11":"<h2>SUGGEST / ADVISE / RECOMMEND + V-ING OR A CLAUSE WITH SHOULD</h2>\n<p>Cấu trúc đưa ra lời đề nghị, lời khuyên hoặc sự khuyến nghị.</p>\n<p>Đây là nội dung ngữ pháp chính trong A Closer Look 2 của Unit 11.</p>\n<h2>A. Suggest – Đề nghị, gợi ý</h2>\n<p>Cấu trúc 1:</p>\n<p><code>S + suggest(s) + V-ing</code></p>\n<p>Ví dụ:</p>\n<p>I suggest buying a new computer.</p>\n<p>(Tôi đề nghị mua một chiếc máy tính mới.)</p>\n<p>Cấu trúc 2:</p>\n<p><code>S + suggest(s) + (that) + S + should + V</code></p>\n<p>Ví dụ:</p>\n<p>I suggest that you should buy a new computer.</p>\n<p>(Tôi đề nghị bạn nên mua một chiếc máy tính mới.)</p>\n<h2>B. Advise – Khuyên</h2>\n<p>Cấu trúc 1:</p>\n<p><code>S + advise(s) + V-ing</code></p>\n<p>Ví dụ:</p>\n<p>The technician advises updating the software.</p>\n<p>(Kỹ thuật viên khuyên cập nhật phần mềm.)</p>\n<p>Cấu trúc 2:</p>\n<p><code>S + advise(s) + (that) + S + should + V</code></p>\n<p>Ví dụ:</p>\n<p>The technician advises that we should update the software.</p>\n<p>(Kỹ thuật viên khuyên chúng tôi nên cập nhật phần mềm.)</p>\n<p>Cấu trúc thông dụng khác:</p>\n<p><code>S + advise + O + to + V</code></p>\n<p>Ví dụ:</p>\n<p>My teacher advised me to limit my screen time.</p>\n<p>(Giáo viên khuyên tôi hạn chế thời gian sử dụng màn hình.)</p>\n<h2>C. Recommend – Khuyến nghị</h2>\n<p>Cấu trúc 1:</p>\n<p><code>S + recommend(s) + V-ing</code></p>\n<p>Ví dụ:</p>\n<p>I recommend using a wireless mouse.</p>\n<p>(Tôi khuyên nên sử dụng chuột không dây.)</p>\n<p>Cấu trúc 2:</p>\n<p><code>S + recommend(s) + (that) + S + should + V</code></p>\n<p>Ví dụ:</p>\n<p>I recommend that you should use a wireless mouse.</p>\n<p>(Tôi khuyên bạn nên sử dụng chuột không dây.)</p>\n<h2>D. So sánh nhanh</h2>\n<table>\n<thead>\n<tr>\n  <th>Động từ</th>\n  <th>V-ing</th>\n  <th>Mệnh đề với should</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>suggest</td>\n  <td>suggest buying a laptop</td>\n  <td>suggest that you should buy a laptop</td>\n</tr>\n<tr>\n  <td>advise</td>\n  <td>advise checking the battery</td>\n  <td>advise that you should check the battery</td>\n</tr>\n<tr>\n  <td>recommend</td>\n  <td>recommend installing the app</td>\n  <td>recommend that you should install the app</td>\n</tr>\n</tbody>\n</table>\n<h3>E. Những lỗi ngữ pháp cần tránh</h3>\n<table>\n<thead>\n<tr>\n  <th>Sai</th>\n  <th>Đúng</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>I suggest to buy a tablet.</td>\n  <td>I suggest buying a tablet.</td>\n</tr>\n<tr>\n  <td>She suggested me to buy a laptop.</td>\n  <td>She suggested that I should buy a laptop.</td>\n</tr>\n<tr>\n  <td>He advises to turn off the phone.</td>\n  <td>He advises turning off the phone.</td>\n</tr>\n<tr>\n  <td>I recommend to use this app.</td>\n  <td>I recommend using this app.</td>\n</tr>\n<tr>\n  <td>My father advised me buying a computer.</td>\n  <td>My father advised me to buy a computer.</td>\n</tr>\n</tbody>\n</table>\n<p>Ghi nhớ: Sau suggest, advise, recommend, cấu trúc được học trong Unit 11 là V-ing hoặc mệnh đề với should. Riêng advise somebody to V cũng là một cấu trúc thông dụng và đúng ngữ pháp.</p>\n","12":"<h2>ADVERBIAL CLAUSES OF CONCESSION, RESULT AND REASON</h2>\n<p>Mệnh đề trạng ngữ chỉ sự nhượng bộ, kết quả và lý do.</p>\n<p>Đây là ba nội dung ngữ pháp chính của Unit 12, rất phù hợp để luyện viết lại câu, kết hợp câu và chọn đáp án đúng.</p>\n<h2>A. Clauses of Concession – Mệnh đề chỉ sự nhượng bộ</h2>\n<p>Cấu trúc:</p>\n<p><code>Although / Though / Even though + S + V, S + V.</code></p>\n<p>Nghĩa: Mặc dù ... nhưng ...</p>\n<table>\n<thead>\n<tr>\n  <th>Liên từ</th>\n  <th>Nghĩa</th>\n  <th>Example Sentence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>although</td>\n  <td>mặc dù</td>\n  <td>Although the job is demanding, she enjoys it. (Mặc dù công việc đòi hỏi cao, cô ấy vẫn yêu thích nó.)</td>\n</tr>\n<tr>\n  <td>though</td>\n  <td>mặc dù</td>\n  <td>Though he is young, he is very decisive. (Mặc dù còn trẻ, cậu ấy rất quyết đoán.)</td>\n</tr>\n<tr>\n  <td>even though</td>\n  <td>mặc dù, ngay cả khi</td>\n  <td>Even though the salary is low, she loves her job. (Mặc dù lương thấp, cô ấy vẫn yêu thích công việc.)</td>\n</tr>\n</tbody>\n</table>\n<p>Các cách diễn đạt liên quan:</p>\n<ul>\n<li>Despite + noun / V-ing</li>\n<li>In spite of + noun / V-ing</li>\n</ul>\n<p>Ví dụ:</p>\n<p>Although the job is difficult, he enjoys it.</p>\n<p>→ Despite being difficult, the job is enjoyable for him.</p>\n<p>(Mặc dù khó khăn, công việc vẫn mang lại niềm vui cho anh ấy.)</p>\n<p>Không sử dụng although và but để nối cùng một cặp mệnh đề theo kiểu này.</p>\n<p>Sai: Although the job is difficult, but he likes it.</p>\n<p>Đúng: Although the job is difficult, he likes it.</p>\n<h2>B. Clauses of Result – Mệnh đề chỉ kết quả</h2>\n<h3>1. SO ... THAT – Quá ... đến nỗi</h3>\n<p>Công thức:</p>\n<p><code>S + be + so + adjective + that + S + V</code></p>\n<p>Ví dụ:</p>\n<p>The job is so demanding that many people find it stressful.</p>\n<p>(Công việc đòi hỏi cao đến nỗi nhiều người thấy căng thẳng.)</p>\n<p>Với trạng từ:</p>\n<p><code>S + V + so + adverb + that + S + V</code></p>\n<p>She worked so hard that she got promoted.</p>\n<p>(Cô ấy làm việc chăm chỉ đến nỗi được thăng chức.)</p>\n<h3>2. SUCH ... THAT – Quá ... đến nỗi</h3>\n<p>Công thức:</p>\n<p><code>S + be + such + a/an + adjective + singular countable noun + that + S + V</code></p>\n<p>Ví dụ:</p>\n<p>It is such a rewarding job that many people want to do it.</p>\n<p>(Đó là một công việc ý nghĩa đến nỗi nhiều người muốn làm.)</p>\n<p>Với danh từ đếm được số nhiều hoặc danh từ không đếm được, không sử dụng a/an.</p>\n<p>They are such skilled workers that every company wants to hire them.</p>\n<p>(Họ là những công nhân lành nghề đến nỗi công ty nào cũng muốn tuyển dụng.)</p>\n<h3>3. So sánh SO và SUCH</h3>\n<table>\n<thead>\n<tr>\n  <th>SO ... THAT</th>\n  <th>SUCH ... THAT</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>so + adjective/adverb + that</td>\n  <td>such + (a/an) + adjective + noun + that</td>\n</tr>\n<tr>\n  <td>The work is so difficult that he needs help.</td>\n  <td>It is such difficult work that he needs help.</td>\n</tr>\n<tr>\n  <td>She is so talented that everyone admires her.</td>\n  <td>She is such a talented designer that everyone admires her.</td>\n</tr>\n</tbody>\n</table>\n<h2>C. Clauses of Reason – Mệnh đề chỉ lý do</h2>\n<p>Cấu trúc:</p>\n<p><code>Because / Since / As + S + V, S + V</code></p>\n<table>\n<thead>\n<tr>\n  <th>Liên từ</th>\n  <th>Nghĩa</th>\n  <th>Example Sentence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>because</td>\n  <td>bởi vì</td>\n  <td>I want to become a doctor because I enjoy helping people. (Tôi muốn trở thành bác sĩ vì thích giúp đỡ mọi người.)</td>\n</tr>\n<tr>\n  <td>since</td>\n  <td>vì, bởi vì</td>\n  <td>Since she is good at drawing, she wants to be a fashion designer. (Vì vẽ giỏi nên cô ấy muốn trở thành nhà thiết kế thời trang.)</td>\n</tr>\n<tr>\n  <td>as</td>\n  <td>vì, bởi vì</td>\n  <td>As he enjoys working with computers, he wants to become a software engineer. (Vì thích làm việc với máy tính, cậu ấy muốn trở thành kỹ sư phần mềm.)</td>\n</tr>\n</tbody>\n</table>\n<h3>Phân biệt Because và Because of</h3>\n<table>\n<thead>\n<tr>\n  <th>Because</th>\n  <th>Because of</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Because + S + V</td>\n  <td>Because of + noun / noun phrase / V-ing</td>\n</tr>\n<tr>\n  <td>He chose this job because he loves technology.</td>\n  <td>He chose this job because of his love for technology.</td>\n</tr>\n</tbody>\n</table>\n<p>Lỗi thường gặp:</p>\n<p>Sai: Because he was tired, so he stopped working.</p>\n<p>Đúng: Because he was tired, he stopped working.</p>\n<p>Hoặc: He was tired, so he stopped working.</p>\n<h2>D. Bài tập luyện nhanh – Unit 12</h2>\n<p>Mini Test – 5 câu</p>\n<p>Chọn đáp án đúng</p>\n<p>1. _____ the job is demanding, she finds it rewarding.</p>\n<p>A. Although</p>\n<p>B. Because of</p>\n<p>C. So</p>\n<p>2. He is _____ a skilled mechanic that many customers trust him.</p>\n<p>A. so</p>\n<p>B. such</p>\n<p>C. because</p>\n<p>3. The course was _____ useful that she recommended it to her friends.</p>\n<p>A. such</p>\n<p>B. although</p>\n<p>C. so</p>\n<p>4. She chose nursing _____ she wanted to help sick people.</p>\n<p>A. because</p>\n<p>B. despite</p>\n<p>C. such</p>\n<p>5. _____ having little experience, he performed the task well.</p>\n<p>A. Although</p>\n<p>B. Despite</p>\n<p>C. Because</p>\n<p>Chấm điểm</p>\n<p>Làm lại</p>\n"};

const SEM_TESTS=[{"test":1,"title":"TEST 01 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"cat","B":"map","C":"father","D":"hat"},"optionMarks":[{"word":"cat","marked":"a"},{"word":"map","marked":"a"},{"word":"father","marked":"a"},{"word":"hat","marked":"a"}],"answer":"C","explanation":"Phần gạch chân trong “father” đọc /ɑː/; trong ba từ cat, map, hat đều đọc /æ/. Vì vậy “father” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"good","B":"book","C":"foot","D":"food"},"optionMarks":[{"word":"good","marked":"oo"},{"word":"book","marked":"oo"},{"word":"foot","marked":"oo"},{"word":"food","marked":"oo"}],"answer":"D","explanation":"Phần gạch chân trong “food” đọc /uː/; trong ba từ good, book, foot đều đọc /ʊ/. Vì vậy “food” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"think","B":"those","C":"thank","D":"thin"},"optionMarks":[{"word":"think","marked":"th"},{"word":"those","marked":"th"},{"word":"thank","marked":"th"},{"word":"thin","marked":"th"}],"answer":"B","explanation":"Phần gạch chân trong “those” đọc /ð/; trong ba từ think, thank, thin đều đọc /θ/. Vì vậy “those” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"eight","B":"bright","C":"night","D":"right"},"optionMarks":[{"word":"eight","marked":"eigh"},{"word":"bright","marked":"igh"},{"word":"night","marked":"igh"},{"word":"right","marked":"igh"}],"answer":"A","explanation":"Phần gạch chân trong “eight” đọc /eɪ/; trong ba từ bright, night, right đều đọc /aɪ/. Vì vậy “eight” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"culture","B":"village","C":"preserve","D":"local"},"answer":"C","explanation":"“preserve” nhấn âm tiết thứ 2; culture, village, local đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"relax","B":"ancient","C":"become","D":"enjoy"},"answer":"B","explanation":"“ancient” nhấn âm tiết thứ 1; relax, become, enjoy đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"discover","B":"pottery","C":"improve","D":"remember"},"answer":"B","explanation":"“pottery” nhấn âm tiết thứ 1; discover, improve, remember đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"event","B":"return","C":"custom","D":"collect"},"answer":"C","explanation":"“custom” nhấn âm tiết thứ 1; event, return, collect đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"The streets were crowded after the festival.","options":{"A":"noisy","B":"busy","C":"lively","D":"empty"},"answer":"D","keyword":"crowded","explanation":"“crowded” nghĩa là đông đúc. “empty” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"The new bus service is affordable for students.","options":{"A":"reasonable","B":"cheap","C":"expensive","D":"inexpensive"},"answer":"C","keyword":"affordable","explanation":"“affordable” nghĩa là giá phải chăng. “expensive” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"Online booking is convenient for many travellers.","options":{"A":"inconvenient","B":"easy","C":"practical","D":"useful"},"answer":"A","keyword":"convenient","explanation":"“convenient” nghĩa là tiện lợi. “inconvenient” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"The city has a modern transport system.","options":{"A":"recent","B":"advanced","C":"old-fashioned","D":"updated"},"answer":"C","keyword":"modern","explanation":"“modern” nghĩa là hiện đại. “old-fashioned” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"The bustling streets were full of people.","options":{"A":"empty","B":"busy","C":"peaceful","D":"silent"},"answer":"B","keyword":"bustling","explanation":"“bustling” nghĩa là nhộn nhịp. “busy” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"The local restaurant serves affordable meals.","options":{"A":"pricey","B":"inexpensive","C":"luxurious","D":"costly"},"answer":"B","keyword":"affordable","explanation":"“affordable” nghĩa là giá phải chăng. “inexpensive” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"The town is proud of its cultural heritage.","options":{"A":"legacy","B":"weather","C":"traffic","D":"equipment"},"answer":"A","keyword":"heritage","explanation":"“heritage” nghĩa là di sản. “legacy” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"We visited an ancient citadel.","options":{"A":"modern","B":"new","C":"very old","D":"recent"},"answer":"C","keyword":"ancient","explanation":"“ancient” nghĩa là cổ xưa. “very old” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Minh does not know ______ to find the craft workshop.","options":{"A":"which","B":"how","C":"who","D":"what"},"answer":"B","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to the traditional craft fair.","options":{"A":"where","B":"when","C":"who","D":"why"},"answer":"C","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"looked up","B":"cut down","C":"passed down","D":"turned down"},"answer":"C","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Minh had to ______ an invitation to the club because of an exam.","options":{"A":"pass down","B":"get over","C":"find out","D":"turn down"},"answer":"D","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"the more confident","B":"more confident","C":"the confidence","D":"the most confident"},"answer":"A","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"the longest","B":"longer","C":"long","D":"the longer"},"answer":"D","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Minh feels anxious before the test, Minh ______ ask a teacher for advice.","options":{"A":"should","B":"would","C":"was","D":"did"},"answer":"A","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"could","B":"mustn't","C":"might","D":"should"},"answer":"B","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Minh ______ photos of the old town.","options":{"A":"is taking","B":"takes","C":"was taking","D":"has taken"},"answer":"C","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Bat Trang, it began to rain.","options":{"A":"were walking","B":"walk","C":"are walking","D":"have walked"},"answer":"A","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the pottery village.","options":{"A":"live","B":"will live","C":"have lived","D":"lived"},"answer":"D","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Minh ______ a traditional pottery workshop.","options":{"A":"has visited","B":"visited","C":"visits","D":"was visiting"},"answer":"A","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Bat Trang since 2019.","options":{"A":"lived","B":"were living","C":"have lived","D":"live"},"answer":"C","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"to learn","B":"learning","C":"learn","D":"learned"},"answer":"B","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ the traditional craft fair next month.","options":{"A":"organise","B":"organised","C":"organising","D":"to organise"},"answer":"D","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"A visitor: \"Could you tell me how to get to the craft workshop?\"  A resident: \"______\"","options":{"A":"That is my favourite subject.","B":"Yes, I have.","C":"Go straight ahead, then turn left.","D":"I bought it yesterday."},"answer":"C","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “Go straight ahead, then turn left.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"Minh: \"Would you mind helping me carry these books?\"  A friend: \"______\"","options":{"A":"No, not at all.","B":"I don't know where.","C":"Yes, I am tired.","D":"Thank you very much."},"answer":"A","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “No, not at all.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"Minh: \"I have won the school speaking competition!\"  A friend: \"______\"","options":{"A":"That is unfortunate.","B":"Never mind.","C":"I am sorry to hear that.","D":"Congratulations!"},"answer":"D","explanation":"Đây là thông báo tin vui. Câu đáp “Congratulations!” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"Minh: \"I feel stressed about tomorrow's exam.\"  A friend: \"______\"","options":{"A":"Please stay worried.","B":"Why not take a short break and revise calmly?","C":"You should stop sleeping.","D":"That is not your problem."},"answer":"B","explanation":"Đây là chia sẻ sự căng thẳng, cần lời khuyên. Câu đáp “Why not take a short break and revise calmly?” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) She did not know (B) how to finding(C)  the way (D) to the craft village.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) how to find”. Sau từ để hỏi dùng to + động từ nguyên mẫu, không dùng V-ing."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The students enjoy (B) to learn(C)  about local customs (D) at school.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) learning”. Sau enjoy dùng V-ing."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) She (B) was reading(C)  a book when the lights (D) go out suddenly last night.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) went out suddenly last night.”. Hành động xảy ra đột ngột trong quá khứ dùng quá khứ đơn: went out."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) While my mother (B) was cooking(C)  dinner, I (D) was watch television.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) was watching television.”. Hành động đang xảy ra trong quá khứ dùng was/were + V-ing."},{"number":40,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – GREEN SCHOOL DAY\nOur school is organising Green School Day next Friday. Students are encouraged to (40) _____ part and clean the playground and plant trees. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring gloves and help us cut down (42) _____ unnecessary waste.","options":{"A":"take","B":"get","C":"make","D":"do"},"answer":"A","explanation":"“take part in” = tham gia. Đây là cụm cố định; không nói make/get/do part in."},{"number":41,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – GREEN SCHOOL DAY\nOur school is organising Green School Day next Friday. Students are encouraged to (40) _____ part and clean the playground and plant trees. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring gloves and help us cut down (42) _____ unnecessary waste.","options":{"A":"joining","B":"to join","C":"joined","D":"join"},"answer":"B","explanation":"“want + to V” là cấu trúc đúng: want to join the event."},{"number":42,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"SCHOOL ANNOUNCEMENT – GREEN SCHOOL DAY\nOur school is organising Green School Day next Friday. Students are encouraged to (40) _____ part and clean the playground and plant trees. If you want (41) _____ the event, register with your class teacher by Wednesday. Please bring gloves and help us cut down (42) _____ unnecessary waste.","options":{"A":"on","B":"from","C":"of","D":"at"},"answer":"A","explanation":"“cut down on + noun” = cắt giảm điều gì. Giới từ bắt buộc là on."},{"number":43,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Traditional Craft Villages\nMany artisans in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. However, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"learn","B":"learning","C":"to learn","D":"learned"},"answer":"C","explanation":"Sau how diễn đạt cách học dùng cấu trúc “how + to V”: how to learn."},{"number":44,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Traditional Craft Villages\nMany artisans in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. However, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"give up","B":"take off","C":"turn down","D":"find"},"answer":"D","explanation":"“find information” = tìm kiếm thông tin từ nguồn đáng tin cậy. Các phrasal verbs khác không hợp ngữ cảnh."},{"number":45,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Traditional Craft Villages\nMany artisans in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. However, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"most knowledgeable","B":"knowledgeably","C":"more knowledgeable","D":"knowledge"},"answer":"C","explanation":"So sánh hai trạng thái mức độ hiểu biết: become + comparative adjective → more knowledgeable."},{"number":46,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Traditional Craft Villages\nMany artisans in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. However, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"have","B":"should","C":"were","D":"did"},"answer":"B","explanation":"Lời khuyên trong tình huống khó khăn dùng should + V: they should ask for advice."},{"number":47,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Traditional Craft Villages\nMany artisans in Viet Nam are learning to balance traditional values with modern life. At first, they may not know how (43) _____ new skills effectively. They often ask more experienced people for guidance. They also try to (44) _____ information from trustworthy sources rather than guessing. However, teamwork can make the process much easier. When people take part in community activities, they become (45) _____ about local culture. If the work is difficult, they (46) _____ ask for advice instead of giving up. In the end, everyone hopes to enjoy a (47) _____ experience and share it with others.","options":{"A":"freely","B":"valuable","C":"more","D":"quickly"},"answer":"B","explanation":"Trước danh từ “experience” cần tính từ bổ nghĩa: valuable experience = trải nghiệm quý giá."},{"number":48,"part":"PART 10 – READING TRUE / FALSE","stem":"The students went to Bat Trang to learn about pottery.   T ☐    F ☐","passage":"Bat Trang Craft Day\nLast Saturday, a group of Grade 9 students visited Bat Trang to learn about pottery. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their teacher, who explained the main ideas and gave practical examples. Each student received a small bowl to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Bài đọc xác nhận ngay câu mở đầu: Last Saturday, a group of Grade 9 students visited Bat Trang to learn about pottery. Before the activity, their teacher asked them to prepare a few qu. Vì vậy phát biểu này đúng."},{"number":49,"part":"PART 10 – READING TRUE / FALSE","stem":"The students received no preparation instructions from their teacher.   T ☐    F ☐","passage":"Bat Trang Craft Day\nLast Saturday, a group of Grade 9 students visited Bat Trang to learn about pottery. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their teacher, who explained the main ideas and gave practical examples. Each student received a small bowl to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Trong đoạn, giáo viên yêu cầu học sinh chuẩn bị câu hỏi và mang sổ ghi chép; vì vậy nói “không hướng dẫn chuẩn bị” là sai."},{"number":50,"part":"PART 10 – READING TRUE / FALSE","stem":"They met their teacher during the activity.   T ☐    F ☐","passage":"Bat Trang Craft Day\nLast Saturday, a group of Grade 9 students visited Bat Trang to learn about pottery. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their teacher, who explained the main ideas and gave practical examples. Each student received a small bowl to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Đoạn văn ghi rõ học sinh gặp giáo viên tại nơi diễn ra hoạt động; vì vậy phát biểu đúng."},{"number":51,"part":"PART 10 – READING TRUE / FALSE","stem":"The activity continued until after midnight.   T ☐    F ☐","passage":"Bat Trang Craft Day\nLast Saturday, a group of Grade 9 students visited Bat Trang to learn about pottery. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their teacher, who explained the main ideas and gave practical examples. Each student received a small bowl to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"Bat Trang Craft Day\nLast Saturday, a group of Grade 9 students visited Bat Trang to learn about pottery. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met their teacher, who explained the main ideas and gave practical examples. Each student received a small bowl to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"Old Town Memories\nMinh is a Grade 9 student who recently completed a project about the old lantern streets in Hoi An. At first, Minh thought the project might be difficult because there was so much information to collect. However, things became easier after the student walked with his grandfather. An older community member offered useful advice and explained why the topic matters to local people. During the project, Minh received a handmade lantern as a reminder of the experience. The student described the visit as fascinating and was proud of completing the work. After returning to school, Minh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Minh's project about the old lantern streets","B":"The history of modern smartphones","C":"An expensive shopping experience","D":"A guide to international airports"},"answer":"A","explanation":"Ý chính bao quát toàn đoạn là “Minh's project about the old lantern streets”, đúng với hoạt động được giới thiệu ở đầu bài và phát triển xuyên suốt đoạn. Các đáp án khác không phản ánh nội dung chính."},{"number":54,"part":"PART 11 – READING COMPREHENSION","stem":"Where did Minh carry out the project?","passage":"Old Town Memories\nMinh is a Grade 9 student who recently completed a project about the old lantern streets in Hoi An. At first, Minh thought the project might be difficult because there was so much information to collect. However, things became easier after the student walked with his grandfather. An older community member offered useful advice and explained why the topic matters to local people. During the project, Minh received a handmade lantern as a reminder of the experience. The student described the visit as fascinating and was proud of completing the work. After returning to school, Minh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"New York","B":"Sydney","C":"Hoi An","D":"London"},"answer":"C","explanation":"Địa điểm “Hoi An” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “fascinating” in the passage is CLOSEST in meaning to ______.","passage":"Old Town Memories\nMinh is a Grade 9 student who recently completed a project about the old lantern streets in Hoi An. At first, Minh thought the project might be difficult because there was so much information to collect. However, things became easier after the student walked with his grandfather. An older community member offered useful advice and explained why the topic matters to local people. During the project, Minh received a handmade lantern as a reminder of the experience. The student described the visit as fascinating and was proud of completing the work. After returning to school, Minh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"boring","B":"ordinary","C":"interesting","D":"unpleasant"},"answer":"C","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “interesting”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"Old Town Memories\nMinh is a Grade 9 student who recently completed a project about the old lantern streets in Hoi An. At first, Minh thought the project might be difficult because there was so much information to collect. However, things became easier after the student walked with his grandfather. An older community member offered useful advice and explained why the topic matters to local people. During the project, Minh received a handmade lantern as a reminder of the experience. The student described the visit as fascinating and was proud of completing the work. After returning to school, Minh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Minh","B":"the community member","C":"the teacher","D":"a classmate"},"answer":"A","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Minh” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"Old Town Memories\nMinh is a Grade 9 student who recently completed a project about the old lantern streets in Hoi An. At first, Minh thought the project might be difficult because there was so much information to collect. However, things became easier after the student walked with his grandfather. An older community member offered useful advice and explained why the topic matters to local people. During the project, Minh received a handmade lantern as a reminder of the experience. The student described the visit as fascinating and was proud of completing the work. After returning to school, Minh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Minh received a handmade lantern during the project.","B":"Minh kept the results secret and never presented them.","C":"Several classmates wanted to try a similar project.","D":"Minh gave a presentation at school."},"answer":"B","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"The craftsperson was highly ______ and made every item carefully. (SKILL)","answer":"skilled","explanation":"Từ gốc trong ngoặc phải biến đổi thành “skilled” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"Our trip to the old town was truly ______. (FORGET)","answer":"unforgettable","explanation":"Từ gốc trong ngoặc phải biến đổi thành “unforgettable” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"Students should take ______ for their learning. (RESPONSIBLE)","answer":"responsibility","explanation":"Từ gốc trong ngoặc phải biến đổi thành “responsibility” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"The local market is a major tourist ______. (ATTRACT)","answer":"attraction","explanation":"Từ gốc trong ngoặc phải biến đổi thành “attraction” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"Online learning offers greater ______ to many students. (FLEXIBLE)","answer":"flexibility","explanation":"Từ gốc trong ngoặc phải biến đổi thành “flexibility” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"I do not know how I can reach the traditional craft village. (HOW)","answer":"I do not know how to reach the traditional craft village.","explanation":"Đáp án mẫu: “I do not know how to reach the traditional craft village.” Rút gọn mệnh đề gián tiếp: wh-word + to-infinitive."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"The phone rang during my homework. (WHILE)","answer":"The phone rang while I was doing my homework.","explanation":"Đáp án mẫu: “The phone rang while I was doing my homework.” Đặt hành động đang diễn ra ở quá khứ tiếp diễn, kết hợp when/while phù hợp."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"I cannot speak English fluently now. (WISH)","answer":"I wish I could speak English fluently now.","explanation":"Đáp án mẫu: “I wish I could speak English fluently now.” Wish ở hiện tại: S + wish(es) + S + past simple / could + V."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"They made a plan to visit the museum. (PLANNED)","answer":"They planned to visit the museum.","explanation":"Đáp án mẫu: “They planned to visit the museum.” Các động từ như plan, decide, want đi với to-infinitive."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"At 8 p.m. / last night / my grandmother / tell / stories / while / we / listen.","answer":"At 8 p.m. last night, my grandmother was telling stories while we were listening.","explanation":"Câu hoàn chỉnh: “At 8 p.m. last night, my grandmother was telling stories while we were listening.” Hai hành động đồng thời trong quá khứ dùng while + past continuous; chú ý was/were + V-ing."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"the / crowded / the city / be / the / difficult / travelling / become.","answer":"The more crowded the city is, the more difficult travelling becomes.","explanation":"Câu hoàn chỉnh: “The more crowded the city is, the more difficult travelling becomes.” So sánh kép dùng The + so sánh hơn ở cả hai vế."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"While / Minh / take / photos / Lan / interview / a craft worker.","answer":"While Minh was taking photos, Lan was interviewing a craft worker.","explanation":"Câu hoàn chỉnh: “While Minh was taking photos, Lan was interviewing a craft worker.” Hai hành động đồng thời trong quá khứ dùng while + past continuous; chú ý was/were + V-ing."}]},{"test":2,"title":"TEST 02 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"children","B":"church","C":"chemical","D":"chair"},"optionMarks":[{"word":"children","marked":"ch"},{"word":"church","marked":"ch"},{"word":"chemical","marked":"ch"},{"word":"chair","marked":"ch"}],"answer":"C","explanation":"Phần gạch chân trong “chemical” đọc /k/; trong ba từ children, church, chair đều đọc /tʃ/. Vì vậy “chemical” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"meat","B":"seat","C":"heat","D":"break"},"optionMarks":[{"word":"meat","marked":"ea"},{"word":"seat","marked":"ea"},{"word":"heat","marked":"ea"},{"word":"break","marked":"ea"}],"answer":"D","explanation":"Phần gạch chân trong “break” đọc /eɪ/; trong ba từ meat, seat, heat đều đọc /iː/. Vì vậy “break” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"shown","B":"town","C":"brown","D":"down"},"optionMarks":[{"word":"shown","marked":"ow"},{"word":"town","marked":"ow"},{"word":"brown","marked":"ow"},{"word":"down","marked":"ow"}],"answer":"A","explanation":"Phần gạch chân trong “shown” đọc /əʊ/; trong ba từ town, brown, down đều đọc /aʊ/. Vì vậy “shown” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"classes","B":"shops","C":"buses","D":"watches"},"optionMarks":[{"word":"classes","marked":"es"},{"word":"shops","marked":"s"},{"word":"buses","marked":"es"},{"word":"watches","marked":"es"}],"answer":"B","explanation":"Phần gạch chân trong “shops” đọc /s/; trong ba từ classes, buses, watches đều đọc /ɪz/. Vì vậy “shops” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"preserve","B":"develop","C":"attract","D":"local"},"answer":"D","explanation":"“local” nhấn âm tiết thứ 1; preserve, develop, attract đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"amazing","B":"market","C":"village","D":"travel"},"answer":"A","explanation":"“amazing” nhấn âm tiết thứ 2; market, village, travel đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"heritage","B":"exciting","C":"traditional","D":"polluted"},"answer":"A","explanation":"“heritage” nhấn âm tiết thứ 1; exciting, traditional, polluted đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"relaxed","B":"helpful","C":"surprised","D":"amazed"},"answer":"B","explanation":"“helpful” nhấn âm tiết thứ 1; relaxed, surprised, amazed đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"The local residents were generous with their time.","options":{"A":"kind","B":"helpful","C":"selfish","D":"giving"},"answer":"C","keyword":"generous","explanation":"“generous” nghĩa là hào phóng. “selfish” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"Lan felt confident before the speaking competition.","options":{"A":"brave","B":"sure","C":"relaxed","D":"insecure"},"answer":"D","keyword":"confident","explanation":"“confident” nghĩa là tự tin. “insecure” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"There are frequent buses between the two towns.","options":{"A":"common","B":"rare","C":"repeated","D":"regular"},"answer":"B","keyword":"frequent","explanation":"“frequent” nghĩa là thường xuyên. “rare” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"They found a temporary solution to the problem.","options":{"A":"brief","B":"permanent","C":"limited","D":"short-term"},"answer":"B","keyword":"temporary","explanation":"“temporary” nghĩa là tạm thời. “permanent” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"The skilled artisans made beautiful pottery.","options":{"A":"untrained","B":"inexperienced","C":"careless","D":"talented"},"answer":"D","keyword":"skilled","explanation":"“skilled” nghĩa là lành nghề. “talented” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"The new bus route is convenient for commuters.","options":{"A":"practical","B":"difficult","C":"expensive","D":"confusing"},"answer":"A","keyword":"convenient","explanation":"“convenient” nghĩa là tiện lợi. “practical” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"After yoga, Hoa felt relaxed.","options":{"A":"calm","B":"angry","C":"frightened","D":"nervous"},"answer":"A","keyword":"relaxed","explanation":"“relaxed” nghĩa là thư giãn. “calm” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"Families prepared traditional dishes for Tet.","options":{"A":"customary","B":"unusual","C":"imported","D":"modern"},"answer":"A","keyword":"traditional","explanation":"“traditional” nghĩa là truyền thống. “customary” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Lan does not know ______ to find the community centre.","options":{"A":"how","B":"which","C":"who","D":"what"},"answer":"A","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to a historic walking tour.","options":{"A":"why","B":"who","C":"where","D":"when"},"answer":"B","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"looked up","B":"turned down","C":"passed down","D":"cut down"},"answer":"C","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Lan had to ______ an invitation to the club because of an exam.","options":{"A":"turn down","B":"get over","C":"find out","D":"pass down"},"answer":"A","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"the more confident","B":"the most confident","C":"the confidence","D":"more confident"},"answer":"A","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"the longer","B":"the longest","C":"longer","D":"long"},"answer":"A","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Lan feels anxious before the test, Lan ______ ask a teacher for advice.","options":{"A":"was","B":"should","C":"would","D":"did"},"answer":"B","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"mustn't","B":"could","C":"might","D":"should"},"answer":"A","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Lan ______ photos of the old town.","options":{"A":"takes","B":"has taken","C":"was taking","D":"is taking"},"answer":"C","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Hoi An, it began to rain.","options":{"A":"walk","B":"are walking","C":"have walked","D":"were walking"},"answer":"D","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the bus station.","options":{"A":"lived","B":"will live","C":"live","D":"have lived"},"answer":"A","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Lan ______ a traditional pottery workshop.","options":{"A":"visits","B":"has visited","C":"was visiting","D":"visited"},"answer":"B","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Hoi An since 2019.","options":{"A":"live","B":"have lived","C":"lived","D":"were living"},"answer":"B","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"learning","B":"learn","C":"learned","D":"to learn"},"answer":"A","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ a historic walking tour next month.","options":{"A":"to organise","B":"organise","C":"organising","D":"organised"},"answer":"A","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"Lan: \"I have won the school speaking competition!\"  A friend: \"______\"","options":{"A":"That is unfortunate.","B":"I am sorry to hear that.","C":"Never mind.","D":"Congratulations!"},"answer":"D","explanation":"Đây là thông báo tin vui. Câu đáp “Congratulations!” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"Lan: \"I feel stressed about tomorrow's exam.\"  A friend: \"______\"","options":{"A":"You should stop sleeping.","B":"That is not your problem.","C":"Why not take a short break and revise calmly?","D":"Please stay worried."},"answer":"C","explanation":"Đây là chia sẻ sự căng thẳng, cần lời khuyên. Câu đáp “Why not take a short break and revise calmly?” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"Lan: \"Thank you for showing us around the old town.\"  A guide: \"______\"","options":{"A":"You are welcome.","B":"That is a pity.","C":"How exciting!","D":"Yes, please."},"answer":"A","explanation":"Đây là lời cảm ơn. Câu đáp “You are welcome.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"A student: \"I am sorry I was late for the heritage tour.\"  Teacher: \"______\"","options":{"A":"Please try to be on time next time.","B":"Congratulations!","C":"You must buy it.","D":"Nice to meet you."},"answer":"A","explanation":"Đây là lời xin lỗi. Câu đáp “Please try to be on time next time.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) While my mother (B) was cooking(C)  dinner, I (D) was watch television.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) was watching television.”. Hành động đang xảy ra trong quá khứ dùng was/were + V-ing."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) This is the first time (B) we visit(C)  a pottery workshop (D) in Ha Noi.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) we have visited”. Xét cấu trúc câu, dạng động từ và dấu hiệu thời gian để sửa lỗi."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The more you practise, (B) the confident(C)  you will (D) become.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) the more confident”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) My brother decided (B) joining(C)  the volunteer club (D) last week.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) to join”. Sau decide dùng to-infinitive: decide to + V."},{"number":40,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"JOIN LOCAL CRAFT FAIR!\nAll Grade 9 students are invited to take part in our special event. We are looking (40) _____ volunteers who can display handmade baskets and pottery. Participants should remember (41) _____ a reusable bag with them. The event will be (42) _____ by teachers and student leaders so that everyone stays safe.","options":{"A":"to","B":"at","C":"of","D":"for"},"answer":"D","explanation":"“take part in” = tham gia. Đây là cụm cố định; không nói make/get/do part in."},{"number":41,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"JOIN LOCAL CRAFT FAIR!\nAll Grade 9 students are invited to take part in our special event. We are looking (40) _____ volunteers who can display handmade baskets and pottery. Participants should remember (41) _____ a reusable bag with them. The event will be (42) _____ by teachers and student leaders so that everyone stays safe.","options":{"A":"bring","B":"brought","C":"bringing","D":"to bring"},"answer":"D","explanation":"“want + to V” là cấu trúc đúng: want to join the event."},{"number":42,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"JOIN LOCAL CRAFT FAIR!\nAll Grade 9 students are invited to take part in our special event. We are looking (40) _____ volunteers who can display handmade baskets and pottery. Participants should remember (41) _____ a reusable bag with them. The event will be (42) _____ by teachers and student leaders so that everyone stays safe.","options":{"A":"organising","B":"organise","C":"organised","D":"organisation"},"answer":"C","explanation":"“cut down on + noun” = cắt giảm điều gì. Giới từ bắt buộc là on."},{"number":43,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Busy City Morning\nMany commuters in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. The more we listened, the (46) _____ we understood the local community. We have kept in touch with community members (47) _____ last week, and many classmates have asked to join the next project.","options":{"A":"organised","B":"organise","C":"to organise","D":"organising"},"answer":"C","explanation":"Sau how diễn đạt cách học dùng cấu trúc “how + to V”: how to learn."},{"number":44,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Busy City Morning\nMany commuters in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. The more we listened, the (46) _____ we understood the local community. We have kept in touch with community members (47) _____ last week, and many classmates have asked to join the next project.","options":{"A":"take","B":"were taking","C":"have taken","D":"will take"},"answer":"B","explanation":"“find information” = tìm kiếm thông tin từ nguồn đáng tin cậy. Các phrasal verbs khác không hợp ngữ cảnh."},{"number":45,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Busy City Morning\nMany commuters in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. The more we listened, the (46) _____ we understood the local community. We have kept in touch with community members (47) _____ last week, and many classmates have asked to join the next project.","options":{"A":"practise","B":"practised","C":"practises","D":"practising"},"answer":"B","explanation":"So sánh hai trạng thái mức độ hiểu biết: become + comparative adjective → more knowledgeable."},{"number":46,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Busy City Morning\nMany commuters in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. The more we listened, the (46) _____ we understood the local community. We have kept in touch with community members (47) _____ last week, and many classmates have asked to join the next project.","options":{"A":"good","B":"best","C":"better","D":"well"},"answer":"C","explanation":"Lời khuyên trong tình huống khó khăn dùng should + V: they should ask for advice."},{"number":47,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"A Busy City Morning\nMany commuters in Viet Nam are learning to balance traditional values with modern life. Last month, our class decided (43) _____ a local project about community life. We talked to residents and collected useful information. While we (44) _____ photographs of the area, an older resident explained how things had changed. We were surprised because some old customs are still (45) _____ today. The more we listened, the (46) _____ we understood the local community. We have kept in touch with community members (47) _____ last week, and many classmates have asked to join the next project.","options":{"A":"from","B":"during","C":"s
