iới thiệu ở đầu bài và phát triển xuyên suốt đoạn. Các đáp án khác không phản ánh nội dung chính."},{"number":54,"part":"PART 11 – READING COMPREHENSION","stem":"Where did Khanh carry out the project?","passage":"Remembering Village Childhood\nKhanh is a Grade 9 student who recently completed a project about family life in the past in Ben Tre. At first, Khanh thought the project might be difficult because there was so much information to collect. However, things became easier after the student talked to his grandfather. An older community member offered useful advice and explained why the topic matters to local people. During the project, Khanh received a recording of old stories as a reminder of the experience. The student described the visit as valuable and was proud of completing the work. After returning to school, Khanh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"New York","B":"Sydney","C":"London","D":"Ben Tre"},"answer":"D","explanation":"Địa điểm “Ben Tre” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “valuable” in the passage is CLOSEST in meaning to ______.","passage":"Remembering Village Childhood\nKhanh is a Grade 9 student who recently completed a project about family life in the past in Ben Tre. At first, Khanh thought the project might be difficult because there was so much information to collect. However, things became easier after the student talked to his grandfather. An older community member offered useful advice and explained why the topic matters to local people. During the project, Khanh received a recording of old stories as a reminder of the experience. The student described the visit as valuable and was proud of completing the work. After returning to school, Khanh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"precious","B":"ordinary","C":"unpleasant","D":"boring"},"answer":"A","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “precious”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"Remembering Village Childhood\nKhanh is a Grade 9 student who recently completed a project about family life in the past in Ben Tre. At first, Khanh thought the project might be difficult because there was so much information to collect. However, things became easier after the student talked to his grandfather. An older community member offered useful advice and explained why the topic matters to local people. During the project, Khanh received a recording of old stories as a reminder of the experience. The student described the visit as valuable and was proud of completing the work. After returning to school, Khanh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"the community member","B":"Khanh","C":"a classmate","D":"the teacher"},"answer":"B","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Khanh” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"Remembering Village Childhood\nKhanh is a Grade 9 student who recently completed a project about family life in the past in Ben Tre. At first, Khanh thought the project might be difficult because there was so much information to collect. However, things became easier after the student talked to his grandfather. An older community member offered useful advice and explained why the topic matters to local people. During the project, Khanh received a recording of old stories as a reminder of the experience. The student described the visit as valuable and was proud of completing the work. After returning to school, Khanh prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Several classmates wanted to try a similar project.","B":"Khanh received a recording of old stories during the project.","C":"Khanh kept the results secret and never presented them.","D":"Khanh gave a presentation at school."},"answer":"C","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"City traffic can be very ______ during rush hour. (NOISE)","answer":"noisy","explanation":"Từ gốc trong ngoặc phải biến đổi thành “noisy” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"We were surprised by the ______ of the local people. (FRIEND)","answer":"friendliness","explanation":"Từ gốc trong ngoặc phải biến đổi thành “friendliness” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"The government is working to improve road ______. (SAFE)","answer":"safety","explanation":"Từ gốc trong ngoặc phải biến đổi thành “safety” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"The craftsperson was highly ______ and made every item carefully. (SKILL)","answer":"skilled","explanation":"Từ gốc trong ngoặc phải biến đổi thành “skilled” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"Our trip to the old town was truly ______. (FORGET)","answer":"unforgettable","explanation":"Từ gốc trong ngoặc phải biến đổi thành “unforgettable” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"We began working on this project two months ago. (FOR)","answer":"We have worked on this project for two months.","explanation":"Đáp án mẫu: “We have worked on this project for two months.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"If you exercise more, you will become healthier. (THE)","answer":"The more you exercise, the healthier you will become.","explanation":"Đáp án mẫu: “The more you exercise, the healthier you will become.” So sánh kép: The + comparative..., the + comparative..."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"I do not have enough time to visit the museum. (WISH)","answer":"I wish I had enough time to visit the museum.","explanation":"Đáp án mẫu: “I wish I had enough time to visit the museum.” Wish ở hiện tại: S + wish(es) + S + past simple / could + V."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"She chose to join the art club. (DECIDED)","answer":"She decided to join the art club.","explanation":"Đáp án mẫu: “She decided to join the art club.” Các động từ như plan, decide, want đi với to-infinitive."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"If / you / want / reduce / stress / you / should / sleep / enough.","answer":"If you want to reduce stress, you should sleep enough.","explanation":"Câu hoàn chỉnh: “If you want to reduce stress, you should sleep enough.” Câu điều kiện loại 1: If + hiện tại đơn, S + modal/will + V."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"She / wish / she / have / more time / for exercise.","answer":"She wishes she had more time for exercise.","explanation":"Câu hoàn chỉnh: “She wishes she had more time for exercise.” Hiện tại hoàn thành đi với since (mốc) hoặc for (khoảng thời gian)."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"Last month / the students / decide / visit / a pottery village.","answer":"Last month, the students decided to visit a pottery village.","explanation":"Câu hoàn chỉnh: “Last month, the students decided to visit a pottery village.” So sánh kép dùng The + so sánh hơn ở cả hai vế."}]},{"test":15,"title":"TEST 15 – UNITS 1–6","questions":[{"number":1,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"dead","B":"head","C":"meat","D":"bread"},"optionMarks":[{"word":"dead","marked":"ea"},{"word":"head","marked":"ea"},{"word":"meat","marked":"ea"},{"word":"bread","marked":"ea"}],"answer":"C","explanation":"Phần gạch chân trong “meat” đọc /iː/; trong ba từ dead, head, bread đều đọc /e/. Vì vậy “meat” khác cách phát âm."},{"number":2,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"children","B":"chemical","C":"chair","D":"church"},"optionMarks":[{"word":"children","marked":"ch"},{"word":"chemical","marked":"ch"},{"word":"chair","marked":"ch"},{"word":"church","marked":"ch"}],"answer":"B","explanation":"Phần gạch chân trong “chemical” đọc /k/; trong ba từ children, chair, church đều đọc /tʃ/. Vì vậy “chemical” khác cách phát âm."},{"number":3,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"break","B":"meat","C":"seat","D":"heat"},"optionMarks":[{"word":"break","marked":"ea"},{"word":"meat","marked":"ea"},{"word":"seat","marked":"ea"},{"word":"heat","marked":"ea"}],"answer":"A","explanation":"Phần gạch chân trong “break” đọc /eɪ/; trong ba từ meat, seat, heat đều đọc /iː/. Vì vậy “break” khác cách phát âm."},{"number":4,"part":"PART 1 – DIFFERENT PRONUNCIATION","stem":"Choose the odd pronunciation.","options":{"A":"shown","B":"town","C":"down","D":"brown"},"optionMarks":[{"word":"shown","marked":"ow"},{"word":"town","marked":"ow"},{"word":"down","marked":"ow"},{"word":"brown","marked":"ow"}],"answer":"A","explanation":"Phần gạch chân trong “shown” đọc /əʊ/; trong ba từ town, down, brown đều đọc /aʊ/. Vì vậy “shown” khác cách phát âm."},{"number":5,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"protect","B":"advice","C":"support","D":"mountain"},"answer":"D","explanation":"“mountain” nhấn âm tiết thứ 1; protect, advice, support đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":6,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"fortunate","B":"wonderful","C":"festival","D":"experience"},"answer":"D","explanation":"“experience” nhấn âm tiết thứ 2; fortunate, wonderful, festival đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":7,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"famous","B":"colourful","C":"peaceful","D":"remember"},"answer":"D","explanation":"“remember” nhấn âm tiết thứ 2; famous, colourful, peaceful đều nhấn âm tiết thứ 1. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":8,"part":"PART 2 – WORD STRESS","stem":"Choose the word with different primary stress.","options":{"A":"traditional","B":"important","C":"garden","D":"historical"},"answer":"C","explanation":"“garden” nhấn âm tiết thứ 1; traditional, important, historical đều nhấn âm tiết thứ 2. Chú ý trọng âm chính, không đếm số âm tiết đơn thuần."},{"number":9,"part":"PART 3 – ANTONYM","stem":"The new cycle lane is safe for children.","options":{"A":"secure","B":"dangerous","C":"protected","D":"harmless"},"answer":"B","keyword":"safe","explanation":"“safe” nghĩa là an toàn. “dangerous” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":10,"part":"PART 3 – ANTONYM","stem":"The student felt anxious before his exams.","options":{"A":"nervous","B":"uneasy","C":"worried","D":"calm"},"answer":"D","keyword":"anxious","explanation":"“anxious” nghĩa là lo lắng. “calm” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":11,"part":"PART 3 – ANTONYM","stem":"The family kept its valuable photographs.","options":{"A":"worthless","B":"important","C":"meaningful","D":"precious"},"answer":"A","keyword":"valuable","explanation":"“valuable” nghĩa là có giá trị. “worthless” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":12,"part":"PART 3 – ANTONYM","stem":"The guide gave us reliable information.","options":{"A":"accurate","B":"trustworthy","C":"dependable","D":"unreliable"},"answer":"D","keyword":"reliable","explanation":"“reliable” nghĩa là đáng tin cậy. “unreliable” là lựa chọn ngược nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại gần nghĩa hoặc không đối lập với từ được hỏi."},{"number":13,"part":"PART 4 – SYNONYM","stem":"The guide told us a fascinating story.","options":{"A":"boring","B":"interesting","C":"ordinary","D":"unpleasant"},"answer":"B","keyword":"fascinating","explanation":"“fascinating” nghĩa là hấp dẫn. “interesting” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":14,"part":"PART 4 – SYNONYM","stem":"Teachers should support stressed students.","options":{"A":"ignore","B":"punish","C":"help","D":"blame"},"answer":"C","keyword":"support","explanation":"“support” nghĩa là hỗ trợ. “help” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":15,"part":"PART 4 – SYNONYM","stem":"The tour was a memorable experience.","options":{"A":"unforgettable","B":"common","C":"ordinary","D":"dull"},"answer":"A","keyword":"memorable","explanation":"“memorable” nghĩa là đáng nhớ. “unforgettable” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":16,"part":"PART 4 – SYNONYM","stem":"The night market is very lively.","options":{"A":"energetic","B":"dull","C":"quiet","D":"silent"},"answer":"A","keyword":"lively","explanation":"“lively” nghĩa là sôi động. “energetic” là lựa chọn gần nghĩa phù hợp trong ngữ cảnh câu. Các lựa chọn còn lại không diễn đạt cùng nghĩa trong ngữ cảnh này."},{"number":17,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Vy does not know ______ to find the town hall.","options":{"A":"which","B":"what","C":"who","D":"how"},"answer":"D","explanation":"Đúng là “how”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":18,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"We haven't decided ______ to invite to a cultural exchange.","options":{"A":"why","B":"where","C":"when","D":"who"},"answer":"D","explanation":"Đúng là “who”: từ để hỏi + to-infinitive (wh-word + to V). Dựa vào ý nghĩa cần diễn đạt: cách làm (how), người (who), địa điểm (where), thời điểm (when)."},{"number":19,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The artisans have ______ their skills to younger generations.","options":{"A":"turned down","B":"looked up","C":"passed down","D":"cut down"},"answer":"C","explanation":"“passed down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":20,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Vy had to ______ an invitation to the club because of an exam.","options":{"A":"pass down","B":"turn down","C":"get over","D":"find out"},"answer":"B","explanation":"“turn down” là phrasal verb hợp nghĩa với toàn câu. Cần học cả cụm và tân ngữ đi kèm, không thể chọn dựa trên nghĩa của động từ riêng lẻ."},{"number":21,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The more you practise English, ______ you become.","options":{"A":"the most confident","B":"more confident","C":"the more confident","D":"the confidence"},"answer":"C","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the more confident” (có “the” và tính từ/trạng từ so sánh)."},{"number":22,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The busier the roads are, ______ it takes to travel.","options":{"A":"the longer","B":"the longest","C":"longer","D":"long"},"answer":"A","explanation":"Áp dụng so sánh kép: The + comparative..., the + comparative... Ở vế sau phải dùng “the longer” (có “the” và tính từ/trạng từ so sánh)."},{"number":23,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If Vy feels anxious before the test, Vy ______ ask a teacher for advice.","options":{"A":"should","B":"was","C":"did","D":"would"},"answer":"A","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “should” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":24,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"If you want to protect the local heritage, you ______ throw rubbish near the monuments.","options":{"A":"could","B":"mustn't","C":"might","D":"should"},"answer":"B","explanation":"Câu điều kiện loại 1 đưa lời khuyên/quy định: If + hiện tại đơn, S + modal verb + động từ nguyên mẫu. “mustn't” thể hiện đúng mức độ khuyên nhủ, cho phép hoặc cấm."},{"number":25,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"At 7 p.m. yesterday, Vy ______ photos of the old town.","options":{"A":"takes","B":"is taking","C":"has taken","D":"was taking"},"answer":"D","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “was taking” phù hợp chủ ngữ và mốc thời gian."},{"number":26,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"While we ______ around Ha Noi, it began to rain.","options":{"A":"walk","B":"were walking","C":"have walked","D":"are walking"},"answer":"B","explanation":"Dấu hiệu quá khứ đang diễn ra (while / at ... yesterday) ⇒ quá khứ tiếp diễn was/were + V-ing. Dạng “were walking” phù hợp chủ ngữ và mốc thời gian."},{"number":27,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"I wish I ______ closer to the public library.","options":{"A":"lived","B":"live","C":"have lived","D":"will live"},"answer":"A","explanation":"Ước trái với hiện tại dùng S + wish(es) + S + past simple; “lived” thể hiện tình huống không như mong muốn ở hiện tại."},{"number":28,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"This is the first time Vy ______ a traditional pottery workshop.","options":{"A":"visits","B":"has visited","C":"was visiting","D":"visited"},"answer":"B","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “has visited” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":29,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"My grandparents ______ in Ha Noi since 2019.","options":{"A":"were living","B":"live","C":"have lived","D":"lived"},"answer":"C","explanation":"Hiện tại hoàn thành: have/has + past participle. Cụm “have lived” phù hợp dấu hiệu since, for, so far hoặc this is the first time."},{"number":30,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"The students enjoy ______ about old Vietnamese customs.","options":{"A":"learning","B":"learn","C":"learned","D":"to learn"},"answer":"A","explanation":"Sau enjoy dùng động từ thêm -ing: enjoy + V-ing. Vì vậy chọn “learning”."},{"number":31,"part":"PART 5 – VOCABULARY & GRAMMAR","stem":"Our class plans ______ a cultural exchange next month.","options":{"A":"organising","B":"to organise","C":"organise","D":"organised"},"answer":"B","explanation":"Sau plan dùng to-infinitive: plan + to V. Vì vậy chọn “to organise”."},{"number":32,"part":"PART 6 – COMMUNICATION","stem":"Vy: \"Could I use your dictionary for a moment?\"  A friend: \"______\"","options":{"A":"Of course. Here you are.","B":"No, I am afraid of it.","C":"Yes, I used it yesterday.","D":"I have no idea where."},"answer":"A","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “Of course. Here you are.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":33,"part":"PART 6 – COMMUNICATION","stem":"Vy: \"How about visiting the local museum this Sunday?\"  A friend: \"______\"","options":{"A":"That sounds like a great idea!","B":"No, I have never been a museum.","C":"How many kilometres?","D":"It is made of glass."},"answer":"A","explanation":"Đây là tình huống giao tiếp trong đoạn hội thoại. Câu đáp “That sounds like a great idea!” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":34,"part":"PART 6 – COMMUNICATION","stem":"A visitor: \"Could you tell me how to get to the community centre?\"  A resident: \"______\"","options":{"A":"That is my favourite subject.","B":"Go straight ahead, then turn left.","C":"I bought it yesterday.","D":"Yes, I have."},"answer":"B","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “Go straight ahead, then turn left.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":35,"part":"PART 6 – COMMUNICATION","stem":"Vy: \"Would you mind helping me carry these books?\"  A friend: \"______\"","options":{"A":"Yes, I am tired.","B":"No, not at all.","C":"I don't know where.","D":"Thank you very much."},"answer":"B","explanation":"Đây là lời yêu cầu hoặc xin phép lịch sự. Câu đáp “No, not at all.” phù hợp cả ý nghĩa và phép lịch sự; cần chọn phản hồi tự nhiên thay vì chỉ chọn câu đúng ngữ pháp."},{"number":36,"part":"PART 7 – ERROR CORRECTION","stem":"(A) My brother decided (B) joining(C)  the volunteer club (D) last week.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) to join”. Sau decide dùng to-infinitive: decide to + V."},{"number":37,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The guide did not explain (B) where finding(C)  the local market (D) after the tour.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) where to find”. Sau từ để hỏi dùng to + động từ nguyên mẫu, không dùng V-ing."},{"number":38,"part":"PART 7 – ERROR CORRECTION","stem":"(A) They (B) have visited(C)  the museum (D) yesterday afternoon.","answer":"B","explanation":"Phần (B) chưa đúng. Sửa thành “(B) visited”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":39,"part":"PART 7 – ERROR CORRECTION","stem":"(A) The more crowded (B) the road is,(C)  the (D) long traffic takes.","answer":"D","explanation":"Phần (D) chưa đúng. Sửa thành “(D) longer the journey takes.”. So sánh kép yêu cầu “the + dạng so sánh hơn” ở cả hai vế."},{"number":40,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"NOTICE – CULTURAL EXCHANGE DAY\nOur youth club has planned an activity this weekend. It aims (40) _____ students understand local life through practical tasks. Everyone interested (41) _____ the event should contact the club office. You can bring a reusable cup. Please arrive (42) _____ so the group can start on time.","options":{"A":"helped","B":"help","C":"to help","D":"helping"},"answer":"C","explanation":"“take part in” = tham gia. Đây là cụm cố định; không nói make/get/do part in."},{"number":41,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"NOTICE – CULTURAL EXCHANGE DAY\nOur youth club has planned an activity this weekend. It aims (40) _____ students understand local life through practical tasks. Everyone interested (41) _____ the event should contact the club office. You can bring a reusable cup. Please arrive (42) _____ so the group can start on time.","options":{"A":"in","B":"for","C":"on","D":"at"},"answer":"A","explanation":"“want + to V” là cấu trúc đúng: want to join the event."},{"number":42,"part":"PART 8 – ADVERTISEMENT / ANNOUNCEMENT","stem":"Choose the correct option.","passage":"NOTICE – CULTURAL EXCHANGE DAY\nOur youth club has planned an activity this weekend. It aims (40) _____ students understand local life through practical tasks. Everyone interested (41) _____ the event should contact the club office. You can bring a reusable cup. Please arrive (42) _____ so the group can start on time.","options":{"A":"earliness","B":"early","C":"earlier","D":"earliest"},"answer":"B","explanation":"“cut down on + noun” = cắt giảm điều gì. Giới từ bắt buộc là on."},{"number":43,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Healthy Community Habits\nMany families in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"remember","B":"learn","C":"forget","D":"protect"},"answer":"C","explanation":"Sau how diễn đạt cách học dùng cấu trúc “how + to V”: how to learn."},{"number":44,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Healthy Community Habits\nMany families in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"shares","B":"share","C":"sharing","D":"shared"},"answer":"B","explanation":"“find information” = tìm kiếm thông tin từ nguồn đáng tin cậy. Các phrasal verbs khác không hợp ngữ cảnh."},{"number":45,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Healthy Community Habits\nMany families in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"learning","B":"learn","C":"to learn","D":"learned"},"answer":"A","explanation":"So sánh hai trạng thái mức độ hiểu biết: become + comparative adjective → more knowledgeable."},{"number":46,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Healthy Community Habits\nMany families in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"are","B":"would","C":"should","D":"did"},"answer":"C","explanation":"Lời khuyên trong tình huống khó khăn dùng should + V: they should ask for advice."},{"number":47,"part":"PART 9 – READING CLOZE","stem":"Choose the correct option.","passage":"Healthy Community Habits\nMany families in Viet Nam are learning to balance traditional values with modern life. Some people worry that modern technology may cause us to (43) _____ traditional customs. Others believe technology can help preserve them. For example, community groups often upload old photographs and (44) _____ local stories online. Young people enjoy (45) _____ about the lives of older generations. If they want to understand the past, they (46) _____ talk to grandparents and neighbours. As a result, valuable knowledge can be (47) _____ from one generation to the next, even when lifestyles change.","options":{"A":"looked up","B":"cut down","C":"turned down","D":"passed down"},"answer":"D","explanation":"Trước danh từ “experience” cần tính từ bổ nghĩa: valuable experience = trải nghiệm quý giá."},{"number":48,"part":"PART 10 – READING TRUE / FALSE","stem":"The students went to Vung Tau to learn about reducing plastic waste.   T ☐    F ☐","passage":"A Greener Neighbourhood\nLast Sunday, a group of Grade 9 students visited Vung Tau to learn about reducing plastic waste. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a community organiser, who explained the main ideas and gave practical examples. Each student received a cloth shopping bag to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Bài đọc xác nhận ngay câu mở đầu: Last Sunday, a group of Grade 9 students visited Vung Tau to learn about reducing plastic waste. Before the activity, their teacher asked them to prep. Vì vậy phát biểu này đúng."},{"number":49,"part":"PART 10 – READING TRUE / FALSE","stem":"The students received no preparation instructions from their teacher.   T ☐    F ☐","passage":"A Greener Neighbourhood\nLast Sunday, a group of Grade 9 students visited Vung Tau to learn about reducing plastic waste. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a community organiser, who explained the main ideas and gave practical examples. Each student received a cloth shopping bag to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Trong đoạn, giáo viên yêu cầu học sinh chuẩn bị câu hỏi và mang sổ ghi chép; vì vậy nói “không hướng dẫn chuẩn bị” là sai."},{"number":50,"part":"PART 10 – READING TRUE / FALSE","stem":"They met a community organiser during the activity.   T ☐    F ☐","passage":"A Greener Neighbourhood\nLast Sunday, a group of Grade 9 students visited Vung Tau to learn about reducing plastic waste. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a community organiser, who explained the main ideas and gave practical examples. Each student received a cloth shopping bag to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Đoạn văn ghi rõ học sinh gặp giáo viên tại nơi diễn ra hoạt động; vì vậy phát biểu đúng."},{"number":51,"part":"PART 10 – READING TRUE / FALSE","stem":"The activity continued until after midnight.   T ☐    F ☐","passage":"A Greener Neighbourhood\nLast Sunday, a group of Grade 9 students visited Vung Tau to learn about reducing plastic waste. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a community organiser, who explained the main ideas and gave practical examples. Each student received a cloth shopping bag to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"F","explanation":"Bài đọc nói nhóm dành khoảng hai giờ và trở lại trường trước buổi tối, không phải sau nửa đêm."},{"number":52,"part":"PART 10 – READING TRUE / FALSE","stem":"The students shared their learning in a classroom discussion.   T ☐    F ☐","passage":"A Greener Neighbourhood\nLast Sunday, a group of Grade 9 students visited Vung Tau to learn about reducing plastic waste. Before the activity, their teacher asked them to prepare a few questions and bring a notebook. At the venue, they met a community organiser, who explained the main ideas and gave practical examples. Each student received a cloth shopping bag to use during or after the activity. The group spent about two hours listening, observing and working together. They returned to school before the evening and shared what they had learnt in a short classroom discussion. Most students said the experience helped them understand their local community better.","answer":"T","explanation":"Cuối đoạn, học sinh trở về lớp, thảo luận ngắn và chia sẻ điều đã học; vì vậy phát biểu đúng."},{"number":53,"part":"PART 11 – READING COMPREHENSION","stem":"What is the passage mainly about?","passage":"Reducing Plastic Waste\nVy is a Grade 9 student who recently completed a project about protecting the local environment in Vung Tau. At first, Vy thought the project might be difficult because there was so much information to collect. However, things became easier after the student joined a recycling campaign. An older community member offered useful advice and explained why the topic matters to local people. During the project, Vy received a reusable shopping bag as a reminder of the experience. The student described the visit as effective and was proud of completing the work. After returning to school, Vy prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Vy's project about protecting the local environment","B":"A guide to international airports","C":"An expensive shopping experience","D":"The history of modern smartphones"},"answer":"A","explanation":"Ý chính bao quát toàn đoạn là “Vy's project about protecting the local environment”, đúng với hoạt động được giới thiệu ở đầu bài và phát triển xuyên suốt đoạn. Các đáp án khác không phản ánh nội dung chính."},{"number":54,"part":"PART 11 – READING COMPREHENSION","stem":"Where did Vy carry out the project?","passage":"Reducing Plastic Waste\nVy is a Grade 9 student who recently completed a project about protecting the local environment in Vung Tau. At first, Vy thought the project might be difficult because there was so much information to collect. However, things became easier after the student joined a recycling campaign. An older community member offered useful advice and explained why the topic matters to local people. During the project, Vy received a reusable shopping bag as a reminder of the experience. The student described the visit as effective and was proud of completing the work. After returning to school, Vy prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"London","B":"Vung Tau","C":"Sydney","D":"New York"},"answer":"B","explanation":"Địa điểm “Vung Tau” được nêu trực tiếp trong câu đầu của đoạn văn; đây là câu hỏi tìm thông tin chi tiết."},{"number":55,"part":"PART 11 – READING COMPREHENSION","stem":"The word “effective” in the passage is CLOSEST in meaning to ______.","passage":"Reducing Plastic Waste\nVy is a Grade 9 student who recently completed a project about protecting the local environment in Vung Tau. At first, Vy thought the project might be difficult because there was so much information to collect. However, things became easier after the student joined a recycling campaign. An older community member offered useful advice and explained why the topic matters to local people. During the project, Vy received a reusable shopping bag as a reminder of the experience. The student described the visit as effective and was proud of completing the work. After returning to school, Vy prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"ordinary","B":"unpleasant","C":"boring","D":"successful"},"answer":"D","explanation":"Từ được hỏi trong ngữ cảnh bài đọc gần nghĩa với “successful”. Đọc câu chứa từ đó để xác định sắc thái phù hợp, không chọn từ trái nghĩa hoặc khác ngữ cảnh."},{"number":56,"part":"PART 11 – READING COMPREHENSION","stem":"The phrase “the student” in the passage refers to ______.","passage":"Reducing Plastic Waste\nVy is a Grade 9 student who recently completed a project about protecting the local environment in Vung Tau. At first, Vy thought the project might be difficult because there was so much information to collect. However, things became easier after the student joined a recycling campaign. An older community member offered useful advice and explained why the topic matters to local people. During the project, Vy received a reusable shopping bag as a reminder of the experience. The student described the visit as effective and was proud of completing the work. After returning to school, Vy prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"a classmate","B":"the community member","C":"Vy","D":"the teacher"},"answer":"C","explanation":"“the student” được dùng thay cho nhân vật học sinh chính “Vy” trong câu trước, tránh lặp từ."},{"number":57,"part":"PART 11 – READING COMPREHENSION","stem":"Which statement is NOT TRUE according to the passage?","passage":"Reducing Plastic Waste\nVy is a Grade 9 student who recently completed a project about protecting the local environment in Vung Tau. At first, Vy thought the project might be difficult because there was so much information to collect. However, things became easier after the student joined a recycling campaign. An older community member offered useful advice and explained why the topic matters to local people. During the project, Vy received a reusable shopping bag as a reminder of the experience. The student described the visit as effective and was proud of completing the work. After returning to school, Vy prepared a short presentation and shared the new knowledge with classmates. The class enjoyed the talk, and several students said they hoped to try a similar project in the future.","options":{"A":"Vy kept the results secret and never presented them.","B":"Several classmates wanted to try a similar project.","C":"Vy received a reusable shopping bag during the project.","D":"Vy gave a presentation at school."},"answer":"A","explanation":"Đoạn văn nói nhân vật trình bày kết quả và chia sẻ với các bạn; vì vậy ý cho rằng giữ bí mật kết quả là NOT TRUE."},{"number":58,"part":"PART 12 – WORD FORM","stem":"Our teacher encouraged ______ thinking during the project. (CREATE)","answer":"creative","explanation":"Từ gốc trong ngoặc phải biến đổi thành “creative” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":59,"part":"PART 12 – WORD FORM","stem":"The new metro makes travelling across the city more ______. (CONVENIENCE)","answer":"convenient","explanation":"Từ gốc trong ngoặc phải biến đổi thành “convenient” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":60,"part":"PART 12 – WORD FORM","stem":"The ______ of traditional buildings is important. (PRESERVE)","answer":"preservation","explanation":"Từ gốc trong ngoặc phải biến đổi thành “preservation” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":61,"part":"PART 12 – WORD FORM","stem":"The museum provides useful ______ about local history. (INFORM)","answer":"information","explanation":"Từ gốc trong ngoặc phải biến đổi thành “information” (danh từ/tính từ/trạng từ theo chức năng trong câu). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":62,"part":"PART 12 – WORD FORM","stem":"He gave a very ______ explanation of the route. (HELP)","answer":"helpful","explanation":"Từ gốc trong ngoặc phải biến đổi thành “helpful” (tính từ hoặc trạng từ theo vị trí bổ nghĩa). Đọc cả câu để xác định thành phần đứng trước/sau ô trống và sự hòa hợp nghĩa."},{"number":63,"part":"PART 13 – SENTENCE REWRITING","stem":"He did not know the place where he should park. (WHERE)","answer":"He did not know where to park.","explanation":"Đáp án mẫu: “He did not know where to park.” Rút gọn mệnh đề gián tiếp: wh-word + to-infinitive."},{"number":64,"part":"PART 13 – SENTENCE REWRITING","stem":"If you practise speaking more, you will become more confident. (THE)","answer":"The more you practise speaking, the more confident you will become.","explanation":"Đáp án mẫu: “The more you practise speaking, the more confident you will become.” So sánh kép: The + comparative..., the + comparative..."},{"number":65,"part":"PART 13 – SENTENCE REWRITING","stem":"He likes collecting old photographs. (ENJOYS)","answer":"He enjoys collecting old photographs.","explanation":"Đáp án mẫu: “He enjoys collecting old photographs.” Giữ nguyên nghĩa câu gốc đồng thời đổi cấu trúc phù hợp từ gợi ý."},{"number":66,"part":"PART 13 – SENTENCE REWRITING","stem":"The last time Mai visited Hue was in 2021. (SINCE)","answer":"Mai has not visited Hue since 2021.","explanation":"Đáp án mẫu: “Mai has not visited Hue since 2021.” Đổi mốc bắt đầu thành hiện tại hoàn thành have/has + V3 + for/since."},{"number":67,"part":"PART 14 – SENTENCE BUILDING","stem":"the / more / we / read / the / more / we / understand / history.","answer":"The more we read, the more we understand history.","explanation":"Câu hoàn chỉnh: “The more we read, the more we understand history.” So sánh kép dùng The + so sánh hơn ở cả hai vế."},{"number":68,"part":"PART 14 – SENTENCE BUILDING","stem":"If / you / feel / stressed / you / should / talk / teacher.","answer":"If you feel stressed, you should talk to a teacher.","explanation":"Câu hoàn chỉnh: “If you feel stressed, you should talk to a teacher.” Câu điều kiện loại 1: If + hiện tại đơn, S + modal/will + V."},{"number":69,"part":"PART 14 – SENTENCE BUILDING","stem":"I / wish / my school / have / a bigger library.","answer":"I wish my school had a bigger library.","explanation":"Câu hoàn chỉnh: “I wish my school had a bigger library.” Sắp xếp đúng S–V–O, giới từ và thì theo mốc thời gian."}]}];

function utter(text){if(!synth)return Promise.resolve();return new Promise(resolve=>{let u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.83;u.pitch=1;let voices=synth.getVoices();let voice=voices.find(x=>/^en-GB$/i.test(x.lang))||voices.find(x=>x.lang.toLowerCase().startsWith('en-gb'));if(voice)u.voice=voice;let finished=false;let fallback=setTimeout(done,Math.min(8000,Math.max(2800,500*text.length)));function done(){if(finished)return;finished=true;clearTimeout(fallback);resolve()}u.onend=done;u.onerror=done;try{synth.speak(u)}catch(e){done()}})}

function renderHome(){const live=Array.from({length:12},(_,i)=>UNIT_DATA[i+1]);return `<section class="hero"><div class="hero-grid"><div><span class="chip">● HỆ THỐNG HỌC TỪ VỰNG THÔNG MINH</span><h1>TIẾNG ANH <span>LỚP 9</span></h1><p>12 Unit theo chủ đề. Đã hoàn thiện Unit 1–12: từ vựng, phrasal verbs, word forms, IPA Anh–Anh, câu ví dụ và 4 trò chơi tương tác. Unit 6–12 đã được lọc trùng xuyên suốt các Unit trước.</p><button class="btn orange" data-action="select-unit" data-unit="12">Học Unit 12 – Career Choices →</button></div><div class="hero-panel"><small>UNIT ĐÃ SẴN SÀNG</small><div class="giant">12<span style="font-size:22px;color:white"> / 12</span></div><small>UNIT 1–12 · TỪ VỰNG VÀ GAME ĐÃ SẴN SÀNG</small><div class="hero-counts"><span><b>${live.reduce((n,x)=>n+x.vocab.length,0)}</b>Từ vựng</span><span><b>${live.reduce((n,x)=>n+x.phrasal.length,0)}</b>Phrasal verbs</span><span><b>${live.reduce((n,x)=>n+x.word.length,0)}</b>Word forms</span></div></div></div></section><div class="sem-feature"><div><span class="chip">📘 HỌC KỲ 1 · UNIT 1–6</span><h2>Ôn tập thi học kỳ 1 – 15 đề</h2><p>69 câu/đề · Phát âm, trọng âm, từ vựng, ngữ pháp, đọc hiểu và viết · Chấm điểm và giải thích từng câu sau khi nộp bài.</p></div><button type="button" class="btn orange" data-action="sem-catalog">Vào ôn tập học kỳ 1 →</button></div><div class="section-head"><div><span class="chip navy">CHƯƠNG TRÌNH 12 UNIT</span><h2>Chọn bài học</h2><p>Unit 1–12 đã có đầy đủ dữ liệu từ vựng và các trò chơi. Không lặp mục từ đã học ở Unit trước.</p></div></div><div class="units">${Array.from({length:12},(_,i)=>{const n=i+1,unit=UNIT_DATA[n];return `<button class="unit ${unit?'available':'unavailable'}" ${unit?`data-action="select-unit" data-unit="${n}"`:'disabled aria-disabled="true"'}><div><div class="number">${String(n).padStart(2,'0')}</div><div style="margin-top:7px;font-weight:850">UNIT ${n}</div></div><div class="unit-foot"><span>${unit?esc(unit.name):'Chưa có dữ liệu'}</span><span class="status ${unit?'ready':''}">${unit?'Sẵn sàng':'Sắp có'}</span></div></button>`}).join('')}</div>`}
function renderUnit(){const u=bank(),n=String(state.unit).padStart(2,'0'),g=UNIT_GRAMMAR[state.unit];return `${baseHeader()}<div><span class="chip">UNIT ${n} / 12 · HENRY ENGLISH</span><h1 class="page-title">${esc(u.name)}</h1><p class="page-subtitle">${esc(u.vn)} · 3 học phần từ vựng${g?' + ngữ pháp':''} · ${u.vocab.length+u.phrasal.length+u.word.length} mục · IPA Anh–Anh (UK)</p>${state.unit===4?`<div class="note">🔎 <b>Đã lọc trùng với Unit 1–3:</b> 37 từ/cụm từ mới, 9 phrasal verbs mới và 12 họ từ (39 dạng từ mới).</div>`:state.unit===5?`<div class="note">🔎 <b>Unit 5 đã lọc trùng Unit 1–4:</b> ${u.vocab.length} Core Vocabulary, ${u.phrasal.length} phrasal verbs và ${u.families.length} họ từ (${u.word.length} dạng từ).</div>`:state.unit>=6?`<div class="note">🔎 <b>Unit ${state.unit} đã lọc trùng Unit 1–${state.unit-1}:</b> ${u.vocab.length} từ/cụm từ mới, ${u.phrasal.length} phrasal verbs mới, ${u.families.length} họ từ (${u.word.length} dạng từ mới). Từ đã học không xuất hiện lại như một mục mới; phần ngữ pháp được giữ từ tài liệu gốc.</div>`:''}</div><div class="topic-grid ${g?'with-grammar':''}"><button class="topic" data-action="open-category" data-category="vocab"><span class="topic-icon">📚</span><span class="chip">PART 1 · CORE VOCABULARY</span><h2>01 · Từ vựng</h2><p>Từ theo chủ đề, IPA (UK), từ loại, nghĩa tiếng Việt và ví dụ song ngữ.</p><div class="topic-end"><span>${u.vocab.length} từ/cụm từ</span><b>Vào học →</b></div></button><button class="topic blue" data-action="open-category" data-category="phrasal"><span class="topic-icon">🔗</span><span class="chip navy">PART 2 · PHRASAL VERBS</span><h2>02 · Phrasal Verbs</h2><p>Cụm động từ có IPA, nghĩa, cấu trúc và ví dụ.</p><div class="topic-end"><span>${u.phrasal.length} cụm động từ</span><b>Vào học →</b></div></button><button class="topic blue word-topic" data-action="open-category" data-category="word"><span class="topic-icon">🔤</span><span class="chip navy">PART 3 · WORD FORMS</span><h2>03 · Word Forms</h2><p>Các họ Verb – Noun – Adjective – Adverb. Mỗi dạng có IPA, nghĩa và ví dụ.</p><div class="topic-end"><span>${u.word.length} dạng từ · ${u.families.length} họ từ</span><b>Vào học →</b></div></button>${g?`<button class="topic grammar-topic" data-action="open-grammar"><span class="topic-icon">✍️</span><span class="chip">PART 4 · GRAMMAR</span><h2>04 · Ngữ pháp</h2><p>Lý thuyết, cấu trúc và bài tập ngữ pháp trọng tâm Unit ${state.unit} từ tài liệu đã gửi.</p><div class="topic-end"><span>Ngữ pháp Unit ${state.unit}</span><b>Vào học →</b></div></button>`:''}</div><div class="note" style="margin-top:23px"><b>Cách học:</b> Chọn học phần → tích những từ muốn luyện → Flashcard, Ghép từ, Trắc nghiệm hoặc Chữ bay. Chữ bay tính điểm theo một lần chọn: đúng +10, sai 0 rồi chuyển câu.</div>`}
function renderGrammar(){const u=bank();return `${baseHeader()}<div class="learning-top"><div><span class="chip">UNIT ${state.unit} · PART 4</span><h1 class="page-title">Ngữ pháp · ${esc(u.name)}</h1><p class="page-subtitle">Lý thuyết, cấu trúc và ví dụ theo tài liệu Unit ${state.unit}</p></div>${btn('← Chọn học phần','unit')}</div><article class="grammar-lesson card">${UNIT_GRAMMAR[state.unit]||'<p>Chưa có dữ liệu ngữ pháp.</p>'}</article>`}
function renderLearn(){const u=bank(),t={vocab:['Core Vocabulary',`${u.vocab.length} từ/cụm từ · IPA (UK), từ loại, nghĩa và câu ví dụ`],phrasal:['Phrasal Verbs',`${u.phrasal.length} cụm động từ · IPA (UK), nghĩa, cấu trúc và ví dụ`],word:['Word Forms',`${u.families.length} họ từ · ${u.word.length} dạng từ · IPA cho từng dạng`] }[state.category];return `${baseHeader()}<div class="learning-top"><div><span class="chip">UNIT ${String(state.unit).padStart(2,'0')} · ${u.name.toUpperCase()}</span><h1 class="page-title">${t[0]}</h1><p class="page-subtitle">${t[1]}</p></div>${btn('← Chọn học phần','unit')}</div><div class="tabrow"><button class="tab ${state.tab==='bank'?'active':''}" data-action="tab" data-tab="bank">📚 Học từ vựng</button><button class="tab ${state.tab==='games'?'active':''}" data-action="tab" data-tab="games">🎮 Luyện tập qua game</button></div>${state.tab==='bank'?renderBank():renderGamesMenu()}`}
function renderBank(){
 const u=bank(),s=state.search.trim().toLowerCase(),sel=selected();
 const termRow=x=>`<div class="term card"><input type="checkbox" class="tick" data-select-id="${x.id}" ${sel.has(x.id)?'checked':''} aria-label="Chọn ${esc(x.word)}"><div><div class="term-word">${esc(x.word)}</div><span class="ipa">${esc(x.ipa)}</span><span class="wordtype">${esc(x.pos)}</span></div><div class="meaning">${esc(x.vi)}${x.structure?`<small style="display:block;color:#ef711c">${esc(x.structure)}</small>`:''}</div><div class="example">${esc(x.example||'')}${state.unit===3?(()=>{const trans=state.category==='vocab'?VOCABULARY_3_VI[x.word]:state.category==='phrasal'?PHRASALS_3_VI[x.word]:'';return trans?`<span class="form-example">${esc(trans)}</span>`:''})():''}${x.exampleVi?`<span class="form-example">${esc(x.exampleVi)}</span>`:''}</div><button class="speaker" data-action="speak" data-id="${x.id}" aria-label="Nghe ${esc(x.word)}">🔊</button></div>`;
 let listing='';
 if(state.category==='vocab'){
  let groups=state.unit===2?['City Life & Urban Environment','Traffic & Transportation','Urban Problems']:state.unit===3?['Physical & Mental Health','Study & Time Management','Advice, Communication & Daily Habits']:state.unit===4?['Historical Places & Heritage','Traditions & Cultural Values','Life in the Past']:state.unit===5?['Experiences & Feelings','School & Group Activities','Travel & Outdoor Adventures']:state.unit>=6?[...new Set(u.vocab.map(x=>x.group))]:[null];
  listing=`<div class="banks">${groups.map(g=>{const a=u.vocab.filter(x=>(!g||x.group===g)&&[x.word,x.vi,x.example,x.pos].some(v=>v.toLowerCase().includes(s)));return a.length?`${g?`<h2 class="bank-subhead">${esc(g)} <small>${a.length} từ/cụm từ</small></h2>`:''}${a.map(termRow).join('')}`:''}).join('')||'<div class="card no-result">Không tìm thấy từ vựng phù hợp.</div>'}</div>`;
 }else if(state.category==='phrasal'){
  const matching=u.phrasal.filter(x=>[x.word,x.vi,x.example,x.structure||''].some(v=>v.toLowerCase().includes(s)));
  const core=u.corePhrases.map(w=>matching.find(x=>x.word===w)).filter(Boolean);
  const extra=matching.filter(x=>!u.corePhrases.includes(x.word));
  listing=`<div class="banks"><h2 class="bank-subhead">Core Phrasal Verbs <small>${u.corePhrases.length} cụm trọng tâm</small></h2>${core.map(termRow).join('')}${extra.length?`<h2 class="bank-subhead">Phrasal Verbs bổ sung <small>${extra.length} cụm bổ sung</small></h2>${extra.map(termRow).join('')}`:''}${matching.length?'':'<div class="card no-result">Không tìm thấy cụm động từ phù hợp.</div>'}</div>${state.unit===1?'<div class="note"><b>Cấu trúc khác cần nhớ:</b> remind somebody of something <span class="ipa">/rɪˈmaɪnd ˈsʌmbədi əv ˈsʌmθɪŋ/</span> – gợi ai nhớ đến điều gì. Ví dụ: This song reminds me of my hometown.</div>':state.unit===2?'<div class="note"><b>Ghi nhớ:</b> “carry out” và “cut down on” đã được học ở Unit 1 nên không xuất hiện lại ở Unit 2. Với <b>pick somebody up</b>, khi dùng đại từ: <b>pick me/him/her up</b>.</div>':state.unit===3?'<div class="note"><b>Đã lọc trùng Unit 1–2:</b> look after, deal with, put on, give up, cut down on. Chỉ giữ các phrasal verbs chưa học; ví dụ và cấu trúc được giữ đầy đủ.</div>':state.unit===4?'<div class="note"><b>Unit 4:</b> Đã bỏ cụm <i>set up</i> (đã có ở Unit 1). Các cụm còn lại được chia thành trọng tâm và mở rộng, có IPA, cấu trúc và ví dụ song ngữ.</div>':`<div class="note"><b>Unit ${state.unit}:</b> Đã lọc trùng với các Unit trước. Nhấn biểu tượng 🔊 để nghe phát âm và tích chọn các cụm muốn luyện tập.</div>`}`;
 }else{
  listing=`<div>${u.families.filter(f=>f.root.includes(s)||f.meaning.toLowerCase().includes(s)||f.ids.some(id=>{let x=u.word.find(w=>w.id===id);return x.word.toLowerCase().includes(s)||x.vi.toLowerCase().includes(s)})).map(f=>`<article class="family card"><div class="family-head"><div class="family-title">${esc(f.root)} <small>· ${esc(f.meaning)}</small></div><button class="btn small outline" data-action="toggle-family" data-family="${esc(f.root)}">${f.ids.every(id=>sel.has(id))?'Bỏ chọn nhóm':'Chọn nhóm'}</button></div><div class="family-grid">${POS_KEYS.map(pos=>`<div class="family-col"><h4>${POS_NAME[pos]}</h4>${f.forms[pos].length?f.forms[pos].map(form=>{const entry=u.word.find(w=>w.family===f.root&&w.posKey===pos&&w.word===form[0]);return `<div class="word-entry"><input class="tick" type="checkbox" data-select-id="${entry.id}" ${sel.has(entry.id)?'checked':''} aria-label="Chọn ${esc(entry.word)}"><div><strong>${esc(entry.word)}</strong><span class="ipa">${esc(entry.ipa)}</span><span class="vn">${esc(entry.vi)}</span>${state.unit>=2?`<span class="form-example">${esc(entry.example)}${entry.exampleVi?`<span class="form-example" style="margin-top:2px">${esc(entry.exampleVi)}</span>`:''}</span>`:''}</div><button class="speaker" data-action="speak" data-id="${entry.id}" aria-label="Nghe ${esc(entry.word)}">🔊</button></div>`}).join(''):'<span class="empty-dash">— Không có dạng thông dụng</span>'}</div>`).join('')}</div><div class="family-bottom"><b>Ví dụ:</b> ${esc(f.example)}${f.note?`<div style="color:#c5661d;margin-top:6px"><b>⚠ Lưu ý:</b> ${esc(f.note)}</div>`:''}</div></article>`).join('')||'<div class="card no-result">Không tìm thấy họ từ phù hợp.</div>'}</div>`;
 }
 return `<div class="toolbar"><input class="search" aria-label="Tìm kiếm từ vựng" id="termSearch" placeholder="🔎 Tìm từ tiếng Anh / nghĩa tiếng Việt..." value="${esc(state.search)}"><button class="btn small outline" data-action="select-all">✓ Chọn tất cả</button><button class="btn small ghost" data-action="select-none">Bỏ chọn</button><span class="count">Đã chọn: ${sel.size}/${current().length}</span></div>${listing}<div class="section-head"><div><h2>Luyện tập với từ đã chọn</h2><p>Chỉ những từ đã đánh dấu mới xuất hiện trong trò chơi.</p></div>${btn('🎮 Chọn trò chơi →','go-games','orange')}</div>`;
}
function renderGamesMenu(){return `<div class="selection-banner">✅ Đã chọn <b>${chosen().length}/${current().length}</b> mục từ. Muốn đổi bộ từ luyện tập, quay lại tab “Học từ vựng” để tích chọn.</div><div class="mode-grid"><button class="mode" data-action="start-game" data-game="flash"><span class="emoji">🃏</span><h3>Flashcard</h3><p>Lật thẻ Anh–Việt, nghe phát âm mỗi lần đổi mặt.</p><span class="arrow">Bắt đầu →</span></button><button class="mode" data-action="start-game" data-game="match"><span class="emoji">🧩</span><h3>Ghép từ</h3><p>Ghép tiếng Anh với nghĩa tiếng Việt, 6 cặp/lượt.</p><span class="arrow">Bắt đầu →</span></button><button class="mode" data-action="start-game" data-game="quiz"><span class="emoji">📝</span><h3>Trắc nghiệm</h3><p>Chọn đáp án đúng qua các lựa chọn Anh–Việt.</p><span class="arrow">Bắt đầu →</span></button><button class="mode" data-action="start-game" data-game="fly"><span class="emoji">🪁</span><h3>Chữ bay thật</h3><p>Tất cả từ đã chọn bay tự do trong khung lớn. Nghe ×3, chọn 1 lần để tính điểm: đúng +10, sai 0, sau đó tự chuyển từ tiếp theo.</p><span class="arrow">Bắt đầu →</span></button></div><div class="note"><b>Chữ bay:</b> Toàn bộ các từ đã chọn xuất hiện cùng lúc. Mỗi từ được đọc chỉ có một lần chọn để ghi điểm. Để dễ nhìn trên điện thoại, có thể chọn 10–20 từ mỗi lượt. Giọng đọc phụ thuộc giọng tiếng Anh có sẵn trên thiết bị.</div>${btn('← Chọn từ luyện tập','go-bank','outline')}`}
const gameName=g=>({flash:'Flashcard',match:'Ghép từ',quiz:'Trắc nghiệm',fly:'Chữ bay'})[g]||g;
function progressBar(n,d){return `<div class="progress-track" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${d}"><div class="progress-bar" style="width:${d?Math.min(100,n/d*100):0}%"></div></div>`}
function gameFrame(header,details,body,frac,total){return `${baseHeader()}<div class="game-box ${state.game==='fly'?'fly-full':''}"><div class="game-head"><div><span class="chip">UNIT ${String(state.unit).padStart(2,'0')} · ${{vocab:'CORE VOCABULARY',phrasal:'PHRASAL VERBS',word:'WORD FORMS'}[state.category]}</span><h1>${header}</h1><span style="color:var(--muted)">${details}</span></div>${btn('✕ Thoát','exit-game','outline small')}</div>${progressBar(frac,total)}<div class="game-stage">${body}</div></div>`}
function renderGame(){if(state.game==='flash')return renderFlash();if(state.game==='match')return renderMatch();if(state.game==='quiz')return renderQuiz();return renderFly()}
function finishView(title,score,total){const fly=state.game==='fly'?state.flying:null;return gameFrame(title,'Đã hoàn thành',`<div class="finish"><div class="trophy">🏆</div><h2>Hoàn thành!</h2><div class="score">${fly?fly.score+' ĐIỂM':score+' / '+total}</div><p>${fly?'Chọn đúng '+score+'/'+total+' từ · '+fly.wrong+' câu sai, '+(fly.skipped||0)+' bỏ qua.':title+' · Bạn có thể làm lại hoặc chọn trò chơi khác.'}</p><div class="button-group" style="justify-content:center">${btn('↻ Chơi lại','replay','orange')}${btn('Chọn trò chơi khác','exit-game')}</div></div>`,total,total)}
function renderFlash(){let f=state.flash;if(f.pos>=f.queue.length)return finishView('Flashcard',f.queue.length,f.queue.length);let e=f.queue[f.pos];return gameFrame('🃏 Flashcard',`Thẻ ${f.pos+1}/${f.queue.length} · Nhấn vào thẻ để lật`, `<button type="button" class="flashcard ${f.flipped?'flipped':''}" data-action="flip"><span class="face-label">${f.flipped?'MẶT TIẾNG VIỆT':'MẶT TIẾNG ANH'}</span><span class="word">${esc(f.flipped?e.vi:e.word)}</span>${f.flipped?`<span class="phonetic">${esc(e.word)} · ${esc(e.ipa)}</span><span class="type">${esc(e.pos)}${e.family?' · '+esc(e.family):''}</span>`:`<span class="phonetic">${esc(e.ipa)}</span><span class="type">${esc(e.pos)}</span>`}<span class="hint">🔄 Chạm để lật thẻ · 🔊 Phát âm tiếng Anh</span></button><div class="under-card"><div class="button-group">${btn('◀ Trước','flash-prev','outline')}${btn('🔊 Nghe','flash-speak','ghost')}</div><div class="button-group">${btn('Lật thẻ','flip','outline')}${btn('Tiếp theo ▶','flash-next','orange')}</div></div>`,f.pos,f.queue.length)}
function renderMatch(){let m=state.match;if(m.offset>=m.queue.length)return finishView('Ghép từ',m.correct,m.queue.length);return gameFrame('🧩 Ghép từ',`Lượt ${Math.floor(m.offset/6)+1} · Đã ghép ${m.correct}/${m.queue.length} cặp`, `<div class="question">Chọn 1 ô tiếng Anh và 1 ô nghĩa tiếng Việt</div><div class="match-grid">${m.cards.map(c=>{let e=m.queue.find(x=>x.id===c.id);let txt=c.side==='en'?e.word:e.vi+(state.category==='word'?' · '+e.pos:'');let active=m.picked.some(k=>k.side===c.side&&k.id===c.id);return `<button class="match-btn ${m.done.has(c.id)?'matched':''} ${active?'chosen':''} ${m.wrong&&active?'wrong':''}" data-action="match-card" data-side="${c.side}" data-id="${c.id}" ${m.done.has(c.id)?'disabled':''}>${esc(txt)}${c.side==='en'?`<span class="sub">${esc(e.ipa)}${state.category==='word'?' · '+esc(e.pos):''}</span>`:''}</button>`}).join('')}</div><div class="under-card"><span class="count">✅ ${m.done.size}/${m.group.length} cặp trong lượt</span><div class="button-group">${m.done.size===m.group.length?btn(m.offset+6>=m.queue.length?'Xem kết quả →':'Lượt tiếp →','match-next','orange'):btn('🔀 Trộn lại','match-shuffle','ghost')}</div></div>`,m.correct,m.queue.length)}
function makeQuizOptions(q){const target=q.queue[q.pos];const reverse=q.pos%2===1;const label=e=>reverse?e.word:e.vi+(state.category==='word'?' · '+e.pos:'');let pool=shuffle(current().filter(x=>x.id!==target.id&&label(x)!==label(target)));let used=new Set([label(target)]);let opts=[target];for(const x of pool){if(!used.has(label(x))){used.add(label(x));opts.push(x)}if(opts.length>=4)break}return shuffle(opts)}
function renderQuiz(){const q=state.quiz;if(q.pos>=q.queue.length)return finishView('Trắc nghiệm',q.correct,q.queue.length);const e=q.queue[q.pos];const reverse=q.pos%2===1;const label=x=>reverse?x.word:x.vi+(state.category==='word'?' · '+x.pos:'');return gameFrame('📝 Trắc nghiệm',`Câu ${q.pos+1}/${q.queue.length} · Đúng ${q.correct} câu`, `<div class="question">${reverse?'Chọn từ tiếng Anh có nghĩa':'Chọn nghĩa tiếng Việt của từ'}</div><div class="quiz-prompt">${esc(reverse?e.vi+(state.category==='word'?' · '+e.pos:''):e.word+(state.category==='word'?' · '+e.pos:''))}</div><div class="quiz-ipa">${reverse?esc(e.pos):esc(e.ipa)} ${!reverse?`<button class="speaker" data-action="quiz-speak" aria-label="Nghe câu hỏi">🔊</button>`:''}</div><div class="choices">${q.options.map((x,i)=>`<button class="choice ${q.answered?(x.id===e.id?'right':q.choice===x.id?'wrong':''):''}" data-action="quiz-answer" data-id="${x.id}" ${q.answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span>${esc(label(x))}</button>`).join('')}</div>${q.answered?`<div class="feedback ${q.choice===e.id?'':'bad'}">${q.choice===e.id?'✔ Chính xác!':'✖ Chưa chính xác.'} Đáp án: <b>${esc(e.word)}</b> <span class="ipa">${esc(e.ipa)}</span> — ${esc(e.vi)}${e.example?`<div style="margin-top:5px;font-size:12px">${esc(e.example)}</div>`:''}</div><div class="under-card" style="justify-content:flex-end">${btn('Câu tiếp theo →','quiz-next','orange')}</div>`:''}`,q.pos,q.queue.length)}
function renderFly(){const f=state.flying;if(f.pos>=f.queue.length)return finishView('Chữ bay',f.correct,f.queue.length);return gameFrame('🪁 Chữ bay – Nghe & bắt từ',`Tất cả ${f.queue.length} chữ đang bay · mỗi câu chỉ có 1 lượt chọn để ghi điểm`, `<div class="fly-dashboard"><div><span class="fly-kicker">🔊 NGHE TỪ CẦN TÌM (3 LẦN)</span><div id="flyGuide" class="fly-guide" aria-live="polite">Lắng nghe và chọn đúng ngay từ lần đầu!</div></div><div class="fly-stat"><b id="flyScore">${f.score}</b><small>ĐIỂM</small></div><div class="fly-stat"><b id="flyCorrect">${f.correct}</b><small>ĐÚNG</small></div><div class="fly-stat"><b id="flyRemaining">${f.queue.length-f.pos}</b><small>CÒN LẠI</small></div></div><div class="fly-actions"><button class="btn orange" data-action="fly-speak">🔊 Nghe lại 3 lần</button><button class="btn outline" data-action="fly-skip">Bỏ qua từ này →</button><button class="btn ghost" data-action="fly-pause" id="flyPause">⏸ Tạm dừng chữ bay</button></div><div id="flyingArena" class="flying-arena swarm" aria-label="Các từ đang bay, hãy tìm từ nghe được">${f.queue.map((e,i)=>`<button type="button" class="fly-word swarm-word" data-action="fly-answer" data-id="${e.id}" style="--tone:${i%5}" aria-label="Chọn ${esc(e.word)}">${esc(e.word)}</button>`).join('')}</div><div class="fly-help">Chữ bay liên tục trong một khung lớn. <b>Mỗi từ chỉ được chọn một lần: đúng +10 điểm, sai 0 điểm; tự chuyển câu tiếp theo.</b></div><div class="under-card"><span id="flyCounter" class="count">Đã làm ${f.pos}/${f.queue.length} từ · Sai ${f.wrong}</span><span class="count">⭐ <span id="flyBottomScore">${f.score}</span> điểm</span></div>`,f.pos,f.queue.length)}
function render(){stopFlyMotion();app.innerHTML=state.page==='semester'?renderSemesterHome():state.page==='semExam'?renderSemExam():state.page==='home'?renderHome():state.page==='unit'?renderUnit():state.page==='grammar'?renderGrammar():state.page==='learn'?renderLearn():renderGame();document.querySelector('#soundBtn').textContent=state.sound?'🔊':'🔇';document.querySelector('#soundBtn').title='Hiệu ứng nút (không tắt phát âm từ vựng)';if(state.page==='game'&&state.game==='fly'&&state.flying&&state.flying.pos<state.flying.queue.length)requestAnimationFrame(()=>{if(state.page==='game'&&state.game==='fly')startFlyMotion()})}
function openCategory(cat){state.category=cat;state.page='learn';state.tab='bank';state.search='';cancelSpeech();render();scrollUp()}
function switchTab(tab){state.tab=tab;state.search='';render();scrollUp()}
function startGame(game){let pool=chosen();if(!pool.length){alert('Hãy chọn ít nhất 1 từ ở phần Học từ vựng.');state.tab='bank';render();return}if(game==='match'&&pool.length<2){alert('Ghép từ cần chọn ít nhất 2 mục từ.');return}state.page='game';state.game=game;cancelSpeech();if(game==='flash')state.flash={queue:shuffle(pool),pos:0,flipped:false};if(game==='match'){state.match={queue:shuffle(pool),offset:0,correct:0,group:[],cards:[],picked:[],done:new Set(),wrong:false,lock:false};setupMatch()}if(game==='quiz'){state.quiz={queue:shuffle(pool),pos:0,correct:0,choice:null,answered:false,options:[]};state.quiz.options=makeQuizOptions(state.quiz)}if(game==='fly'){const unique=new Map();for(const x of pool){if(!unique.has(x.word.toLowerCase()))unique.set(x.word.toLowerCase(),x)}let queue=shuffle([...unique.values()]);state.flying={queue,pos:0,correct:0,score:0,wrong:0,skipped:0,lock:false,paused:false}}render();scrollUp();if(game==='flash')speak(state.flash.queue[0].word);if(game==='fly')speak(state.flying.queue[0].word,3)}
function setupMatch(){let m=state.match;m.group=m.queue.slice(m.offset,m.offset+6);m.cards=shuffle(m.group.flatMap(e=>[{side:'en',id:e.id},{side:'vi',id:e.id}]));m.done=new Set();m.picked=[];m.wrong=false;m.lock=false}
// Tất cả từ còn lại hiển thị đồng thời; không còn bộ 6 ô đứng yên như bản cũ.
function goFromGame(){cancelSpeech();state.page='learn';state.tab='games';render();scrollUp()}
function lookup(id){return Object.values(UNIT_DATA).flatMap(u=>[...u.vocab,...u.phrasal,...u.word]).find(x=>x.id===id)}
function clickHandler(e){let b=e.target.closest('button[data-action]');if(!b||!app.contains(b))return;let a=b.dataset.action;tickSound();switch(a){case'sem-catalog':cancelSpeech();state.page='semester';render();scrollUp();return;
 case'sem-open':cancelSpeech();semState.id=Number(b.dataset.test);semState.part=0;state.page='semExam';render();scrollUp();return;
 case'sem-part':semNavigate(b.dataset.part);return;
 case'sem-next':semNavigate(semState.part+1);return;
 case'sem-prev':semNavigate(semState.part-1);return;
 case'sem-result-top':scrollUp();return;
 case'sem-answer':{if(semSubmitted())return;let q=Number(b.dataset.q),c=b.dataset.choice;semRecord()[q]=c;semPersist();const y=window.scrollY;render();window.scrollTo(0,y);return}
 case'sem-finish':{if(semSubmitted())return;const st=semAutoStats(semState.id),blank=69-st.attempted-st.written;const msg=blank>0?`Bạn còn ${blank} câu chưa trả lời (gồm ${st.remaining} câu chấm tự động và ${7-st.written} câu tự luận).\n\nBạn vẫn muốn NỘP BÀI và xem điểm/đáp án không?`:'Bạn chắc chắn muốn NỘP BÀI? Sau khi nộp, không thể sửa câu trả lời; hệ thống sẽ công bố điểm và đáp án.';if(!confirm(msg))return;semRecord().__submittedAt=new Date().toISOString();semPersist();semState.part=0;render();scrollUp();return}
 case'sem-reset':{if(!confirm('Xóa toàn bộ câu trả lời và kết quả đã nộp của đề này để làm lại từ đầu?'))return;semSave[String(semState.id)]={};semPersist();semNavigate(0);return}
 case'home':topHome();return;case'select-unit':state.unit=Number(b.dataset.unit);state.category='vocab';state.tab='bank';state.page='unit';cancelSpeech();render();scrollUp();return;case'unit':cancelSpeech();state.page='unit';render();scrollUp();return;case'open-category':openCategory(b.dataset.category);return;case'open-grammar':state.page='grammar';cancelSpeech();render();scrollUp();return;case'learn':cancelSpeech();state.page='learn';state.tab='bank';render();scrollUp();return;case'tab':switchTab(b.dataset.tab);return;case'go-games':switchTab('games');return;case'go-bank':switchTab('bank');return;case'select-all':current().forEach(x=>selected().add(x.id));save();render();return;case'select-none':selected().clear();save();render();return;case'toggle-family':{let fam=families().find(f=>f.root===b.dataset.family);let set=selected();let all=fam.ids.every(id=>set.has(id));fam.ids.forEach(id=>all?set.delete(id):set.add(id));save();render();return}case'speak':speak(lookup(b.dataset.id).word);return;case'start-game':startGame(b.dataset.game);return;case'exit-game':goFromGame();return;case'replay':startGame(state.game);return;case'flip':state.flash.flipped=!state.flash.flipped;render();speak(state.flash.queue[state.flash.pos].word);return;case'flash-next':state.flash.pos++;state.flash.flipped=false;render();if(state.flash.pos<state.flash.queue.length)speak(state.flash.queue[state.flash.pos].word);return;case'flash-prev':state.flash.pos=Math.max(0,state.flash.pos-1);state.flash.flipped=false;render();speak(state.flash.queue[state.flash.pos].word);return;case'flash-speak':speak(state.flash.queue[state.flash.pos].word);return;case'match-card':matchPick(b.dataset.side,b.dataset.id);return;case'match-shuffle':{let m=state.match;m.cards=shuffle(m.cards);render();return}case'match-next':{let m=state.match;if(m.done.size!==m.group.length)return;m.offset+=6;if(m.offset<m.queue.length)setupMatch();render();return}case'quiz-answer':quizAnswer(b.dataset.id);return;case'quiz-speak':speak(state.quiz.queue[state.quiz.pos].word);return;case'quiz-next':{let q=state.quiz;if(!q.answered)return;q.pos++;q.answered=false;q.choice=null;if(q.pos<q.queue.length)q.options=makeQuizOptions(q);render();return}case'fly-speak':if(!state.flying.lock)speak(state.flying.queue[state.flying.pos].word,3);return;case'fly-answer':flyAnswer(b.dataset.id);return;case'fly-skip':if(!state.flying.lock){state.flying.skipped++;nextFly(false)}return;case'fly-pause':toggleFlyMotion();return;}}
function matchPick(side,id){const m=state.match;if(m.lock||m.done.has(id))return;const prev=m.picked[0];if(prev&&prev.side===side){m.picked=[{side,id}];render();return}m.picked.push({side,id});if(m.picked.length===2){m.lock=true;let correct=m.picked[0].id===m.picked[1].id;if(correct){m.done.add(id);m.correct++;tickSound('good');speak(lookup(id).word)}else{m.wrong=true;tickSound('bad')}render();setTimeout(()=>{if(state.game!=='match'||state.match!==m)return;m.picked=[];m.wrong=false;m.lock=false;render()},correct?430:650)}else render()}
function quizAnswer(id){let q=state.quiz;if(q.answered)return;let e=q.queue[q.pos];q.choice=id;q.answered=true;if(id===e.id){q.correct++;tickSound('good')}else tickSound('bad');render();speak(e.word)}
function flyAnswer(id){
 const f=state.flying;
 if(!f||f.lock||f.pos>=f.queue.length)return;
 const target=f.queue[f.pos];
 const button=[...document.querySelectorAll('#flyingArena .swarm-word')].find(b=>b.dataset.id===id);
 if(!button)return;
 // Chỉ lần chọn ĐẦU TIÊN được tính điểm, bất kể đúng hay sai.
 f.lock=true;
 const good=id===target.id;
 cancelSpeech();tickSound(good?'good':'bad');
 if(good){
  f.correct++;f.score+=10;
  button.classList.add('correct','vanish');flyMotion.items.delete(id);
  setFlyGuide('✅ ĐÚNG! '+target.word+' '+target.ipa+' · +10 ĐIỂM');
 }else{
  f.wrong++;
  button.classList.add('incorrect');
  setFlyGuide('❌ SAI · 0 ĐIỂM. Đáp án đúng: '+target.word+' '+target.ipa);
  const right=[...document.querySelectorAll('#flyingArena .swarm-word')].find(b=>b.dataset.id===target.id);
  if(right)right.classList.add('target-reveal');
 }
 updateFlyHud();
 setTimeout(()=>{
  if(state.page!=='game'||state.game!=='fly'||state.flying!==f)return;
  if(button.isConnected)button.classList.remove('incorrect');
  nextFly(good);
 },good?460:950);
}
function nextFly(correct){
 const f=state.flying;if(!f||f.pos>=f.queue.length)return;
 cancelSpeech();
 const target=f.queue[f.pos];
 const button=[...document.querySelectorAll('#flyingArena .swarm-word')].find(b=>b.dataset.id===target.id);
 if(button){flyMotion.items.delete(target.id);button.remove()}
 f.lock=false;f.pos++;
 if(f.pos>=f.queue.length){stopFlyMotion();render();return}
 updateFlyHud();setFlyGuide('🎧 Lắng nghe từ tiếp theo. Chỉ chọn một lần!');
 speak(f.queue[f.pos].word,3);
}

// Động cơ chữ bay 2D: mọi từ được vẽ trong cùng một sân chơi,
// vị trí và vận tốc độc lập; chạm cạnh thì nảy ngược.
const flyMotion={raf:0,items:new Map(),arena:null,last:0};
function stopFlyMotion(){if(flyMotion.raf)cancelAnimationFrame(flyMotion.raf);flyMotion.raf=0;flyMotion.items.clear();flyMotion.arena=null;flyMotion.last=0}
function startFlyMotion(){
 stopFlyMotion();const arena=document.getElementById('flyingArena'),f=state.flying;if(!arena||!f)return;
 flyMotion.arena=arena;
 const nodes=[...arena.querySelectorAll('.swarm-word')];
 const width=Math.max(235,arena.clientWidth),cols=Math.max(2,Math.floor(width/(width<450?135:150))),rows=Math.ceil(nodes.length/cols);
 const cellH=width<450?67:67;
 arena.style.height=Math.max(width<450?500:440,Math.min(3000,rows*cellH+44))+'px';
 const height=arena.clientHeight;
 const order=shuffle([...nodes.keys()]);
 nodes.forEach((node,i)=>{
  const slot=order[i],col=slot%cols,row=Math.floor(slot/cols),cellW=width/cols;
  const bw=node.offsetWidth,bh=node.offsetHeight;
  const x=Math.max(4,Math.min(width-bw-5,col*cellW+(cellW-bw)/2+(Math.random()-.5)*12));
  const y=Math.max(4,Math.min(height-bh-5,8+row*cellH+Math.max(0,(cellH-bh)/2)+(Math.random()-.5)*8));
  const rad=Math.random()*Math.PI*2,speed=(width<450?31:48)+Math.random()*(width<450?28:50);
  const particle={node,id:node.dataset.id,x,y,w:bw,h:bh,vx:Math.cos(rad)*speed,vy:Math.sin(rad)*speed};
  flyMotion.items.set(particle.id,particle);
  node.style.transform=`translate3d(${x}px,${y}px,0)`;
 });
 flyMotion.last=0;
 function animate(t){
  if(flyMotion.arena!==arena||state.page!=='game'||state.game!=='fly')return;
  const dt=Math.min(.05,(t-(flyMotion.last||t))/1000);flyMotion.last=t;
  const W=arena.clientWidth,H=arena.clientHeight;
  if(!f.paused&&!document.hidden&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
   for(const part of flyMotion.items.values()){
    part.x+=part.vx*dt;part.y+=part.vy*dt;
    if(part.x<3){part.x=3;part.vx=Math.abs(part.vx)}
    if(part.x+part.w>W-3){part.x=Math.max(3,W-part.w-3);part.vx=-Math.abs(part.vx)}
    if(part.y<3){part.y=3;part.vy=Math.abs(part.vy)}
    if(part.y+part.h>H-3){part.y=Math.max(3,H-part.h-3);part.vy=-Math.abs(part.vy)}
    part.node.style.transform=`translate3d(${part.x.toFixed(1)}px,${part.y.toFixed(1)}px,0)`;
   }
  }
  flyMotion.raf=requestAnimationFrame(animate);
 }
 flyMotion.raf=requestAnimationFrame(animate);
}
function toggleFlyMotion(){const f=state.flying;if(!f)return;f.paused=!f.paused;const b=document.querySelector('#flyPause');if(b)b.textContent=f.paused?'▶ Cho chữ bay tiếp':'⏸ Tạm dừng chữ bay'}
function setFlyGuide(message){const el=document.querySelector('#flyGuide');if(el)el.textContent=message}
function updateFlyHud(){const f=state.flying;if(!f)return;const fields={flyScore:f.score,flyCorrect:f.correct,flyRemaining:f.queue.length-f.pos,flyBottomScore:f.score,flyCounter:`Đã làm ${f.pos}/${f.queue.length} từ · Sai ${f.wrong}`};for(const [id,value]of Object.entries(fields)){const el=document.getElementById(id);if(el)el.textContent=value}const p=document.querySelector('.fly-full .progress-bar');if(p)p.style.width=`${f.queue.length?f.pos/f.queue.length*100:0}%`;const bar=document.querySelector('.fly-full .progress-track');if(bar)bar.setAttribute('aria-valuenow',String(f.pos))}

app.addEventListener('click',clickHandler);
app.addEventListener('change',e=>{let id=e.target.dataset.selectId;if(!id)return;let set=selected();if(e.target.checked)set.add(id);else set.delete(id);save();let prevScroll=window.scrollY;render();window.scrollTo(0,prevScroll)});
app.addEventListener('input',e=>{if(e.target.dataset.semWrite){if(semSubmitted())return;semRecord()[Number(e.target.dataset.semWrite)]=e.target.value;semPersist();return;}if(e.target.id==='termSearch'){let p=e.target.selectionStart;state.search=e.target.value;let prevScroll=window.scrollY;render();let next=document.querySelector('#termSearch');next?.focus();next?.setSelectionRange(p,p);window.scrollTo(0,prevScroll)}});
document.querySelector('#homeBtn').addEventListener('click',()=>{tickSound();topHome()});document.querySelector('#semesterBtn').addEventListener('click',()=>{tickSound();cancelSpeech();state.page='semester';render();scrollUp()});document.querySelector('#soundBtn').addEventListener('click',()=>{state.sound=!state.sound;tickSound();render()});
window.addEventListener('pagehide',cancelSpeech);
render();
</script>
